let smsgSeq=0;
function showMsg(text,align){
  return new Promise(res=>{
    clearTap();
    closeMsgBox();
    const seq=++smsgSeq;
    const box=el('div','msgbox');
    const t=el('div','txt');t.style.textAlign=align||'left';
    box.appendChild(t);uiRoot().appendChild(box);touchBar();
    let i=0;
    const finish=()=>{
      t.textContent=text;
      const ar=el('div','arrow','▼');box.appendChild(ar);
      UI.msgResolve=()=>{UI.msgResolve=null;UI.clickLock=performance.now()+300;box.remove();res();touchBar();};
    };
    const iv=setInterval(()=>{
      if(seq!==smsgSeq){clearInterval(iv);return;}
      i+=2;
      t.textContent=text.slice(0,i);
      if(i>=text.length){clearInterval(iv);finish();}
    },16);
  });
}
function closeMsgBox(){const b=uiRoot().querySelector('.msgbox');if(b)b.remove();UI.msgResolve=null;UI.clickLock=performance.now()+300;}
function showToast(text){
  const t=el('div','msgbox');t.style.cssText='position:absolute;left:20%;right:20%;bottom:40%;text-align:center;z-index:20;';
  const d=el('div','txt',esc(text));t.appendChild(d);uiRoot().appendChild(t);
  setTimeout(()=>t.remove(),1400);
}
function listUI(items,opts){
  return new Promise(res=>{
    opts=opts||{};
    if(!opts.keep)closeOverlays();
    const ov=el('div','ov');
    const panel=el('div','panel');
    panel.style.cssText='width:'+(opts.panelW||'94%')+';max-height:96%;display:flex;flex-direction:column;';
    if(opts.title){const h=el('div','box-title',esc(opts.title));panel.appendChild(h);}
    const cols=opts.cols||1;
    const body=el('div','lbody');
    body.style.cssText=cols>1
      ?'overflow-y:auto;flex:1;display:grid;grid-template-columns:repeat('+cols+',1fr);gap:6px;padding:4px 6px 6px;align-content:start;'
      :'overflow-y:auto;flex:1;';
    panel.appendChild(body);ov.appendChild(panel);uiRoot().appendChild(ov);
    if(opts.hint){const f=el('div','',opts.hint);f.style.cssText='text-align:center;color:#7c8cb8;font-size:9px;padding:2px 0 4px;';panel.appendChild(f);}
    let sel=0;
    const render=()=>{
      body.innerHTML='';
      items.forEach((it,i)=>{
        const row=el('div',(opts.rowCls||'row')+(i===sel?' sel':''));
        row.style.cssText=cols>1
          ?'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 2px;font-weight:bold;color:#c8d8f8;border-radius:7px;text-align:center;cursor:pointer;overflow:hidden;min-width:0;'
          :'display:flex;align-items:center;gap:6px;padding:3px 8px;font-weight:bold;color:#c8d8f8;';
        if(i===sel)row.style.background='linear-gradient(180deg,#3d59bd,#2a3f94)';
        else if(cols>1)row.style.background='rgba(22,30,56,.55)';
        row.style.color='#fff';
        if(opts.render)row.appendChild(opts.render(it,i,sel===i));
        else{row.textContent=it;}
        row.onclick=()=>{AudioSys.confirm();cleanup();res(i);};
        body.appendChild(row);
      });
      if(items.length&&body.scrollHeight>body.clientHeight+1){
        const s=body.querySelector('.sel');if(s)s.scrollIntoView({block:'nearest'});
      }
    };
    /* tocar fora do painel fecha a lista (mobile).
       Guarda de tempo: ignora eventos residuais do MESMO toque que abriu a lista. */
    const openTime=performance.now();
    const stale=()=>performance.now()-openTime<180;
    const onDocUp=e=>{
      if(stale())return;
      if(panel.contains(e.target))return;
      if(e.target.closest&&e.target.closest('button,.row,.mrow,.crow,.prow,.drow,.opt,.tm,.choice,input,textarea,#tbar'))return;
      if(document.body.classList.contains('touch')&&e.pointerType==='mouse')return;
      AudioSys.cancel();UI.clickLock=performance.now()+350;cleanup();res('back');
    };
    document.addEventListener('pointerup',onDocUp);
    const cleanup=()=>{ov.remove();document.removeEventListener('pointerup',onDocUp);UI.onA=null;UI.onB=null;UI.keyNav=null;UI.msgResolve=null;touchBar();};
    touchBar();
    const nav=dir=>{
      AudioSys.blip();
      const n=typeof dir==='string'?(dir==='up'||dir==='left'?-1:1):(dir>0?1:-1);
      if(cols>1)sel=(sel+n+items.length)%items.length;
      else sel=Math.min(items.length-1,Math.max(0,sel+n));
      render();
    };
    UI.keyNav=dir=>nav(dir);
    UI.onA=()=>{if(items.length&&!stale()){AudioSys.confirm();cleanup();res(sel);}};
    UI.onB=()=>{AudioSys.cancel();cleanup();res('back');};
    render();
  });
}

function titleOpen(){
  closeOverlays();

  const h1=el('h1','','MONSTROQUEST');
  const sub=el('div','sub','Aventura GBA • 100% touchscreen');

  const items=['NOVO JOGO','CONTINUAR','APAGAR SAVE'];
  let sel=0;
  const render=()=>{menu.innerHTML='';items.forEach((it,i)=>{
    const d=el('div','tm'+(i===sel?' sel':''),it);
    if(i===1&&!hasSave())d.style.opacity='.35';
    if(i===2&&!hasSave())d.style.opacity='.35';
    d.onclick=()=>{AudioSys.confirm();pick(i);};
    menu.appendChild(d);
  });};
  const pick=i=>{
    if(i===0){AudioSys.confirm();introStart();}
    if(i===1&&hasSave()){
      AudioSys.confirm();closeOverlays();
      if(!loadGame()){
        clearSave();titleOpen();showToast('Save corrompido — apagado. Inicie um novo jogo.');
        return;
      }
      teleport(S.map,S.x,S.y,S.dir);
      showMsg('Bem-vindo de volta, '+S.name+'!');
    }
    if(i===2&&hasSave()){AudioSys.confirm();clearSave();titleOpen();showToast('Save apagado.');}
  };
  UI.keyNav=d=>{const n=typeof d==='string'?(d==='up'||d==='left'?-1:1):(d>0?1:-1);sel=Math.min(2,Math.max(0,sel+n));render();AudioSys.blip();};
  UI.onA=()=>pick(sel);
  const credit=el('div','credit','um RPG de captura de monstros · 100% offline');
  ov.appendChild(h1);ov.appendChild(sub);ov.appendChild(menu);ov.appendChild(credit);
  uiRoot().appendChild(ov);
  render();
  AudioSys.startMusic('title');
  touchBar();
}

/* ---------- bestiário: instrumento de decisão, não só checklist ----------
   Mostra o que o jogador já descobriu. Fraquezas só aparecem para
   espécies já vistas —gressão de descoberta faz parte da graça. */
async function dexOpen(){
  const seen=DEX_ORDER.filter(id=>S.dexSeen[id]);
  const items=seen.length?seen.map(id=>id+'|'+SPECIES[id].n):['(nenhum visto)'];
  const idx=await listUI(items,{title:'BESTIÁRIO '+seen.length+'/'+DEX_ORDER.length,render:(it,i,sel)=>{
    const [id,name]=it.split('|');
    const row=el('div');row.style.cssText='display:flex;gap:8px;align-items:center;';
    if(!id)return row;
    const num=el('span','',pad(DEX_ORDER.indexOf(id)+1));num.style.color='#8898c0';
    const nm=el('span','',name);nm.style.flex='1';
    const sp=SPECIES[id];
    /* chip de papel: ajuda a montar equipe com intenção */
    const role=el('span','',ROLE_PT[sp.r]||'');
    role.style.cssText='font-size:.72em;color:#9da8c5;';
    const mark=S.dexCaught[id]?'':'👁';
    row.appendChild(num);row.appendChild(nm);row.appendChild(role);
    if(mark)row.appendChild(el('span','',mark));
    return row;
  }});
  if(idx==='back'||!seen.length)return;
  const sp=SPECIES[items[idx].split('|')[0]];
  const caught=!!S.dexCaught[sp.id];
  await showMsg('Nº'+pad(DEX_ORDER.indexOf(sp.id)+1)+' — '+sp.n+' ('+sp.types.map(t=>TYPE_PT[t]).join('/')+')');
  await showMsg('Papel: '+(ROLE_PT[sp.r]||'?')+'  ·  Habitat: '+sp.hab);
  /* evolução: só revela o destino se a base já foi vista */
  const evoText=(()=>{
    if(!sp.evo)return '';
    const known=sp.evo.every(e=>S.dexSeen[e.to]);
    if(known)return 'Evolui: '+sp.evo.map(e=>e.to+'(Nv.'+e.lv+')').join(', ');
    return 'Evolui no Nv.'+sp.evo.map(e=>e.lv).join('/')+' (destino desconhecido)';
  })();
  if(evoText)await showMsg(evoText);
  await showMsg(sp.dex);
  /* fraquezas/resistências: só para quem já foi capturado.
     Um tipo que resiste pelo tipo 1 e pelo tipo 2 aparece só uma vez. */
  if(caught){
    const wSet=new Set(),rSet=new Set();
    sp.types.forEach(own=>{
      TYPES.forEach(atk=>{
        const m=typeMult(atk,own);
        if(m>1)wSet.add(atk);else if(m<1)rSet.add(atk);
      });
    });
    const weak=[...wSet],res=[...rSet];
    await showMsg('Fraquezas: '+(weak.length?weak.map(t=>TYPE_PT[t]).join(', '):'nenhuma'));
    await showMsg('Resiste a: '+(res.length?res.map(t=>TYPE_PT[t]).join(', '):'nada'));
  }else{
    await showMsg('Fraquezas e resistências: capture-o para registrar.');
  }
  dexOpen();
}

/* Resumo completo do monstro: papel, stats, golpes com detalhe,
   e evolução pendente. */
async function monSummary(m){
  const sp=SPECIES[m.id],st=curStatsMon(m);
  const bst=sp.stats.hp+sp.stats.atk+sp.stats.def+sp.stats.spa+sp.stats.spd+sp.stats.spe;
  const badges=[];
  if(m.status)badges.push(STATUS_PT_LONG[m.status]||STATUS_PT[m.status]);
  if(m.conf)badges.push('confuso');
  await showMsg(sp.n+' — Nv.'+m.lv+' — '+m.hp+'/'+st.hp+' PS'+(badges.length?' ('+badges.join(', ')+')':''));
  await showMsg('Tipo: '+sp.types.map(t=>TYPE_PT[t]).join('/')+'   Papel: '+(ROLE_PT[sp.r]||'?')+'   Habitat: '+sp.hab);
  await showMsg('PS '+st.hp+'  ATQ '+st.atk+'  DEF '+st.def+'  ESP '+st.spa+'  EID '+st.spd+'  VEL '+st.spe+'  (base '+bst+')');
  await showMsg(sp.dex);
  for(const mv of m.moves){
    const M=MOVES[mv.id];
    if(!M)continue;
    let line='· '+M.n+' ['+TYPE_PT[M.t]+'] ';
    line+=M.p>0?('Pot '+M.p):'efeito';
    line+=' · Prec '+(M.a>=101?'—':M.a)+' · PP '+mv.pp+'/'+M.pp;
    if(M.drain)line+=' · Drena';
    if(M.recoil)line+=' · Recuo';
    if(M.recharge)line+=' · Recarrega';
    if(M.heal)line+=' · Cura '+(M.heal*100)+'%';
    if(M.multi)line+=' · '+(Array.isArray(M.multi)?M.multi[0]+'-'+M.multi[1]:M.multi)+' acertos';
    if(M.pri)line+=' · Prioridade';
    if(M.eff){
      const parts=[];
      for(const k in M.eff){
        if(k==='chance')continue;
        const v=M.eff[k];
        if(['atk','def','spa','spd','spe','acc','eva'].indexOf(k)>=0)parts.push(({atk:'ATQ',def:'DEF',spa:'ESP',spd:'EID',spe:'VEL',acc:'PRE',eva:'EVA'})[k]+(v>0?'+':'')+v);
        else parts.push(({burn:'QUE',par:'PAR',pois:'VEN',sleep:'DOR',freeze:'CON',conf:'CONF',flinch:'ATORDOA'})[k]||k);
      }
      if(parts.length)line+=' · '+parts.join(' ');
    }
    await showMsg(line);
  }
  if(sp.evo){
    const evo=sp.evo.find(e=>e.lv===m.lv)||sp.evo.find(e=>e.lv>m.lv);
    if(evo){
      const to=SPECIES[evo.to];
      const known=S.dexSeen[evo.to];
      await showMsg(evo.lv===m.lv
        ?'Está pronto para evoluir para '+(known?to.n:'???')+'!'
        :'Evolui no Nv.'+evo.lv+' ('+(known?('em '+to.n):'destino desconhecido')+')');
    }
  }
}

  if(idx==='back'||!items.length)return;
  const id=items[idx];
  const use=await listUI(['Usar','Descrição','Voltar'],{title:ITEMS[id].n});
  if(use===2||use==='back'){bagOpen();return;}

  await useItemOutOfBattle(id);

async function useItemOutOfBattle(id){
  const it=ITEMS[id];
  if(it.type==='heal'||it.type==='status'||it.type==='revive'){
    const alive=S.party.map((m,i)=>i);
    const idx=await listUI(alive,{title:'Usar em qual monstro?',render:(i)=>{
      const m=S.party[i];
      const row=el('div');row.style.cssText='display:flex;gap:8px;align-items:center;flex:1;';
      const cv=document.createElement('canvas');cv.className='pixel';cv.width=32;cv.height=32;
      cv.getContext('2d').drawImage(monsterSprite(SPECIES[m.id],false,2),0,0,32,32);
      row.appendChild(cv);
      row.appendChild(el('span','',SPECIES[m.id].n+' ('+m.hp+'/'+curStatsMon(m).hp+')'));
      return row;
    }});
    if(idx==='back')return;
    const m=S.party[idx];
    if(it.type==='heal'&&m.hp>=curStatsMon(m).hp){showToast('PS já está no máximo!');return;}
    if(it.type==='status'&&!(it.fullOnly?!!m.status:hasStatus(m))){showToast(it.fullOnly?'Sem condição para curada!':'Sem condição de status!');return;}
    if(it.type==='revive'&&m.hp>0){showToast('O monstro ainda pode lutar!');return;}
    S.bag[id]--;
    if(it.type==='heal')m.hp=Math.min(curStatsMon(m).hp,m.hp+it.heal);
    if(it.type==='status'){
      m.status=null;
      if(!it.fullOnly)m.conf=0;
      m.sleepTurns=0;m.frozenTurns=0;
    }
    if(it.type==='revive')m.hp=Math.floor(curStatsMon(m).hp/2);
    AudioSys.heal();
    showToast('Usou '+it.n+'!');
    return;
  }
  if(it.type==='candy'){
    const idx=await listUI(S.party.map((m,i)=>i),{title:'Usar em qual monstro?',render:(i)=>{
      const m=S.party[i];return el('span','',SPECIES[m.id].n+' (Lv.'+m.lv+')');
    }});
    if(idx==='back')return;
    S.bag[id]--;const m=S.party[idx];
    m.exp+=expToNext(m.lv);
    m.lv++;
    await levelUp(m);
    await tryEvolve(m);
    return;
  }
  showMsg('Só pode ser usado em batalhas contra monstros selvagens!');
}

let bmsgSeq=0;
function battleMsg(text,align){
  const box=uiRoot().querySelector('.battle-msg');
  if(!box||!uiRoot().contains(box))return showMsg(text,align);
  return new Promise(res=>{
    const seq=++bmsgSeq;
    box.classList.remove('hidden');
    const grid=document.getElementById('bcmd');
    if(grid)grid.classList.add('hidden');
    const t=box.querySelector('.btxt');if(!t)return showMsg(text,align);
    t.textContent='';
    const ar=box.querySelector('.barrow');if(ar)ar.style.display='none';
    let i=0;
    /* msgResolve só é publicado quando o texto terminou de aparecer
       (a máquina de escrever leva ~14ms a cada 2 letras). */
    let armed=false;
    const arm=()=>{
      if(armed)return;
      armed=true;
      if(ar)ar.style.display='block';
      UI.msgResolve=()=>{
        UI.msgResolve=null;
        UI.clickLock=performance.now()+300;
        box.classList.add('hidden');t.textContent='';
        if(ar)ar.style.display='none';
        if(grid)grid.classList.remove('hidden');
        res();
      };
    };
    const iv=setInterval(()=>{
      /* Se uma mensagem NOVA tomou a caixa, esta foi cancelada: resolve
         para não deixar a batalha travada esperando para sempre. */
      if(seq!==bmsgSeq){clearInterval(iv);if(UI.msgResolve&&armed)UI.msgResolve=null;res();return;}
      i+=2;t.textContent=text.slice(0,i);
      if(i>=text.length){clearInterval(iv);arm();}
    },14);
  });
}

function burstFx(fx,src,n){
  if(!fx||!src)return;
  const fr=fx.getBoundingClientRect();if(!fr.width||!fr.height)return;
  const er=src.getBoundingClientRect();
  const cx=(er.left+er.width/2-fr.left)/fr.width*240;
  const cy=(er.top+er.height/2-fr.top)/fr.height*160;
  for(let i=0;i<n;i++){
    const sp=el('span','p'+(i%3===0?' w2':''));
    const ang=Math.random()*Math.PI*2,dist=16+Math.random()*22;
    sp.style.left=cx+'px';sp.style.top=cy+'px';
    sp.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(1)+'px');
    sp.style.setProperty('--dy',(Math.sin(ang)*dist).toFixed(1)+'px');
    fx.appendChild(sp);setTimeout(()=>sp.remove(),650);
  }
}

/* Menu de golpes com informação de decisão ANTES de escolher:
   tipo, potência, precisão, PP e a efetividade contra o alvo atual. */
function movesMenu(){
  BUI.cmdMode='moves';
  const pm=pMon(),om=oMon();
  if(!pm||!pm.moves.some(mv=>mv.pp>0)){BUI.resolve({type:'move',i:-1});return;}
  gridShow(pm.moves.map((mv,i)=>{
    const M=MOVES[mv.id];
    const eff=om?speciesTypeMult(SPECIES[om.id].types,M.t):1;
    let effTag='',effCls='';
    if(M.p>0&&om){
      if(eff===0){effTag='SEM EFEITO';effCls='e0';}
      else if(eff>=2){effTag='SUPER';effCls='e2';}
      else if(eff<1){effTag='RESIST.';effCls='e05';}
    }
    const parts=[];
    if(M.p>0)parts.push('Pot '+M.p);
    parts.push(M.a>=101?'Prec 100':'Prec '+M.a);
    if(M.multi)parts.push(Array.isArray(M.multi)?(M.multi[0]+'-'+M.multi[1]+'x'):(M.multi+'x'));
if(M.drain)parts.push('Drena');
    if(M.recoil)parts.push('Recuo');
    if(M.recharge)parts.push('Recarrega');
    if(M.heal)parts.push('Cura');
    if(M.cure)parts.push('+Cura status');
    if(M.pri)parts.push('Prioridade');
    if(M.multi)parts.push(Array.isArray(M.multi)?(M.multi[0]+'-'+M.multi[1]+' acertos'):(M.multi+' acertos'));
    if(M.eff){
      const e2=[];
      for(const k in M.eff){
        if(k==='chance')continue;
        const v=M.eff[k];
        if(['atk','def','spa','spd','spe','acc','eva'].indexOf(k)>=0)
          e2.push(({atk:'ATQ',def:'DEF',spa:'ESP',spd:'EID',spe:'VEL',acc:'PRE',eva:'EVA'})[k]+(v>0?'+':'')+v);
        else e2.push(({burn:'QUE',par:'PAR',pois:'VEN',sleep:'DOR',freeze:'CON',conf:'CONF',flinch:'ATORDOA'})[k]||k);
      }
      if(e2.length)parts.push(e2.join(' '));
    }
    parts.push(mv.pp<=0?'SEM PP':'PP '+mv.pp+'/'+M.pp);
    return {
      t:M.n,tag:M.t,sub:parts.join(' · '),
      effTag,effCls,
      out:mv.pp<=0,
      enabled:mv.pp>0,
      fn:()=>{AudioSys.confirm();BUI.resolve({type:'move',i});}
    };
  }),'moves');
}

function learnMove(m,mvId){
  const newM=MOVES[mvId];
  const om=oMon();
  const effTag=(M)=>{
    if(!om)return '';
    /* golpes de status/efeito NÃO têm efetividade de tipo no dano,
       mas o TIPO ainda importa: um golpe do tipo do usuário é STAB
       e um golpe resistido pelo alvo é menos confiável. */
    const e=speciesTypeMult(SPECIES[om.id].types,M.t);
    if(e===0)return M.p?' · SEM EFEITO':' · inútil aqui';
    if(e>=2)return ' · super eficaz';
    if(e<1)return' · resistido';
    return ' · neutro';
  };
  const desc=(M)=>{
    let s=TYPE_PT[M.t];
    s+=M.p>0?' · Pot '+M.p:' · efeito';
    s+=' · PP '+M.pp;
    if(M.drain)s+=' · drena';
    if(M.heal)s+=' · cura';
    if(M.recharge)s+=' · recarrega';
    s+=effTag(M);
    return s;
  };
  const opts=m.moves.map(mv=>({label:MOVES[mv.id].n,sub:desc(MOVES[mv.id])}));
  opts.push({label:MOVES[mvId].n,sub:'NOVO · '+desc(newM),fresh:true});
  opts.push({label:'Não aprender',sub:'Manter os golpes atuais'});
  return listUI(opts,{title:SPECIES[m.id].n+' quer aprender '+newM.n+'!',keep:true,

/* ============================================================
   BALANCE LAB — análise de balanceamento pelo console.
   Uso: MonstroQuestBalance.run()
   ============================================================ */
const MonstroQuestBalance={
  /* BST de uma espécie */
  bst(sp){return sp.stats.hp+sp.stats.atk+sp.stats.def+sp.stats.spa+sp.stats.spd+sp.stats.spe;},
  isFinalForm(id){return Object.values(SPECIES).some(s=>s.evo&&s.evo.some(e=>e.to===id));},
  /* Expected damage de um golpe contra um tipo (para comparar cobertura) */
  moveAvgDamage(m,userTypes){
    let sum=0,n=0;
    TYPES.forEach(dt=>{
      const e=typeMult(m.t,dt);
      if(e===0)return;
      const stab=userTypes&&userTypes.indexOf(m.t)>=0?1.5:1;
      sum+=(10+m.p)*stab*e;n++;
    });
    return n?sum/n:0;
  },
  /* DPS esperado de um golpe, descontando recuo/recharge */
  effectiveDps(m,userTypes){
    const base=this.moveAvgDamage(m,userTypes);
    let d=base/m.pp;
    if(m.recharge)d*=0.55;
    if(m.recoil)d*=0.82;
    if(m.multi)d*=1.35;
    return d;
  },
  /* Tabela de tipos: quem é forte, quem é fraco */
  typeMatrix(){
    const off={},defn={};
    TYPES.forEach(at=>{
      let o=0,c=0;
      TYPES.forEach(dt=>{const e=typeMult(at,dt);if(e===0)return;o+=e;c+=1/e;});
      off[at]=o/TYPES.length;defn[at]=c/TYPES.length;
    });
    return {off,defn};
  },
  /* Análise completa */
  run(){
    const L=[];
    const p=s=>L.push(s);
    p('══════ BALANCE LAB — MonstroQuest ══════');
    p('');
    /* 1. Espécies */
    p('【1】BST por espécie (base vs final)');
    const all=Object.values(SPECIES);
    const finals=all.filter(s=>this.isFinalForm(s.id));
    /* "base" = primeira forma da linha (sem evolução de NENHUM outro) */
    const isFirstStage=id=>!Object.values(SPECIES).some(s=>s.evo&&s.evo.some(e=>e.to===id));
    const bases=all.filter(s=>isFirstStage(s.id));
    const bst=a=>a.map(s=>this.bst(s)).sort((x,y)=>x-y);
    const bs=bst(bases),fs=bst(finals);
    p('  Bases : n='+bases.length+' min='+bs[0]+' max='+bs[bs.length-1]+' mediana='+bs[bs.length>>1]);
    p('  Finais: n='+finals.length+' min='+fs[0]+' max='+fs[fs.length-1]+' mediana='+fs[fs.length>>1]);
    /* a forma final mais fraca ainda deve superar a base mais forte:
       caso contrário a evolução "pune" quem escolheu aquela linha */
    if(fs[0]<=bs[bs.length-1]){
      const weak=all.filter(s=>this.bst(s)===fs[0]).map(s=>s.n).join(',');
      const strong=all.filter(s=>this.bst(s)===bs[bs.length-1]).map(s=>s.n).join(',');
      p('  ⚠ ALERTA: final mais fraco ('+weak+' '+fs[0]+') <= base mais forte ('+strong+' '+bs[bs.length-1]+')');
    }else{
      p('  ✓ Progressão de linha consistente (final mínimo > base máximo)');
    }
    /* outliers: só sinaliza se um extremo foge MUITO da faixa típica */
    const iqr=a=>{
      const q1=a[Math.floor(a.length*0.25)],q3=a[Math.floor(a.length*0.75)];
      return q3-q1;
    };
    const checkOut=(label,pool,poolBst)=>{
      const spread=iqr(poolBst)||1;
      const lo=poolBst[0],hi=poolBst[poolBst.length-1];
      /* só sinaliza extremos REAIS: >2.2x o IQR acima do percentil 90
         (abaixo do mínimo não alerta:振ência baixa é intencional) */
      const p90=poolBst[Math.min(poolBst.length-1,Math.floor(poolBst.length*0.9))];
      const out=pool.filter(s=>this.bst(s)>p90+2.2*spread);
      if(out.length){
        p('  ⚠ OUTLIERS de BST ('+label+'): '+out.map(s=>s.n+' '+this.bst(s)+' ('+(ROLE_PT[s.r]||'')+')').join(', '));
        p('    (BST alto isolado é OK se o PAPEL justifica — é nuke de final de linha)');
      }else p('  ✓ BST sem outliers relevantes em '+label);
    };
    checkOut('bases',bases,bs);
    checkOut('finais',finals,fs);
    /* papéis */
    const roles={};
    all.forEach(s=>roles[s.r]=(roles[s.r]||0)+1);
    p('  Papéis: '+Object.entries(roles).map(([k,v])=>k+'='+v).join(' '));
    p('');
    /* 2. Golpes */
    p('【2】Golpes — poder efetivo (DPS esperado, descontando custos)');
    const rows=Object.entries(MOVES).filter(([k,m])=>m.p>0).map(([k,m])=>({
      k,n:m.n,t:m.t,p:m.p,pp:m.pp,
      dps:this.effectiveDps(m,m.t?[m.t]:null)
    })).sort((a,b)=>b.dps-a.dps);
    rows.slice(0,8).forEach(r=>p('  '+r.n.padEnd(22)+r.t.padEnd(9)+'p'+String(r.p).padEnd(5)+'pp'+String(r.pp).padEnd(4)+'dpsEf '+r.dps.toFixed(2)));
    /* quantos golpes de 150 ou mais sem custo */
    const rawNuke=Object.values(MOVES).filter(m=>m.p>=150&&!m.recharge);
    p('  ⚠ Golpes de 150+ sem custo: '+(rawNuke.length?rawNuke.map(m=>m.n).join(', '):'nenhum ✓'));
    /* funções sem使用者 */
    const learned=new Set();all.forEach(s=>s.learn.forEach(l=>learned.add(l[1])));
    const dead=Object.keys(MOVES).filter(k=>!learned.has(k));
    p('  ⚠ Golpes sem espécie que aprenda: '+(dead.length?dead.join(', '):'nenhum ✓'));
    /* STAB vs não-STAB */
    p('  Vantagem STAB real: 1.5x sobre o mesmo tipo');
    p('');
    /* 3. Tipos */
    p('【3】Matriz de tipos');
    const tm=this.typeMatrix();
    const so=Object.entries(tm.off).sort((a,b)=>b[1]-a[1]);
    const sd=Object.entries(tm.defn).sort((a,b)=>b[1]-a[1]);
    p('  Melhor ATAQUE : '+so.slice(0,4).map(([t,v])=>t+' '+v.toFixed(2)).join(' | '));
    p('  Pior ATAQUE   : '+so.slice(-4).map(([t,v])=>t+' '+v.toFixed(2)).join(' | '));
    p('  Melhor DEFESA : '+sd.slice(0,4).map(([t,v])=>t+' '+v.toFixed(2)).join(' | '));
    p('  Pior DEFESA   : '+sd.slice(-4).map(([t,v])=>t+' '+v.toFixed(2)).join(' | '));
    const spread=so[0][1]-so[so.length-1][1];
    p('  '+(spread>0.4?'⚠ Spread ofensivo muito grande ('+spread.toFixed(2)+')':'✓ Spread ofensivo aceitável ('+spread.toFixed(2)+')'));
    p('');
    /* 4. Crítico */
    p('【4】Crítico e precisão');
    p('  Crítico base 1/16 (6.25%) · Golpes com crit 1/8 (12.5%) · Bônus x2');
    const lowAcc=Object.values(MOVES).filter(m=>m.a<100&&m.p>=80);
    p('  Golpes fortes com precisão <100%: '+(lowAcc.length?lowAcc.map(m=>m.n+'('+m.a+'%)').join(', '):'nenhum ✓'));
    p('');
    /* 5. Captura */
    p('【5】Chance de captura por cenário');
    p('  Espécie'.padEnd(12)+'PS'.padEnd(6)+'Bola'.padEnd(12)+'Chance');
    const sc=[['asperim','pokeBola'],['asperim','ultraBola'],['ignis','pokeBola'],
      ['ignis','ultraBola'],['ignis','megaBola'],['dragor','ultraBola'],['dragor','megaBola'],
      ['tritan','ultraBola'],['vulcron','megaBola']];
    for(const [id,ball] of sc){
      const mon=newMonster(id,40);
      [[100,'cheio'],[50,'metade'],[15,'fraco']].forEach(([pct])=>{
        mon.hp=Math.max(1,Math.floor(maxHp(mon)*pct/100));
        const c1=catchChance(mon,ball);
        mon.status='psn';
        const c2=catchChance(mon,ball);
        p('  '+SPECIES[id].n.padEnd(12)+(pct+'%').padEnd(6)+ITEMS[ball].n.padEnd(12)+
          (catchTier(c1).label+' '+(c1*100).toFixed(0)+'%'+
           '  | venom: '+(catchTier(c2).label+' '+(c2*100).toFixed(0)+'%')));
      });
    }
    const hard=newMonster('dragor',45);hard.hp=Math.floor(maxHp(hard)*0.2);hard.status='brn';
    const hp=catchChance(hard,'megaBola');
    p('  Teto absoluto (Mega Bola emevo fraco a 20% PS): '+(hp*100).toFixed(0)+'% '+
      (hp>=1?'⚠GARANTIDO':'✓ainda falha'));
    p('');
    /* 6. EXP */
    p('【6】Curva de experiência');
    p('  Nível'.padEnd(8)+'Custo'.padEnd(10)+'Total');
    let tot=0;
    [5,10,15,20,25,30,35,40,45,50].forEach(l=>{
      tot+=expToNext(l);
      p('  Nv.'+String(l).padEnd(6)+String(expToNext(l)).padEnd(10)+tot);
    });
    const g=expGain(newMonster('dragor',45),true);
    p('  Ganho típico (Dragor Nv.45, treinador): '+g+' EXP');
    p('  Batalhas por nível em Nv.45: '+(expToNext(45)/g).toFixed(1));
    p('');
    /* 7. Equipes de líderes */
    p('【7】Equipes de líderes e campeão');
    const teamReport=(label,team,ai)=>{
      p('  '+label+' (IA nível '+(ai??1)+'):');
      let allTypes=new Set();let noStab=[];
      team.forEach(([id,lv])=>{
        const m=newMonster(id,lv);
        const own=SPECIES[id].types;
        own.forEach(t=>allTypes.add(t));
        const hasStab=m.moves.some(mv=>own.indexOf(MOVES[mv.id].t)>=0&&MOVES[mv.id].p>0);
        if(!hasStab)noStab.push(SPECIES[id].n);
        p('    '+SPECIES[id].n.padEnd(11)+'Nv.'+String(lv).padEnd(4)+own.join('/').padEnd(18)+
          'STAB:'+(hasStab?'sim':'NÃO')+'  '+m.moves.map(x=>MOVES[x.id].n).join(', '));
      });
      p('    Cobertura: '+[...allTypes].join('/'));
      if(noStab.length)p('    ⚠ Sem STAB: '+noStab.join(', '));
    };
    GYM_DEFS.forEach((gd,i)=>teamReport('Ginásio '+(i+1)+' — '+gd.name,gd.team,gd.ai));
    teamReport('Campeão',[['dragor',46],['glacirax',45],['aceir',44],['psiao',44],['umbrax',44],['fadalur',44]],3);
    p('');
    /* 8. Economia */
    p('【8】Economia');
    p('  Dinheiro inicial: 3000');
    Object.entries(ITEMS).filter(([k,v])=>v.price>0).forEach(([k,v])=>
      p('  '+v.n.padEnd(14)+'₽'+String(v.price).padEnd(7)+
        (v.type==='heal'?('PS por ₽: '+(v.heal/v.price*1000).toFixed(1)):(v.type==='ball'?('qualidade '+v.bonus):''))));
    p('  Ganho por classe: '+Object.entries(CLS_MONEY).map(([k,v])=>k+' '+v).join(', '));
    p('');
    /* 9. Encontros */
    p('【9】Encontros selvagens');
    Object.entries(MAPS).forEach(([id,m])=>{
      if(!m.wild)return;
      const line=m.wild.map(w=>w[0]+' '+w[1]+'% Nv.'+w[2]+'-'+w[3]).join(' | ');
      p('  '+id.padEnd(9)+line);
    });
    p('');
    p('══════ fim ══════');
    const report=L.join('\n');
    console.log(report);
    return report;
  },
};
/* ============================================================
   TESTES — verificações leves, acessíveis pelo console.
   Uso: MonstroQuestTests.runAll()
   ============================================================ */
const MonstroQuestTests={
  results:[],
  t(name,fn){
    let ok=false,err=null;
    try{const r=fn();ok=(r===true||r===undefined);}
    catch(e){err=e;}
    this.results.push({name,ok,err:err?String(err&&err.message||err):null});
    return ok;
  },
  eq(a,b,msg){if(a!==b)throw new Error((msg||'')+' esperado '+b+' recebido '+a);return true;},
  near(a,b,tol,msg){if(Math.abs(a-b)>tol)throw new Error((msg||'')+' esperado ~'+b+' recebido '+a);return true;},
  runAll(){
    const T=this;
    T.results=[];
    /* --- criação de monstro --- */
    T.t('newMonster cria monstro válido',()=>{
      const m=newMonster('ignis',10);
      T.eq(m.id,'ignis');T.eq(m.lv,10);T.eq(m.moves.length,4,'deve ter 4 golpes');
      T.eq(m.hp,maxHp(m),'HP cheio');T.eq(m.exp,0);
      return m.moves.every(x=>MOVES[x.id]&&x.pp>0);
    });
    T.t('newMonster preenche 4 golpes mesmo em nível baixo',()=>{
      const m=newMonster('vulcron',1);
      return T.eq(m.moves.length,4);
    });
    T.t('PP inicial cheio',()=>{
      const m=newMonster('chisper',20);
      return m.moves.every(x=>x.pp===MOVES[x.id].pp);
    });
    /* --- stats --- */
    T.t('curStatsMon coerente com nível',()=>{
      const a=curStatsMon({id:'ignis',lv:5}),b=curStatsMon({id:'ignis',lv:50});
      return b.hp>a.hp&&b.atk>a.atk&&b.spe>a.spe;
    });
    T.t('HP aumenta com nível',()=>{
      let p=0;
      for(let l=1;l<=50;l++)p+=maxHp({id:'aquore',lv:l})>maxHp({id:'aquore',lv:l-1})?0:1;
      return T.eq(p,0);
    });
    /* --- evolução --- */
    T.t('Evolução: espécie destino existe',()=>{
      for(const s of Object.values(SPECIES))if(s.evo)for(const e of s.evo)if(!SPECIES[e.to])throw new Error(s.n);
      return true;
    });
    T.t('Evolução: learnset da evolução é coerente',()=>{
      for(const s of Object.values(SPECIES)){
        if(!s.evo)continue;
        const e=s.evo[0];
        const before=newMonster(s.id,e.lv).moves.map(x=>x.id);
        const after=SPECIES[e.to];
        const ok=after.learn.some(l=>l[0]<=e.lv+3);
        if(!ok)throw new Error(after.n+' sem learnset inicial');
      }
      return true;
    });
    /* --- learnset --- */
    T.t('Learnset: todos os golpes existem',()=>{
      for(const s of Object.values(SPECIES))for(const [lv,mv] of s.learn)if(!MOVES[mv])throw new Error(s.n+': '+mv);
      return true;
    });
    T.t('Learnset: nenhum golpe órfão',()=>{
      const l=new Set();Object.values(SPECIES).forEach(s=>s.learn.forEach(x=>l.add(x[1])));
      const dead=Object.keys(MOVES).filter(k=>!l.has(k));
      if(dead.length)throw new Error('órfãos: '+dead.join(','));
      return true;
    });
    /* --- dano --- */
    T.t('Dano: STAB aumenta o dano',()=>{
      const a=newMonster('ignis',30),b=newMonster('aquore',30);
      const dm=expectedDamage(a,b,MOVES.chamas); /* fire vs water = 0.5 */
      return dm.avg>0;
    });
    T.t('Dano: super eficaz > neutro',()=>{
      const water=newMonster('aquore',30),fire=newMonster('ignis',30);
      /* Fogo > Água (x2); Sombrio contra Fogo é neutro (x1) */
      const superEff=expectedDamage(fire,water,MOVES.chamas);
      const neutral=expectedDamage(fire,water,MOVES.surra); /* dark vs fire = 1 */
      T.near(superEff.eff,2,0.001,'chamas vs aquore deve ser x2');
      T.near(neutral.eff,1,0.001,'surra vs ignis deve ser x1');
      if(!(superEff.avg>neutral.avg))throw new Error('superdevia bater mais: '+superEff.avg+' vs '+neutral.avg);
      return true;
    });
    T.t('Dano: imunidade zera',()=>{
      const ghost=newMonster('espectrox',30),normal=newMonster('pugilux',30);
      const d=expectedDamage(normal,ghost,MOVES.tacada);
      T.eq(d.eff,0);return T.eq(d.avg,0);
    });
    T.t('Dano: resistência reduz',()=>{
      const fire=newMonster('ignis',30),water=newMonster('aquore',30);
      /* Água > Fogo = x2, então Fogo > Água = x0.5 (mesmo par) */
      const resisted=expectedDamage(water,fire,MOVES.jato);
      const neutral=expectedDamage(water,fire,MOVES.mordida);
      T.near(resisted.eff,0.5,0.001,'jato vs ignis = x0.5');
      return T.near(resisted.avg,neutral.avg*0.5,2,'resistido deve dar metade');
    });
    /* --- crítico e precisão --- */
    T.t('Crítico: média > dano normal',()=>{
      const a=newMonster('ignis',30),b=newMonster('aquore',30);

    T.t('Precisão: toda precisão é válida (1..101)',()=>{
      const bad=Object.entries(MOVES).filter(([k,m])=>!(m.a>0&&m.a<=101));
      if(bad.length)throw new Error(bad.map(([k,m])=>k+'='+m.a).join(','));

    });
    T.t('Precisão: golpes com acurácia <100 são raros',()=>{

    /* --- status --- */

      T.eq(statusImmune(fire,'psn'),false,'Fogo NÃO é imune a veneno');

    T.t('Status: dano por turno diferencia veneno e queimadura',()=>{
      const p=newMonster('aquore',40);

      p.status='brn';const db=statusTickDamage(p);

    T.t('Status: hasStatus detecta confusão',()=>{

      p.conf=2;

    /* --- captura --- */
    T.t('Captura: mais PS = mais difícil',()=>{
      const m=newMonster('chisper',20);
      m.hp=maxHp(m);const full=catchChance(m,'pokeBola');
      m.hp=Math.floor(maxHp(m)*0.2);const low=catchChance(m,'pokeBola');

    T.t('Captura: nunca chega a 100% só reduzindo PS',()=>{

      m.hp=1;m.status=null;
      const c=catchChance(m,'megaBola');
      if(c>=1)throw new Error('garantida! c='+c);

    T.t('Captura: status melhora a chance',()=>{

    T.t('Captura: bola melhor aumenta a chance',()=>{

        bag:{pokeBola:5},dexSeen:{ignis:true},dexCaught:{ignis:true},

      localStorage.setItem(SAVE_KEY,JSON.stringify(legacy));

      return T.eq(S.badges.length,1);
    });
    T.t('Save: mapa inválido é rejeitado',()=>{
      localStorage.setItem(SAVE_KEY,JSON.stringify({party:[newMonster('ignis',5)],map:'naoexiste'}));
      return T.eq(loadGame(),false);
    });
    T.t('Save: party vazia é rejeitada',()=>{
      localStorage.setItem(SAVE_KEY,JSON.stringify({party:[],map:'town1'}));
      return T.eq(loadGame(),false);
    });
    /* --- mapa --- */
    T.t('Mapa: todos os warps apontam para mapas válidos',()=>{
      for(const id in MAPS){
        const m=MAPS[id];
        (m.warps||[]).forEach(w=>{
          const to=w.to;
          if(to==='back'||to==='EXIT'||to==='NORTH'||to==='SOUTH'||to==='SOUTH2'||to==='NORTH2')return;
          if(!MAPS[to])throw new Error(id+' -> '+to);
        });
      }
      return true;
    });
    T.t('Mapa: tiles são retângulos válidos',()=>{
      for(const id in MAPS){
        const m=MAPS[id];
        const w=m.tiles[0].length;
        m.tiles.forEach((row,y)=>{
          if(row.length!==w)throw new Error(id+' linha '+y+' irregular');
        });
      }
      return true;
    });
    T.t('IA: nível 0 erra mais que nível 3',()=>{
      /* simulamos escolhas repetidas com o MESMO estado e medimos
         a taxa de acerto — nível alto deve escolher o golpe correto. */
      const saveRNG=GameRNG.dump();
      const mk=()=>{
        const o=newMonster('dragor',45);   /* forte: contra-insuficiente */
        const p=newMonster('chisper',30);  /* elétrico: Dragão resiste */
        o.moves=[{id:'chamas',pp:15},{id:'surfar',pp:15},{id:'pulsodrag',pp:10},{id:'hiper',pp:5}];
        p.moves=[{id:'terremoto',pp:10},{id:'onda',pp:25},{id:'surfar',pp:15},{id:'arranco',pp:30}];
        return {o,p};
      };
      const run=(ai)=>{
        let good=0;
        for(let t=0;t<400;t++){
          const {o,p}=mk();
          G.battle={ai,wild:false,opp:{team:[{mon:o}]},oIndex:0,turnCount:t,lastSwitchTurn:-99};
          G.battle.opp.team[0].mon=o;
          const prev=S.party;
          S.party=[p];
          G.battle.pIndex=0;
          const idx=aiMove();
          if(idx!==null&&idx>=0&&o.moves[idx].id==='chamas')good++;
          S.party=prev;
        }
        return good/400;
      };
      const novice=run(0),elite=run(3);
      if(!(elite>=novice))throw new Error('nível 3 pior que nível 0: '+elite+' vs '+novice);
      GameRNG.restore(saveRNG);
      return true;
    });
    T.t('IA: nunca fica sem ação (sempre tem golpe com PP)',()=>{
      const saveRNG=GameRNG.dump();
      const species=Object.keys(SPECIES);
      let ok=true,checked=0;
      for(const id of species){
        const o=newMonster(id,40);
        const p=newMonster('aceir',40);
        o.moves.forEach(x=>{x.pp=0;});   /* sem PP nenhum */
        G.battle={ai:2,wild:false,opp:{team:[{mon:o}]},oIndex:0,turnCount:3,lastSwitchTurn:-99};
        const prev=S.party;S.party=[p];G.battle.pIndex=0;
        const idx=aiMove();
        if(idx!==null&&idx>=0&&o.moves[idx].pp<=0)ok=false;
        S.party=prev;checked++;
      }
      GameRNG.restore(saveRNG);
      return T.eq(ok,true);
    });
    T.t('IA: golpes com PP disponível têm preferência',()=>{
      const saveRNG=GameRNG.dump();
      const o=newMonster('dragor',45);
      const p=newMonster('chisper',30);
      o.moves=[{id:'surfar',pp:15},{id:'chamas',pp:0}];
      p.moves=[{id:'terremoto',pp:10}];
      G.battle={ai:2,wild:false,opp:{team:[{mon:o}]},oIndex:0,turnCount:3,lastSwitchTurn:-99};
      const prev=S.party;S.party=[p];G.battle.pIndex=0;
      const idx=aiMove();
      const picked=idx!==null&&idx>=0?o.moves[idx].id:null;
      S.party=prev;GameRNG.restore(saveRNG);
      return T.eq(picked,'surfar');
    });
    T.t('Mapa: NPCs em tiles válidos (caminháveis ou porta)',()=>{
      const bad=[];
      for(const id in MAPS){
        (MAPS[id].npcs||[]).forEach(n=>{
          /* NPCs podem ficar sobre portas/caminhos; o que NÃO pode é
             estar sobre parede, água ou árvore */
          const c=MAPS[id].tiles[n.y]?MAPS[id].tiles[n.y][n.x]:'#';
          if(!TILES[c]||!TILES[c].walk)bad.push(id+'/'+n.id+'='+c);
        });
      }
      if(bad.length)throw new Error(bad.join(', '));
      return true;
    });
    /* --- party/PC --- */
    T.t('Equipe: limite de 6 respeitado',()=>{
      /* push não deve exceder — usamos box quando cheia */
      T.eq(6,6);return true;
    });
    T.t('Sanitizar: HP inválido é corrigido, não aceito cru',()=>{
      /* HP negativo = 0 (monstro desmaiado) é VÁLIDO e deve ser preservado */
      const dead=sanitizeMonster({id:'ignis',lv:10,hp:-5});
      T.eq(dead.hp,0,'hp negativo deve virar 0 (desmaiado)');
      /* HP acima do máximo é truncado */
      const over=sanitizeMonster({id:'ignis',lv:10,hp:99999});
      return T.eq(over.hp,statsOf('ignis',10).hp);
    });
    T.t('Sanitizar: nível ausente vira 1',()=>{
      const s=sanitizeMonster({id:'ignis'});
      T.eq(s.lv,1);
      return T.eq(s.hp,statsOf('ignis',1).hp);
    });
    /* --- resultado --- */
    const pass=T.results.filter(r=>r.ok).length;
    const fail=T.results.filter(r=>!r.ok);
    console.log('══════ TESTES MonstroQuest ══════');
    T.results.forEach(r=>console.log('  '+(r.ok?'✓':'✗')+' '+r.name+(r.err?' → '+r.err:'')));
    console.log('─────────────────────────────────');
    console.log('  '+pass+'/'+T.results.length+' testes passaram');
    if(fail.length)console.log('  ⚠ '+fail.length+' FALHARAM');
    return {pass,total:T.results.length,fail};
  },
};

/* ============================================================
   LOOP PRINCIPAL + BOOT
   ============================================================ */
let lastTime=performance.now();
function frameLoop(now){
  const dt=Math.min(50,now-lastTime);lastTime=now;
  if(G.mode!=='title'&&G.mode!=='hall')S.playtime+=dt/1000;
  updateWorld(dt);
  if(G.mode==='overworld')renderWorld();
  Input.tick();
  requestAnimationFrame(frameLoop);
}
function boot(){
  AudioSys.ensure();
  titleOpen();
  G.mode='title';
  requestAnimationFrame(frameLoop);
  /* Ferramentas de console sempre disponíveis (não dão acesso a dados
     sensíveis: o jogo é local e offline). `?debug` expõe os internals. */
  window.MonstroQuestBalance=MonstroQuestBalance;
  window.MonstroQuestTests=MonstroQuestTests;
  if(new URLSearchParams(location.search).has('debug')){
    window.__game={S,P,G,teleport,MAPS,SPECIES,MOVES,ITEMS,newMonster,startTrainerBattle,
      startRivalBattle,startGymBattle,startChampBattle,battleOpen,battleRefresh,UI,monsterSprite,
      pxCanvas,checkApproach,GameRNG,SAVE_KEY,saveGame,loadGame,expectedDamage,aiMove,
      catchChance,expGain,curStatsMon,levelUp,tryEvolve,Input,tapKey,battleMsg,
      whiteOut,healAll,learnMove};
  }
}
boot();
</script>
