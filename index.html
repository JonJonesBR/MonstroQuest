<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MonstroQuest — RPG de captura de monstros</title>
<style>

:root{
  --ink:#f4f7ff;
  --muted:#9da8c5;
  --gold:#ffd85a;
  --cyan:#68d8ff;
  --violet:#6f55b8;
  --violet-dark:#241a42;
  --panel:#10162a;
  --panel2:#171f38;
  --line:#7784ad;
  --screen:#07101a;
  --danger:#e85b68;
  --ok:#55d98a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% 20%,#24203a 0%,#100d1d 38%,#07070d 100%);
  color:var(--ink);
  font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;
  overflow:hidden;touch-action:none;overscroll-behavior:none;
}
button{font:inherit}
#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  contain:layout style;
}
#play{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
  overflow:hidden;
}
#screen{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070d;
  border:0;
  border-radius:0px;
  box-shadow:none;
  contain:layout style;
}
#screen:before{display:none;}
#screen:after{display:none;}
canvas#world{
  position:absolute;inset:0;width:100%;height:100%;
  image-rendering:pixelated;image-rendering:crisp-edges;display:block;
}
#ui{
  position:absolute;z-index:6;overflow:hidden;
  font-size:10px;line-height:1.35;
  transform-origin:0 0;
}
.hidden{display:none!important}
.pixel{image-rendering:pixelated;image-rendering:crisp-edges}

/* ---------- overlays ---------- */
.ov{
  position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;z-index:5;
  padding:4px;
}
.panel{
  background:linear-gradient(180deg,rgba(28,38,64,.97),rgba(10,14,28,.97));
  border:2px solid #c9d5f4;
  border-radius:10px;
  box-shadow:0 0 0 2px rgba(0,0,0,.7),0 8px 24px rgba(0,0,0,.55);
}
.lbody{scrollbar-width:thin;scrollbar-color:#6b7fb8 rgba(10,14,26,.55)}
.lbody::-webkit-scrollbar{width:5px}
.lbody::-webkit-scrollbar-thumb{background:#6b7fb8;border-radius:3px}
.lbody::-webkit-scrollbar-track{background:rgba(10,14,26,.55)}
.msgbox{
  position:absolute;left:4px;right:4px;bottom:36%;
  background:linear-gradient(180deg,rgba(20,28,52,.98),rgba(8,12,26,.98));
  border:2px solid #d4def8;border-radius:10px;
  padding:10px 12px;min-height:56px;z-index:12;
  box-shadow:0 0 0 2px rgba(0,0,0,.6),0 5px 15px rgba(0,0,0,.45);
}
.msgbox .txt{white-space:pre-wrap;font-weight:bold;text-shadow:1px 1px 0 #000;font-size:11px;line-height:1.5}
.msgbox .arrow{
  position:absolute;right:9px;bottom:5px;color:var(--gold);
  animation:blink .7s steps(2) infinite;
}
@keyframes blink{50%{opacity:0}}
.msgbox .choices{
  display:flex;gap:14px;justify-content:flex-end;
  margin-top:6px;flex-wrap:wrap
}
.choice{font-weight:bold;color:#d9e2ff;cursor:pointer;text-shadow:1px 1px 0 #000;padding:4px 8px;border-radius:4px}
.choice.sel{color:var(--gold)}
.choice.sel:before{content:"▶ ";color:var(--gold)}

/* ---------- title ---------- */
#title{
  background:
    radial-gradient(circle at 50% 20%,rgba(69,87,158,.5),transparent 40%),
    radial-gradient(circle at 30% 70%,rgba(80,40,120,.2),transparent 50%),
    linear-gradient(180deg,#111a36 0%,#0a0e20 50%,#05070d 100%);
  text-align:center;flex-direction:column;gap:3px;
  justify-content:flex-start;padding-top:4px;
}
#title:before{
  content:"";
  position:absolute;top:13%;width:48%;height:1px;
  background:linear-gradient(90deg,transparent,#7e8dc0,transparent);
  opacity:.65;
}
#title h1{
  font-size:clamp(18px,6vw,24px);color:var(--gold);letter-spacing:3px;
  text-shadow:2px 2px 0 #9b303b,3px 3px 0 #6b2028,5px 5px 0 #000,0 0 30px rgba(255,216,90,.2);
  animation:titlepulse 2.5s ease-in-out infinite
}
@keyframes titlepulse{0%,100%{text-shadow:2px 2px 0 #9b303b,3px 3px 0 #6b2028,5px 5px 0 #000}50%{text-shadow:2px 2px 0 #b0404a,3px 3px 0 #803038,5px 5px 0 #000,0 0 20px rgba(255,216,90,.3)}}
#title .sub{color:#b9c5e4;font-size:9px}
#title .menu{
  display:flex;flex-direction:column;gap:2px;
  margin-top:2px;min-width:118px
}
#title .tm{
  padding:4px 8px;font-weight:bold;color:#d7e0f8;
  cursor:pointer;font-size:12px;border:1px solid transparent;
  border-radius:6px;transition:background .15s
}
#title .tm.sel{
  color:var(--gold);background:linear-gradient(90deg,rgba(61,78,153,.3),rgba(61,78,153,.5),rgba(61,78,153,.3));
  border-color:rgba(255,216,90,.35);
  text-shadow:0 0 10px rgba(255,216,90,.7);
  box-shadow:0 0 16px rgba(255,216,90,.15)
}
#title .tm.sel:before{content:"▶ "}
#title .credit{
  position:absolute;bottom:4px;left:0;right:0;
  color:#68728d;font-size:7px
}

/* ---------- menus / lists ---------- */
#menu{
  background:linear-gradient(180deg,rgba(7,11,24,.98),rgba(14,18,36,.98));
  flex-direction:column;justify-content:flex-start;padding:6px 5px
}
#menu .mrow{
  width:100%;padding:8px 10px;font-weight:bold;color:#d5def5;
  display:flex;justify-content:space-between;align-items:center;
  border-radius:4px;cursor:pointer
}
#menu .mrow.sel{background:linear-gradient(90deg,#3d59bd,#2a3f94);color:#fff}
#menu .mrow.sel:before{content:"▶ "}
.box-title{
  text-align:center;color:var(--gold);font-weight:bold;
  letter-spacing:1px;padding:4px 0 3px
}
#bag .crow,#dex .drow,#pc .prow,#party .prow{
  border-radius:3px
}
#bag{flex-direction:column}
#bag .crow{
  display:flex;justify-content:space-between;padding:6px 10px;
  font-weight:bold;color:#d5def5;cursor:pointer
}
#bag .crow.sel{background:#344ca8;color:#fff}
#bag .crow.sel:before{content:"▶ "}
#party{flex-direction:column}
#party .prow{
  display:flex;gap:7px;align-items:center;padding:6px 8px;
  font-weight:bold;color:#d5def5;border:1px solid transparent;cursor:pointer
}
#party .prow.sel{background:#344ca8;color:#fff}
#party .prow .mini{width:26px;height:26px;flex:0 0 auto}
#party .prow .info{flex:1;display:flex;flex-direction:column}
#party .prow .hpmini{font-size:.85em;color:#9da8c5}
#party .prow{flex-wrap:wrap}
#dex{flex-direction:column}
#dex .drow{
  display:flex;justify-content:space-between;padding:3px 10px;
  font-weight:bold;color:#d5def5
}
#dex .drow.sel{background:#344ca8;color:#fff}
#card{flex-direction:column;gap:2px;text-align:left}
#card .cline{padding:3px 12px;color:#d5def5}
#card .cline b{color:#fff}
#pc{flex-direction:column}
#pc .prow{display:flex;gap:6px;align-items:center;padding:3px 8px;font-weight:bold;color:#d5def5}
#pc .prow.sel{background:#344ca8;color:#fff}

/* ---------- battle ---------- */
#battle{
  background:
    radial-gradient(100% 50% at 80% 8%,rgba(255,240,180,.7),rgba(255,240,180,0) 45%),
    radial-gradient(80% 40% at 20% 15%,rgba(255,180,120,.25),transparent 60%),
    radial-gradient(120% 80% at 50% -5%,rgba(255,255,255,.5),rgba(255,255,255,0) 50%),
    linear-gradient(180deg,
      #60b8e0 0%,#78c8f0 6%,#90d4f8 12%,
      #a8e0f4 18%,#c0ecf0 24%,
      #b0e8d8 30%,#a0e0c8 34%,
      #88d080 38%,#68b858 42%,
      #58a848 48%,#4a9838 54%,
      #3a8830 60%,#2d7828 68%,
      #246820 76%,#1c5818 84%,
      #144812 92%,#0e3a0e 100%);
  display:flex;flex-direction:column;justify-content:space-between;
  position:absolute !important;inset:0;overflow:hidden
}
#battle .field{position:absolute;inset:0;overflow:hidden;z-index:0}
#battle .field:before{
  content:"";position:absolute;left:0;right:0;top:45%;height:4px;
  background:linear-gradient(90deg,rgba(37,73,52,.15),rgba(80,130,70,.6),rgba(37,73,52,.15));
  box-shadow:0 -1px 0 rgba(255,255,255,.25),0 2px 5px rgba(0,0,0,.25),0 0 10px rgba(80,130,70,.2)
}
#battle .field:after{
  content:"";position:absolute;left:0;right:0;top:44%;bottom:0;
  background:
    repeating-linear-gradient(85deg,rgba(35,80,40,.15) 0 2px,transparent 2px 8px),
    repeating-linear-gradient(95deg,rgba(50,100,50,.10) 0 3px,transparent 3px 12px),
    radial-gradient(70% 90% at 50% 5%,rgba(130,215,95,.3),rgba(130,215,95,0) 70%),
    radial-gradient(40% 60% at 25% 55%,rgba(60,120,40,.15),transparent),
    radial-gradient(40% 60% at 75% 65%,rgba(40,90,30,.12),transparent),
    radial-gradient(30% 40% at 50% 80%,rgba(30,70,25,.10),transparent),
    repeating-linear-gradient(80deg,rgba(255,255,255,.02) 0 1px,transparent 1px 6px)
}
/* Sprites: z:3 above field(0), above battle-msg(6), below cmd(7) */
#battle .opp{position:absolute;right:7%;top:8%;z-index:3}
#battle .ply{position:absolute;left:7%;bottom:34%;z-index:3}
#battle .spr{image-rendering:pixelated;image-rendering:crisp-edges}
#battle .opp .spr,#battle .ply .spr{width:clamp(64px,26vmin,150px);height:clamp(64px,26vmin,150px)}
#battle .opp:after,#battle .ply:after{
  content:"";position:absolute;left:50%;bottom:-6px;
  width:70%;min-width:44px;max-width:150px;height:12px;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,0) 65%);
  z-index:-1;pointer-events:none
}
#battle .opp .spr,#battle .ply .spr{animation:battlebob 1.8s ease-in-out infinite}
#battle .opp.faint .spr,#battle .ply.faint .spr{animation:none}
/* HP boxes: z:4 above sprites */
#battle .hbox{
  position:absolute;
  min-width:92px;
  background:linear-gradient(180deg,rgba(18,26,48,.97),rgba(6,10,22,.97));
  border:2px solid #c0cce8;border-radius:9px;
  padding:3px 7px;z-index:4;
  box-shadow:0 2px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1)
}
#battle .hbox.ohp{left:1.5%;top:1.5%}
#battle .hbox.php{right:1.5%;top:1.5%}
#battle .btype{
  display:inline-block;margin-left:4px;padding:0 3px;border-radius:5px;
  font-size:7px;line-height:10px;font-weight:bold;color:#fff;letter-spacing:.3px;
  text-shadow:1px 1px 0 rgba(0,0,0,.55);vertical-align:2px;border:1px solid rgba(255,255,255,.25)
}
#battle .hpwrap{
  background:#121828;border:1px solid #0a0e1a;height:10px;width:100%;
  margin-top:4px;position:relative;border-radius:5px;overflow:hidden;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.06)
}
#battle .hpwrap:after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.22) 6px 7px),
    linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%)
}
#battle .hpfill{
  height:100%;width:100%;position:relative;
  background-color:var(--ok);
  background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.05) 50%,rgba(0,0,0,.15));
  transition:width .4s steps(8);
  border-radius:3px
}
#battle .hpfill.low{background-color:#e85b68}
#battle .hpfill.mid{background-color:var(--gold)}
#battle .hpfill.warn{animation:blink .5s steps(2) infinite}
#battle .bstat{font-size:.92em;color:#b9c5e4;display:flex;justify-content:space-between;align-items:center;margin-top:2px}
#battle .bstat .lv{color:#9da8c5}
#battle .bstat .hpnum{font-weight:bold}
#battle .bname{font-size:10px;font-weight:bold;color:#d7e0f8;text-shadow:1px 1px 0 #000}
/* Status badges: z:5 */
#bst{
  position:absolute;left:50%;top:14%;transform:translateX(-50%);
  z-index:5;padding:3px 10px;border-radius:6px;font-size:8px;font-weight:bold;
  color:#ffe0e8;background:rgba(20,12,35,.88);border:1px solid rgba(255,200,220,.3);
  text-shadow:1px 1px 0 #000;white-space:nowrap
}
/* Message box: z:6 above sprites, below cmd */
#battle .battle-msg{
  position:absolute;left:0;right:0;bottom:0;height:30%;
  box-sizing:border-box;
  background:linear-gradient(180deg,rgba(14,20,40,.99),rgba(6,10,22,.99));
  border-top:2px solid #d0daf0;
  padding:8px 14px;z-index:6;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 -4px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)
}
#battle .battle-msg .btxt{
  white-space:pre-wrap;font-weight:bold;text-shadow:1px 1px 0 #000;
  color:var(--ink);font-size:10px;text-align:center;
  max-height:100%;overflow:hidden
}
#battle .battle-msg .barrow{
  position:absolute;right:9px;bottom:5px;color:var(--gold);
  animation:blink .7s steps(2) infinite
}
#battle .msgbox{display:none!important}
#battle .ov .msgbox{display:none!important}
#battle ~ .msgbox{bottom:34%}
/* Command / Moves: z:7 above everything */
#battle .cmd,#battle .moves{
  position:absolute;left:0;right:0;bottom:0;height:30%;
  background:linear-gradient(180deg,rgba(14,20,39,.99),rgba(6,10,21,.99));
  border-top:2px solid #d4def8;
  display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;z-index:7;
  backdrop-filter:blur(2px)
}
#battle .cmd .opt{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-weight:bold;color:#d5def5;cursor:pointer;
  border:1px solid rgba(140,156,196,.25);
  transition:background .12s
}
#battle .cmd .opt.sel{
  color:#fff;background:linear-gradient(180deg,#3d59bd,#2a3f94);
  box-shadow:inset 0 0 0 2px var(--gold),0 0 8px rgba(255,216,90,.2)
}
#battle .opt .gt{display:flex;align-items:center;justify-content:center;gap:6px;text-shadow:1px 1px 0 #000;font-size:12px}
#battle .opt .ic{font-size:14px;line-height:1}
#battle .opt .gs{color:#9da8c5;font-size:8.2px;text-shadow:1px 1px 0 #000}
#battle .opt .tag{
  display:inline-block;padding:0 4px;border-radius:5px;margin:0 2px;
  font-size:7.2px;line-height:10px;color:#fff;letter-spacing:.3px;
  border:1px solid rgba(255,255,255,.3);text-shadow:1px 1px 0 rgba(0,0,0,.55)
}
/* Etiqueta de fase de batalha: sempre visível, nunca esconde status */
#battle .stphase{
  position:absolute;left:0;right:0;bottom:30%;display:flex;justify-content:space-between;
  padding:0 3px;z-index:6;pointer-events:none;font-size:7px;line-height:1.1
}
#battle .stphase .sp{
  display:flex;gap:2px;align-items:center;padding:1px 3px;border-radius:4px;
  background:rgba(8,12,26,.82);border:1px solid rgba(180,196,240,.22)
}
#battle .stphase .sp .spn{color:#8f9dc4;font-size:6.5px}
#battle .stphase .sp .spv{color:#eaf0ff;font-weight:bold;font-size:7.5px}
#battle .stphase .sp .spv.up{color:#7ee08a}
#battle .stphase .sp .spv.dn{color:#f08a8a}
#battle .sbadge{
  display:inline-block;padding:0 3px;border-radius:4px;font-size:7px;line-height:10px;
  font-weight:bold;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.6);letter-spacing:.2px
}
#battle .statusline{
  display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:1px
}
#battle .moves .opt{
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0px;
  padding:1px 4px;border:1px solid rgba(140,156,196,.25);
  font-weight:bold;color:#d5def5;text-align:center;min-width:0
}
#battle .moves .opt.sel{background:#344ca8;color:#fff}
#battle .moves .opt .mname{font-size:10px;line-height:1.15;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%;text-shadow:1px 1px 0 #000}
#battle .moves .opt .pp{color:#9da8c5;font-size:8px;line-height:1.1}
#battle .moves .opt.sel .pp{color:#dbe4ff}
#battle .moves .opt.out{opacity:.4}
#battle .moves .opt .eff{
  display:inline-block;padding:0 3px;border-radius:4px;font-size:7px;line-height:10px;
  font-weight:bold;color:#0b1020;letter-spacing:.2px;margin-top:1px
}
#battle .moves .opt .eff.e2{background:#4ade80}
#battle .moves .opt .eff.e05{background:#7dd3fc}
#battle .moves .opt .eff.e0{background:#f87171}
/* Battle list: z:8 */
#battle .list{
  position:absolute;left:0;right:0;bottom:0;height:50%;
  background:rgba(7,11,23,.98);border-top:2px solid #d4def8;
  z-index:8;overflow-y:auto;padding-top:3px;
  scrollbar-width:thin;scrollbar-color:#6b7fb8 rgba(10,14,26,.55)
}
#battle .list::-webkit-scrollbar{width:5px}
#battle .list::-webkit-scrollbar-thumb{background:#6b7fb8;border-radius:3px}
#battle .list::-webkit-scrollbar-track{background:rgba(10,14,26,.55)}
#battle .list .row{
  display:flex;justify-content:space-between;padding:3px 8px;
  font-weight:bold;color:#d5def5
}
#battle .list .row.sel{background:#344ca8;color:#fff}
#battle .list .row .hpmini{color:#9da8c5;font-size:.85em}
/* Damage FX: z:5 */
#battle .dmgfx{position:absolute;inset:0;pointer-events:none;z-index:5}
#battle .flash{background:#fff;opacity:.85;animation:bfxflash .14s}
#battle .opp.hit,#battle .ply.hit{animation:shake .28s}
#battle .opp.faint,#battle .ply.faint{opacity:0;transition:opacity .6s}
#battle .sun{
  position:absolute;left:4%;top:25%;width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#fffbe8,#ffe680 40%,#ffb830 70%,#f0a020);
  box-shadow:0 0 24px 10px rgba(255,214,90,.45),0 0 60px 20px rgba(255,200,80,.15);
  z-index:1
}
#battle .cloud{
  position:absolute;background:rgba(250,252,255,.85);border-radius:20px;height:10px;
  opacity:.9;filter:drop-shadow(0 3px 2px rgba(110,140,155,.35));z-index:1
}
#battle .cloud:before,#battle .cloud:after{
  content:"";position:absolute;background:inherit;border-radius:50%
}
#battle .cloud:before{width:16px;height:16px;top:-7px;left:9px}
#battle .cloud:after{width:12px;height:12px;top:-5px;left:27px}
#battle .cloud.c1{right:14%;top:6%;width:46px}
#battle .cloud.c2{right:36%;top:17%;width:30px;opacity:.55;transform:scale(.78)}
#battle .hill{
  position:absolute;bottom:30%;z-index:0;
  background:linear-gradient(180deg,#a8e080,#78b858 50%,#509040 80%,#3a7830);
  border-radius:50% 50% 0 0/100% 100% 0 0;opacity:.9;
  filter:drop-shadow(0 -3px 5px rgba(0,0,0,.12))
}
#battle .hill.h1{left:-7%;width:46%;height:34%}
#battle .hill.h2{right:-9%;width:54%;height:26%;opacity:.75;background:linear-gradient(180deg,#86bd62,#5a9a4a 62%,#3c7438)}
#battle .opp.lunge,#battle .ply.lunge{animation:lunge .34s ease-out}
#battle .p{
  position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#fff,#ffd75e 55%,#f0882e);
  box-shadow:0 0 4px rgba(255,200,80,.85);
  animation:bfxpart .6s ease-out forwards
}
#battle .p.w2{width:3px;height:3px;background:#fff;box-shadow:0 0 3px rgba(255,255,255,.9)}
#battle.shake{animation:bfxshake .3s}
#ball{animation:ballthrow .65s ease-in}
#battle .cmd.hidden,#battle .moves.hidden{display:none}
#battle .cmd:empty,#battle .moves:empty{display:none}
.battle-msg.hidden{display:none!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes bfxflash{0%{opacity:.95}100%{opacity:0}}

const pxCache={};
function pxCanvas(key,rows,pal,scale){
  if(pxCache[key])return pxCache[key];
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;
  const x=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x2=0;x2<rows[y].length;x2++){
    const ch=rows[y][x2],col=pal[ch];if(!col)continue;
    x.fillStyle=col;x.fillRect(x2*scale,y*scale,scale,scale);
  }
  pxCache[key]=c;return c;
}

/* ---------- gerador de monstros ---------- */
function monsterGrid(spec,back){
  const g=Array.from({length:16},()=>Array(16).fill('.'));
  const set=(x,y,c)=>{x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<16&&y<16)g[y][x]=c;};
  const ell=(cx,cy,rw,rh,c)=>{for(let y=0;y<16;y++)for(let x=0;x<16;x++){const dx=(x-cx)/rw,dy=(y-cy)/rh;if(dx*dx+dy*dy<=1)set(x,y,c);}};
  const rect=(x,y,w,h,c)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)set(i,j,c);};
  const A=spec.arch||'blob',B='B',b='b',a='a',e='E',p='e',m='M';
  if(A==='quad'){
    ell(7,10,6.2,3.8,B);ell(12.5,6.5,3.2,2.9,B);ell(6,13.5,3,1.2,b);
    rect(4,13,2,2,B);rect(9,13,2,2,B);rect(12.5,13,2,2,B);
    if(spec.tail)ell(2.5,8,2.2,1.2,a);
    if(spec.ears){ell(12,2.5,1.1,1.4,a);ell(14.5,2.5,1.1,1.4,a);}
    if(spec.horns){ell(11.5,2.8,1.2,1.6,a);ell(14.5,2.8,1.2,1.6,a);}
    if(!back){set(11.5,5.5,e);set(13.5,5.5,e);set(11.5,5.5,p);rect(11,8.5,3,1.5,m);}else{ell(13,5.5,1.6,1.2,a);}
  }else if(A==='bird'){
    ell(7,8.5,4.2,3.4,B);ell(11.5,4.8,2.6,2.4,B);rect(14,4.5,2,2,m);ell(3.5,7.5,2,2.4,a);
    rect(5,12,2,2,a);rect(8,12,2,2,a);rect(11,11.5,2,1.5,a);
    if(spec.wing)ell(6.5,9.5,2.4,1.6,a);
    if(spec.horns)ell(11.5,1.5,1.1,1.3,a);
    if(!back){set(12,4,e);set(12,4,p);}else{ell(12,4.5,1.4,1,a);}
  }else if(A==='serpent'){
    ell(3.5,11.5,2.4,2,B);ell(7,9.5,2.6,2.2,B);ell(10.5,8,2.8,2.4,B);ell(13.5,6.5,2.8,2.6,B);
    if(spec.tail)ell(1.5,13,1.3,1.2,a);
    if(spec.belly)rect(3,13,3,1.4,b);
    if(spec.horns){ell(12,2.6,1.2,1.5,a);ell(15,3,1.2,1.5,a);}
    if(!back){set(12.5,5.5,e);set(15,6,e);set(12.5,5.5,p);set(15,6,p);rect(13.5,9,2.6,1.4,m);}else{ell(15,5.5,1.5,1.1,a);}
  }else if(A==='biped'){
    rect(5,12,3,3,B);rect(10,12,3,3,B);ell(8,8.5,4,3.4,B);ell(8,2.6,3,2.6,B);
    rect(2.5,7,2,3.5,B);rect(11.5,7,2,3.5,B);
    if(spec.belly)ell(8,9.5,2,1.8,b);
    if(spec.ears){ell(5.5,0,1.2,1.3,a);ell(10.5,0,1.2,1.3,a);}
    if(spec.horns){ell(6,0.8,1.1,1.4,a);ell(10,0.8,1.1,1.4,a);}
    if(spec.tail)ell(2.5,9.5,1.6,1.5,a);
    if(!back){set(7,2.4,e);set(9,2.4,e);set(7,2.4,p);set(9,2.4,p);rect(6.5,4.8,3,1.2,m);}else{ell(8,2.6,2,1.6,a);}
  }else if(A==='fish'){
    ell(8,8.5,4.4,3,B);ell(2.5,8,1.8,2.2,a);ell(10,4.5,1.6,1.1,a);ell(10,12.5,1.6,1.1,a);
    if(spec.belly)ell(8,9.5,2.6,1.5,b);
    if(!back){set(10,7.5,e);set(10,7.5,p);rect(11,10,2,1.2,m);}else{ell(10.5,8.5,1.4,1,a);}
  }else{ /* blob */
    ell(7.5,8.5,5.4,4.2,B);ell(8,9.5,3,2.2,b);
    rect(5,13,2.4,1.6,B);rect(10,13,2.4,1.6,B);
    if(spec.tail)ell(2,6.5,1.6,1.3,a);
    if(spec.ears){ell(5,2.8,1.3,1.5,a);ell(10,2.8,1.3,1.5,a);}
    if(spec.horns){ell(5.5,2.2,1.1,1.5,a);ell(9.5,2.2,1.1,1.5,a);}
    if(spec.wing)ell(4,7,1.8,1.3,a);
    if(!back){set(9,7,e);set(12,7.5,e);set(9,7,p);set(12,7.5,p);rect(10,10.5,2.6,1.2,m);}else{ell(12.5,7,1.5,1.1,a);}
  }
  /* contorno */
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    if(g[y][x]!=='.')continue;
    let n=false;
    for(let dy=-1;dy<=1&&!n;dy++)for(let dx=-1;dx<=1&&!n;dx++){
      const nx=x+dx,ny=y+dy;
      if(nx>=0&&ny>=0&&nx<16&&ny<16&&g[ny][nx]!=='.'&&g[ny][nx]!=='o')n=true;
    }
    if(n)g[y][x]='o';
  }
  if(back){ /* sombreia o corpo pra diferenciar as costas */
    for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(g[y][x]==='B')g[y][x]='S';
  }
  return g;
}
function monsterSprite(spec,back,scale){
  const key='mon'+spec.id+(back?'b':'f');
  if(pxCache[key])return pxCache[key];
  scale=scale||5;
  const g=monsterGrid(spec,back);
  const pal={B:spec.col[0],b:spec.col[1]||spec.col[0],a:spec.col[2]||'#fff',E:'#ffffff',e:'#111',M:'#222',o:'#000',S:spec.col[3]||'#203050'};
  /* contorno suavizado: remove "degraus" diagonais, deixando curvas mais redondas */
  const corner=new Set();
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    if(g[y][x]!=='o')continue;
    let ortho=false;
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+d[0],ny=y+d[1];
      if(nx<0||ny<0||nx>=16||ny>=16){ortho=true;break;}
      const v=g[ny][nx];
      if(v!=='.'&&v!=='o'){ortho=true;break;}
    }
    if(!ortho)corner.add(y+','+x);
  }
  const c=document.createElement('canvas');c.width=16*scale;c.height=16*scale;
  const x=c.getContext('2d');
  for(let y=0;y<16;y++)for(let xi=0;xi<16;xi++){
    if(corner.has(y+','+xi))continue;
    const ch=g[y][xi],col=pal[ch];if(!col)continue;
    x.fillStyle=col;x.fillRect(xi*scale,y*scale,scale,scale);
  }
  /* brilho superior sutil nos pixels do topo do corpo */
  x.globalAlpha=.5;x.fillStyle=pal.a;
  for(let y=0;y<16;y++)for(let xi=0;xi<16;xi++){
    if(corner.has(y+','+xi))continue;
    if(g[y][xi]!=='B'&&g[y][xi]!=='S')continue;
    if(y===0||g[y-1][xi]==='.'||g[y-1][xi]==='o')x.fillRect(xi*scale,y*scale,scale,scale);
  }
  x.globalAlpha=1;
  /* highlight pixel on the top-center of body for extra depth */
  x.globalAlpha=.35;
  x.fillStyle='#ffffff';
  for(let y=1;y<14;y++)for(let xi=6;xi<10;xi++){
    if(corner.has(y+','+xi))continue;
    if(g[y][xi]!=='B'||g[y-1][xi]==='B'||g[y-1][xi]==='S')continue;
    x.fillRect(xi*scale,y*scale,scale,scale);
  }
  x.globalAlpha=1;
  pxCache[key]=c;return c;
}

/* construtores de grids */
function mk(w,h,fill){const f=fill===undefined?'.':fill;const g=[];for(let y=0;y<h;y++)g.push(Array(w).fill(f));return g;}
function hline(g,x,y,w,c){for(let i=0;i<w;i++)g[y][x+i]=c;}
function vline(g,x,y,h,c){for(let i=0;i<h;i++)g[y+i][x]=c;}
function rect(g,x,y,w,h,c){hline(g,x,y,w,c);hline(g,x,y+h-1,w,c);vline(g,x,y,h,c);vline(g,x+w-1,y,h,c);}
function box(g,x,y,w,h){rect(g,x,y,w,h,'#');for(let yy=y+1;yy<y+h-1;yy++)for(let xx=x+1;xx<x+w-1;xx++)g[yy][xx]='.';g[y+h-1][x+(w>>1)-1]='D';g[y+h-1][x+(w>>1)]='D';}
function ring(g,c){for(let i=0;i<g.length;i++){g[i][0]=c;g[i][g[i].length-1]=c;}hline(g,0,0,g[0].length,c);hline(g,0,g.length-1,g[0].length,c);}
function gap(g,x,y){g[y][x]=',';g[y][x+1]=',';}
function scatter(g,rng,n,ch,avoid){let tries=0;while(n>0&&tries<400){const x=irnd(2,g[0].length-3),y=irnd(2,g.length-3);tries++;if(g[y][x]==='.'&&!(avoid&&avoid(x,y))){g[y][x]=ch;n--;}}}
function gstr(g){return g.map(r=>r.join(''));}

/* ============================================================
   ESTADO + SAVE + MOTOR DO MUNDO
   ============================================================ */
const SAVE_KEY='monstroquest_save_v1';
/* Versão do schema de save. Saves antigos (sem `v`) são lidos como v1 e migrados. */
const SAVE_VERSION=2;
const SAVE_BACKUP_KEY='monstroquest_save_backup_v1';
const S={
  name:'Treinador',money:3000,badges:[],party:[],bag:{pocao:5,pokeBola:5},
  dexSeen:{},dexCaught:{},flags:{},map:'town1',x:12,y:13,dir:'up',starter:null,
  prev:null,playtime:0,
};
const G={mode:'boot',battle:null,uiStack:[],menuIdx:0,camX:0,camY:0,tick:0};

/* Escolha dos 4 golpes de um monstro recém-criado.
   Pontua utilidade REAL considerando o tipo da espécie (STAB vale muito),
   e completa com golpes básicos para nenhum captive vir com 1-2 golpes. */
const FILLER_MOVES=['tacada','arranhao','grito'];
function newMonster(id,lv){
  const sp=SPECIES[id];const st=statsOf(id,lv);
  const moves=[];
  const learn=sp.learn.filter(x=>x[0]<=lv&&MOVES[x[1]]);
  const uniq=[];
  for(const l of learn){if(!uniq.some(u=>u[1]===l[1]))uniq.push(l);}
  /* pontua por utilidade (potência real, drain, penalidade de recuo/recharge,
     precisão) mas mantém a ordem do learnset para a lista ficar estável */
  const ranked=uniq.slice().sort((a,b)=>moveScore(b[1],lv,id)-moveScore(a[1],lv,id));
  for(const l of ranked){if(moves.length>=4)break;moves.push({id:l[1],pp:MOVES[l[1]].pp});}
  /* preenche com golpes básicos ainda não conhecidos — sempre ter 4 golpes */
  for(const f of FILLER_MOVES){
    if(moves.length>=4)break;
    if(!moves.some(m=>m.id===f))moves.push({id:f,pp:MOVES[f].pp});
  }
  /* se ainda faltar (learnset mínimo), completa com Tacada */
  while(moves.length<4)moves.push({id:'tacada',pp:MOVES.tacada.pp});
  moves.sort((a,b)=>{
    const la=uniq.find(u=>u[1]===a.id),lb=uniq.find(u=>u[1]===b.id);
    if(!la)return 1;if(!lb)return -1;
    return la[0]-lb[0];
  });
  return {id,lv,exp:0,hp:st.hp,status:null,moves,stages:{atk:0,def:0,spa:0,spd:0,spe:0,acc:0,eva:0},shiny:false,gender:'?',caughtAt:null,conf:0,leech:0,sleepTurns:0,flags:[],nick:null};
}
/* métrica de utilidade de um golpe para uma espécie (usada na criação, não em combate) */
function moveScore(id,lv,speciesId){
  const m=MOVES[id];if(!m)return -1;
  const own=(speciesId&&SPECIES[speciesId])?SPECIES[speciesId].types:[];
  const stab=own.indexOf(m.t)>=0?1.35:1;
  let s=m.p>0?(10+Math.log2(Math.max(1,m.p))*8)*stab:0;
  if(m.fixed)s=6*stab; /* dano fixo não escala, vale menos que potência alta */
  if(m.p>0){
    if(m.drain)s+=14;if(m.recoil)s-=10;if(m.multi)s-=4;if(m.recharge)s-=30;
    if(m.pri)s+=m.pri*7;if(m.crit)s+=6;
    if(m.a<100)s-=(100-m.a)*0.35;
  }
  if(m.heal)s+=18*(own.indexOf('water')>=0||own.indexOf('grass')>=0?1.2:1);
  if(m.cure)s+=10;
  if(m.self){for(const k in m.self)s+=7*m.self[k];}
  if(m.eff){for(const k in m.eff){if(k==='chance')continue;
    if(m.eff[k]===1&&['burn','par','pois','sleep','freeze','conf'].indexOf(k)>=0)s+=9;
    else if(typeof m.eff[k]==='number')s+=6*m.eff[k];}}
  if(m.leech)s+=8;
  return s;
}
function statsOf(id,lv){return curStatsMon({id,lv});}
/* Curva de EXP: mais suave que lv^3 puro para evitar grind pesado
   no fim do jogo, mas ainda exigindo várias batalhas por nível. */
function expToNext(lv){return Math.floor(14*lv*lv+22*lv+18);}
/* XP ganho ao derrotar um monstro: nível, base da espécie e bônus
   de treinador. A curva foi calibrada com o Balance Lab para que a
   campanha inteira caiba em uma quantidade saudável de batalhas. */
function expGain(defeated,trainer){
  const base=SPECIES[defeated.id].xp;
  const g=Math.floor((base*defeated.lv)/4.2)+2;
  return trainer?Math.floor(g*1.5):g;
}
/* ---------- SAVE: versionado, validado, com backup do anterior ---------- */
function saveGame(silent){
  try{
    const payload=Object.assign({v:SAVE_VERSION,savedAt:Date.now()},S);
    const json=JSON.stringify(payload);
    /* mantém a versão anterior em backup antes de sobrescrever */
    const prev=localStorage.getItem(SAVE_KEY);
    if(prev){try{localStorage.setItem(SAVE_BACKUP_KEY,prev);}catch(e){}}
    localStorage.setItem(SAVE_KEY,json);
    AudioSys.blip();if(!silent)showToast('Jogo salvo!');
  }catch(e){if(!silent)showToast('Falha ao salvar!');}
}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
/* sanitiza um monstro vindo do save; devolve null se irrecuperável */
function sanitizeMonster(raw){
  if(!raw||typeof raw!=='object')return null;
  const id=String(raw.id==null?'':raw.id);
  if(!SPECIES[id])return null;
  let lv=Math.floor(Number(raw.lv));
  if(!isFinite(lv))lv=1;
  lv=clamp(lv,1,100);
  const max=statsOf(id,lv).hp;
  let hp=Math.floor(Number(raw.hp));
  if(!isFinite(hp))hp=max;
  hp=clamp(hp,0,max);
  let exp=Math.floor(Number(raw.exp));
  if(!isFinite(exp)||exp<0)exp=0;
  exp=Math.min(exp,expToNext(lv)*3);
  const st=raw.stages&&typeof raw.stages==='object'?raw.stages:{};
  const stages={};
  ['atk','def','spa','spd','spe','acc','eva'].forEach(k=>{
    const v=Math.floor(Number(st[k]));
    stages[k]=(isFinite(v)?clamp(v,-6,6):0);
  });
  let status=(STATUS_PT[raw.status]!==undefined)?raw.status:null;
  let conf=Math.floor(Number(raw.conf));
  if(!isFinite(conf)||conf<0)conf=0;
  conf=clamp(conf,0,9);
  let leech=raw.leech?1:0;
  let sleepTurns=Math.floor(Number(raw.sleepTurns));
  if(!isFinite(sleepTurns))sleepTurns=0;
  sleepTurns=clamp(sleepTurns,0,4);
  /* golpes: descarta referências inexistentes, repõe com Tacada se sobrar nada */
  let moves=[];
  if(Array.isArray(raw.moves)){
    const seen=Object.create(null);
    for(const mv of raw.moves.slice(0,4)){
      if(!mv||typeof mv!=='object')continue;
      const mid=String(mv.id==null?'':mv.id);
      const def=MOVES[mid];
      if(!def||seen[mid])continue;
      seen[mid]=1;
      let pp=Math.floor(Number(mv.pp));
      if(!isFinite(pp))pp=def.pp;
      moves.push({id:mid,pp:clamp(pp,0,def.pp)});
    }
  }
  if(!moves.length){
    const sp=SPECIES[id];
    moves=sp.learn.filter(x=>x[0]<=lv&&MOVES[x[1]]).slice(0,1)
      .map(x=>({id:x[1],pp:MOVES[x[1]].pp}));
    if(!moves.length)moves=[{id:'tacada',pp:35}];
  }
  const flags=[];
  if(Array.isArray(raw.flags))raw.flags.slice(0,24).forEach(f=>{if(typeof f==='string')flags.push(f);});
  return {id,lv,exp,hp,status,moves,stages,shiny:!!raw.shiny,
    gender:(raw.gender==='♂'||raw.gender==='♀')?raw.gender:'?',
    caughtAt:(typeof raw.caughtAt==='string')?raw.caughtAt:null,
    conf,leech,sleepTurns,flags,nick:(typeof raw.nick==='string'&&raw.nick.length?raw.nick.slice(0,12):null)};
}
/* migração v1 -> v2: garante campos que o schema antigo não tinha */
function migrateSave(d,from){
  if(from<2){
    /* v1: sem conf/leech/sleepTurns/flags por monstro, sem box normalizado.
       Nada precisa ser inventado — o sanificador já aplica os defaults. */
    d.dismissed=Object.create(null);
  }
  return d;
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
    const d=JSON.parse(raw);
    if(!d||typeof d!=='object'||!Array.isArray(d.party)||!d.party.length
       ||typeof d.map!=='string'||!MAPS[d.map])return false;
    const ver=(typeof d.v==='number'&&d.v>=1&&d.v<=SAVE_VERSION)?d.v:1;
    migrateSave(d,ver);
    /* recusa silenciosamente estados sem monstro jogável */
    const party=d.party.map(sanitizeMonster).filter(Boolean);
    if(!party.length)return false;
    const box=(Array.isArray(d.box)?d.box:[]).map(sanitizeMonster).filter(Boolean).slice(0,200);
    const bag=Object.create(null);
    if(d.bag&&typeof d.bag==='object'){
      for(const k of ITEM_ORDER){
        const n=Math.floor(Number(d.bag[k]));
        if(isFinite(n)&&n>0)bag[k]=clamp(n,0,999);
      }
    }
    const badges=Array.isArray(d.badges)
      ?d.badges.map(x=>Math.floor(Number(x))).filter(x=>x>=0&&x<4).filter((x,i,a)=>a.indexOf(x)===i)
      :[];
    const dexSeen=Object.create(null),dexCaught=Object.create(null);
    if(d.dexSeen&&typeof d.dexSeen==='object')for(const k in d.dexSeen)if(SPECIES[k])dexSeen[k]=true;
    if(d.dexCaught&&typeof d.dexCaught==='object')for(const k in d.dexCaught)if(SPECIES[k])dexCaught[k]=true;
    const flags=(d.flags&&typeof d.flags==='object')?d.flags:Object.create(null);
    /* ensure o starter ainda existe no bestiário */
    const starter=(d.starter&&SPECIES[d.starter])?d.starter:null;
    const clean={
      name:typeof d.name==='string'&&d.name.length?d.name.slice(0,12):'Treinador',
      money:clamp(Math.floor(Number(d.money)||0),0,9999999),
      badges,party,bag,box,dexSeen,dexCaught,flags,starter,
      map:d.map,
      x:clamp(Math.floor(Number(d.x)||0),0,999),
      y:clamp(Math.floor(Number(d.y)||0),0,999),
      dir:(['up','down','left','right'].indexOf(d.dir)>=0)?d.dir:'down',
      prev:(d.prev&&MAPS[d.prev.map])?{map:d.prev.map,x:d.prev.x|0,y:d.prev.y|0}:null,
      lastCenter:(d.lastCenter&&MAPS[d.lastCenter.map])?{map:d.lastCenter.map,x:d.lastCenter.x|0,y:d.lastCenter.y|0}:null,
      playtime:Math.max(0,Number(d.playtime)||0),
      dismissed:Object.create(null),
      version:SAVE_VERSION,
    };
    /* posição precisa ser caminhável — senão joga no centro */
    if(!canWalk(clean.map,clean.x,clean.y)){
      const m=MAPS[clean.map];
      let ok=false;
      for(let y=0;y<m.tiles.length&&!ok;y++)for(let x=0;x<m.tiles[0].length;x++)
        if(tileWalkable(clean.map,x,y)){clean.x=x;clean.y=y;ok=true;break;}
      if(!ok){clean.map='town1';clean.x=12;clean.y=13;}
    }
    Object.assign(S,clean);
    return true;
  }catch(e){return false;}
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(SAVE_BACKUP_KEY);}catch(e){}}

/* ---------- mundo ---------- */
const P={x:12,y:13,dir:'up',px:0,py:0,moving:false,anim:0,timer:0};
const TILE_W=16,TILE_H=16,VIEW_W=240,VIEW_H=160;
const WALK_TIME=145;

function map(){return MAPS[S.map];}
function tileChar(mapId,x,y){
  const m=MAPS[mapId];if(!m)return '.';
  if(y<0||y>=m.tiles.length||x<0||x>=m.tiles[0].length)return 'T';
  const row=m.tiles[y];return x<row.length?row[x]:'.';
}
function tileWalkable(mapId,x,y){
  const c=tileChar(mapId,x,y);const t=TILES[c];return !!t&&t.walk;
}
function npcAt(mapId,x,y){
  const m=MAPS[mapId];if(!m||!m.npcs)return null;
  for(const n of m.npcs)if(n.x===x&&n.y===y&&!n.hidden)return n;
  return null;
}
function solidNpc(mapId,x,y){
  const n=npcAt(mapId,x,y);if(!n)return false;
  if(n.gate!==undefined&&S.badges.length>=n.gate+1)return false;
  return true;
}
function canWalk(mapId,x,y){
  return tileWalkable(mapId,x,y)&&!solidNpc(mapId,x,y);
}
const DX={up:0,down:0,left:-1,right:1};
const DY={up:-1,down:1,left:0,right:0};
const OPPOSITE={up:'down',down:'up',left:'right',right:'left'};

function teleport(mapId,x,y,face){
  S.map=mapId;S.x=x;S.y=y;S.dir=face||'down';
  P.x=x;P.y=y;P.dir=face||'down';P.moving=false;P.px=x*TILE_W;P.py=y*TILE_H;
  /* entering the overworld invalidates any pending overlay handler:
     without this, a leftover title-screen "A" could fire in the world. */
  UI.msgResolve=null;UI.onA=null;UI.onB=null;UI.keyNav=null;
  UI.clickLock=0;BUI.resolve=null;
  G.camX=clamp(P.px+8-VIEW_W/2,0,Math.max(0,MAPS[mapId].tiles[0].length*TILE_W-VIEW_W));
  G.camY=clamp(P.py+8-VIEW_H/2,0,Math.max(0,MAPS[mapId].tiles.length*TILE_H-VIEW_H));
  AudioSys.startMusic(MAPS[mapId].music);
  G.mode='overworld';
  clearTap();
  touchBar();
}
function tryStep(dx,dy){
  const nx=P.x+dx,ny=P.y+dy;
  const blockedNpc=solidNpc(S.map,nx,ny);
  const npc=npcAt(S.map,nx,ny);
  if(!tileWalkable(S.map,nx,ny)||blockedNpc){
    if(!blockedNpc){AudioSys.bump();}
    return;
  }
  P.moving=true;P.timer=0;P.dir=dx<0?'left':dx>0?'right':dy<0?'up':'down';
  const tx=nx,ty=ny;
  const wasTall=tileChar(S.map,P.x,P.y)==='G';
  const stepFn=()=>{
    P.x=tx;P.y=ty;P.moving=false;
    if(!S.flags['step_'+S.map+'_'+tx+'_'+ty]&&tileChar(S.map,tx,ty)==='i'){
      S.flags['step_'+S.map+'_'+tx+'_'+ty]=true;
      const item=HIDDEN_ITEMS[S.map+'|'+tx+'|'+ty];
      if(item){S.bag[item]=(S.bag[item]||0)+1;AudioSys.item();showMsg('Você encontrou: '+ITEMS[item].n+'!');}
    }
    if(tileChar(S.map,tx,ty)==='G'&&G.battle===null&&G.mode==='overworld')maybeWild();
    else checkApproach();
    const w=warpAt(tx,ty);
    if(w&&w.kind==='step')doWarp(w);
    else if(!S.flags['door_'+S.map+'_'+tx+'_'+ty]&&tileChar(S.map,tx,ty)==='D'){
      /* porta: interagir manualmente */
    }
  };
  P.stepFn=stepFn;P.tx=tx;P.ty=ty;
}
function warpAt(x,y){
  const m=map();if(!m||!m.warps)return null;
  for(const w of m.warps)if(w.x===x&&w.y===y)return w;
  return null;
}
function doWarp(w){
  let to=w.to,x2=w.x2,y2=w.y2;
  if(to==='back'){
    if(S.prev){to=S.prev.map;x2=S.prev.x;y2=S.prev.y;}
    else{to='town1';x2=12;y2=13;}
  }
  S.prev={map:S.map,x:P.x,y:P.y};
  teleport(to,x2,y2,w.face);
}
/* ---- toque para andar (mobile first) ---- */
const TAP={tx:-1,ty:-1,face:null,interact:false};
function tapTile(){
  const m=map();
  if(TAP.tx<0||TAP.tx>=m.tiles[0].length||TAP.ty<0||TAP.ty>=m.tiles.length)return;
  if(P.x===TAP.tx&&P.y===TAP.ty){
    const it=TAP.interact,face=TAP.face;
    TAP.tx=-1;TAP.ty=-1;TAP.face=null;TAP.interact=false;
    if(face)P.dir=face;
    if(it)doInteract();
    return;
  }
  const sign=v=>v>0?1:v<0?-1:0;
  const dx=TAP.tx-P.x,dy=TAP.ty-P.y;
  const go=(mx,my)=>{
    if(mx===0&&my===0)return false;
    if(canWalk(S.map,P.x+mx,P.y+my)){tryStep(mx,my);return true;}
    return false;
  };
  if(Math.abs(dx)>=Math.abs(dy)){
    if(!go(sign(dx),0))go(0,sign(dy));
  }else{
    if(!go(0,sign(dy)))go(sign(dx),0);
  }
  if(!P.moving){
    const it=TAP.interact,face=TAP.face;
    const stuck=it&&Math.abs(P.x-TAP.tx)+Math.abs(P.y-TAP.ty)===1;
    TAP.tx=-1;TAP.ty=-1;TAP.face=null;TAP.interact=false;
    if(stuck){if(face)P.dir=face;doInteract();}
  }
}
function tapTo(tx,ty){
  if(G.mode!=='overworld'||!MAPS[S.map])return;
  const m=MAPS[S.map];
  if(tx<0||ty<0||tx>=m.tiles[0].length||ty>=m.tiles.length)return;
  const npc=npcAt(S.map,tx,ty);
  const c=tileChar(S.map,tx,ty);
  const isObj=(!!npc)||c==='D'||c==='M'||c==='C'||c==='P'||c==='B'||!!signAt(tx,ty);
  const walkTarget=(x,y)=>{TAP.tx=x;TAP.ty=y;TAP.face=null;TAP.interact=false;};
  if(canWalk(S.map,tx,ty)&&!isObj){walkTarget(tx,ty);return;}
  let best=null,bd=1e9;
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  for(const [dx,dy] of dirs){
    const ax=tx+dx,ay=ty+dy;
    if(!canWalk(S.map,ax,ay))continue;
    const d=Math.abs(P.x-ax)+Math.abs(P.y-ay);
    if(d<bd){bd=d;best={x:ax,y:ay,face:faceOf(tx-ax,ty-ay)};}
  }
  if(!best&&isObj&&canWalk(S.map,tx,ty)){walkTarget(tx,ty);return;}
  if(best){
    TAP.tx=best.x;TAP.ty=best.y;TAP.face=best.face;TAP.interact=isObj;
    return;
  }
  /* bloqueado e não interativo: anda até o tile livre mais próximo */
  for(let yy=-2;yy<=2;yy++)for(let xx=-2;xx<=2;xx++){
    const ax=tx+xx,ay=ty+yy;
    if(!canWalk(S.map,ax,ay))continue;
    const d=Math.abs(ax-tx)+Math.abs(ay-ty);
    if(d<bd){bd=d;best={x:ax,y:ay};}
  }
  if(best)walkTarget(best.x,best.y);
}
function handleTapMove(e){
  const sc=$('screen');if(!sc)return;
  const r=sc.getBoundingClientRect();
  if(!r.width||!r.height)return;
  const ux=(e.clientX-r.left)/r.width*240;
  const uy=(e.clientY-r.top)/r.height*160;
  if(ux<0||uy>=240||uy<0||uy>=160)return;
  const tx=Math.floor((G.camX+ux)/TILE_W);
  const ty=Math.floor((G.camY+uy)/TILE_H);
  tapTo(tx,ty);
}
function clearTap(){TAP.tx=-1;TAP.ty=-1;TAP.face=null;TAP.interact=false;}
function updateWorld(dt){
  G.tick+=dt;
  if(P.moving){
    P.timer+=dt;
    const t=Math.min(1,P.timer/WALK_TIME);
    P.px=P.x*TILE_W+DX[P.dir]*TILE_W*t;
    P.py=P.y*TILE_H+DY[P.dir]*TILE_H*t;
    P.anim=Math.floor(t*4)%2;
    if(t>=1){if(P.stepFn){const f=P.stepFn;P.stepFn=null;f();}}
    return;
  }
  P.anim=0;
  if(G.mode!=='overworld')return;
  if(Input.held.up||Input.held.down||Input.held.left||Input.held.right){
    const dir=Input.held.up?'up':Input.held.down?'down':Input.held.left?'left':'right';
    P.dir=dir;clearTap();
    tryStep(DX[dir],DY[dir]);
    return;
  }
  if(TAP.tx>=0)tapTile();
}
function centerCamera(){
  const m=map();
  G.camX=clamp(P.px+8-VIEW_W/2,0,Math.max(0,m.tiles[0].length*TILE_W-VIEW_W));

function maybeWild(){
  const m=map();if(!m.wild||G.mode!=='overworld')return;
  if(!chance(0.12))return;
  const roll=GameRNG.next('encounter')*100;let acc=0,chosen=m.wild[0];
  for(const w of m.wild){acc+=w[1];if(roll<=acc){chosen=w;break;}}
  const lv=irnd(chosen[2],chosen[3]);
  AudioSys.encounter();
  const mon=newMonster(chosen[0],lv);
  S.dexSeen[chosen[0]]=true;
  G.mode='battle';
  G.battle={type:'wild',opp:{name:SPECIES[chosen[0]].n+' selvagem',species:chosen[0],lv,mon,team:null,isTrainer:false,item:null},wild:true,
    state:'intro',ball:null};
  AudioSys.stopMusic();
  UI.battleOpen();

function checkApproach(){
  const m=map();if(!m||!m.npcs||G.mode!=='overworld'||G.battle)return;
  for(const n of m.npcs){
    const d=Math.abs(n.x-P.x)+Math.abs(n.y-P.y);
    if(n.trainer){
      if(S.flags['beat_'+n.id])continue;
      if(d<=2&&facingToward(n,P)){n.dir=faceOf(P.x-n.x,P.y-n.y);n.see=true;startTrainerBattle(n);return;}
    }else if(n.rival){
      if(S.flags['beat_'+n.id])continue;
      if(d<=2){n.dir=faceOf(P.x-n.x,P.y-n.y);n.see=true;startRivalBattle(n,n.id==='rival2'?2:1);return;}
    }else if(n.gym!==undefined){
      if(S.flags['beat_leader'+n.gym]){continue;}
      if(d<=1){n.dir=faceOf(P.x-n.x,P.y-n.y);startGymBattle(n);return;}
    }else if(n.champ){
      if(S.flags.beat_champ)continue;
      if(d<=1){n.dir=faceOf(P.x-n.x,P.y-n.y);startChampBattle();return;}
    }
  }
}
function facingToward(n,p){
  if(n.dir==='left')return p.x<n.x&&Math.abs(p.y-n.y)<=1;
  if(n.dir==='right')return p.x>n.x&&Math.abs(p.y-n.y)<=1;
  if(n.dir==='up')return p.y<n.y&&Math.abs(p.x-n.x)<=1;
  return p.y>n.y&&Math.abs(p.x-n.x)<=1;
}
function faceOf(dx,dy){
  if(Math.abs(dx)>Math.abs(dy))return dx<0?'left':'right';
  return dy<0?'up':'down';
}
function startTrainerBattle(n){

/* O rival evolui junto com o jogador e sempre traz uma resposta ao

function startRivalBattle(n,stage){
  const starter=S.starter||'ignis';
  /* o rival escolhe o inicial que CONTRA o seu */
  const counterMap={ignis:'aquore',aquore:'folhar',folhar:'ignis'};

  const coverMap={ignis:'pedrax',aquore:'florestus',folhar:'florestus'};

  const evoMap={aquore:['aquore','marinato','tritan'],folhar:['folhar','verdena','florestus'],ignis:['ignis','infernis','vulcron']};
  const stageIdx=clamp(stage-1,0,2);

  const team=def.team({starter:counter,starterEvolved:(evoMap[counter]||evoMap.aquore)[stageIdx],
    coverage,base});
  G.mode='battle';
  G.battle={type:'trainer',ai:def.ai||2,turnCount:0,lastSwitchTurn:undefined,
    opp:{name:'Rival',species:null,lv:0,mon:null,
      team:team.map(([id,lv])=>({species:id,lv,mon:newMonster(id,lv)})),
      isTrainer:true,money:trainerMoney('rival',base+2),id:n.id,
      pre:def.pre,win:def.win,sprite:'rival',rival:stage},

function doInteract(){
  if(G.mode!=='overworld')return;
  const tx=P.x+DX[P.dir],ty=P.y+DY[P.dir];
  const npc=npcAt(S.map,tx,ty);
  if(npc){
    if(npc.dir!==P.dir)npc.dir=faceOf(P.x-npc.x,P.y-npc.y);
    if(npc.trainer&&!S.flags['beat_'+npc.id]){startTrainerBattle(npc);return;}
    if(npc.rival&&!S.flags['beat_'+npc.id]){startRivalBattle(npc,npc.id==='rival2'?2:1);return;}
    if(npc.gym!==undefined){
      if(S.flags['beat_leader'+npc.gym]){showMsg('Você já venceu o Líder '+GYM_DEFS[npc.gym].name+' deste ginásio!');return;}
      startGymBattle(npc);return;
    }
    if(npc.champ&&!S.flags.beat_champ){startChampBattle();return;}
    if(npc.gate!==undefined&&S.badges.length<npc.gate+1){showMsg(npc.text[0]).then(()=>showMsg(npc.text[1]));return;}
    if(npc.id==='nurse'){S.lastCenter={map:S.map,x:P.x,y:P.y};healAll();showMsg('Seus monstros foram totalmente curados!').then(()=>saveGame());return;}
    if(npc.id==='clerk'){UI.shopOpen();return;}
    if(npc.id==='prof'){if(!S.flags.starter)showMsg('O Professor entrega os monstros iniciais no começo da jornada.');else showMsg('Continue sua jornada, '+S.name+'!');return;}
    if(npc.text)showMsgLines(npc.text);
    return;
  }
  const w=warpAt(tx,ty);
  if(w&&w.kind==='interact'){doWarp(w);return;}
  if(w&&w.kind==='step'){doWarp(w);return;}
  const c=tileChar(S.map,tx,ty);
  if(c==='M'){UI.shopOpen();return;}
  if(c==='C'){S.lastCenter={map:S.map,x:P.x,y:P.y};healAll();showMsg('Seus monstros foram totalmente curados!');return;}
  if(c==='P'){UI.pcOpen();return;}
  const sgn=signAt(tx,ty);
  if(sgn){showMsg(sgn.text);return;}
  if(c==='B'){S.lastCenter={map:S.map,x:P.x,y:P.y};healAll();showMsg('Você descansou na cama e curou seus monstros!');return;}
}

const STATUS_PT={psn:'VEN',brn:'QUE',par:'PAR',slp:'DOR',frz:'CON',conf:'CONF'};
/* ============================================================
   STATUS — cada condição tem uma função própria e um contra-jogo.
   REGRA DE IDENTIDADE: status não é só "perder HP por turno".
     - QUEIMADURA corta o Ataque físico (não serve para quem é forte)
     - VENENO é dano puro, não afeta Ataque (serve contra tanques)
     - PARALISIA reduz Velocidade (não dá 25% de falha, o que é frustração)
     - SONO dá turnos de sono mas acorda ao levar dano forte
     - CONGELAMENTO dura e só sai com fogo ou ao passar tempo
     - CONFUSÃO erra o próprio golpe (risco para quem depende de precisão)
   IMUNIDADES POR TIPO dão significado à combinação tipo+status.
   ============================================================ */
const STATUS_PT_LONG={psn:'envenenado',brn:'queimado',par:'paralisado',slp:'adormecido',frz:'congelado'};
/* tipos imunes a cada condição (chave = status, valor = lista de tipos) */
const STATUS_IMMUNE={
  brn:['fire'],
  frz:['ice'],
  par:['electric'],
  psn:['poison','steel'],
  slp:['electric'],
  conf:[],
};
function statusImmune(mon,status){
  if(!status)return false;
  const types=SPECIES[mon.id].types;
  const list=STATUS_IMMUNE[status];
  return !!(list&&list.some(t=>types.indexOf(t)>=0));
}
/* mapeia a CHAVE do efeito (como aparece em MOVES[].eff) para o código
   de status realmente gravado no monstro. Precisa estar em sincronia com
   `conds` em applyEffect(). */
const STATUS_NATURE={burn:'brn',par:'par',pois:'psn',sleep:'slp',freeze:'frz'};
function hasStatus(m){return !!(m&&(m.status||m.conf));}
/* etapa de dano de status por turno (diferente por condição) */
function statusTickDamage(m){
  if(!m||m.hp<=0)return 0;
  const max=maxHp(m);
  if(m.status==='psn')return Math.max(1,Math.floor(max/8));
  if(m.status==='brn')return Math.max(1,Math.floor(max/16));
  return 0;
}

async function battleMain(){
  const B=G.battle;
  B.state='intro';B.over=false;B.oIndex=0;B.pIndex=S.party.findIndex(m=>m.hp>0);
  if(B.pIndex<0)B.pIndex=0;
  AudioSys.startMusic(B.champ?'champion':(B.wild?'battle':'battle'));
  UI.battleRefresh();
  if(B.type==='wild'){
    const om=oMon();S.dexSeen[om.id]=true;
    await battleMsg('Um '+SPECIES[om.id].n+' selvagem apareceu!');
  }else{
    for(const line of B.opp.pre||[])await battleMsg(line);
    await battleMsg(B.opp.name+' quer batalhar!');
  }
  await sendOutPlayer();
  if(B.type==='trainer'&&!B.wild){await battleMsg(B.opp.name+' enviou '+SPECIES[oMon().id].n+'!');S.dexSeen[oMon().id]=true;}
  B.state='command';
  while(!B.over){
    await battleTurn();
  }
  await endBattle();
}
async function sendOutPlayer(){
  const m=pMon();
  await battleMsg('Vá, '+SPECIES[m.id].n+'!');
  UI.battleRefresh();
}
/* ============================================================
   IA DE BATALHA
   Níveis: 0 = novato, 1 = comum, 2 = bom, 3 = elite (campeão).
   A IA só usa o que o JOGADOR TAMBÉM VÊ (tipos, níveis, PS,
   status, estágios) — nenhum bônus escondido, nenhuma informação
   impossível. As decisões vêm de matemática (dano esperado),
   não de sorte.
   ============================================================ */
const AI_SKILL_BY_CLASS={camarada:0,jovem:1,'fã':1,caçador:1,'líder':2,elite:2,rival:2,'campeão':3};
/* dano esperado de `mv` de user contra target, sem rolar RNG */
function expectedDamage(user,target,mv){
  if(!mv||!mv.p||!user||!target)return {avg:0,max:0,eff:0,kills:false};
  const eff=speciesTypeMult(SPECIES[target.id].types,mv.t);
  if(eff===0)return {avg:0,max:0,eff:0,kills:false};
  const us=curStatsMon(user),ts=curStatsMon(target);
  /* queimadura corta o Ataque físico: golpe físico perde valor nela */
  const burnCut=(user.status==='brn'&&mv.cat==='phys')?0.5:1;
  const atk=(mv.cat==='phys'?us.atk*stageMult(user.stages.atk):us.spa*stageMult(user.stages.spa))*burnCut;
  const def=mv.cat==='phys'?ts.def*stageMult(target.stages.def):ts.spd*stageMult(target.stages.spd);
  const base=mv.fixed
    ?Math.max(1,Math.floor((Math.floor(2*user.lv/5+2)*mv.fixed)/5)+10)
    :Math.floor((Math.floor(2*user.lv/5+2)*mv.p*atk/def)/50)+2;
  const stab=SPECIES[user.id].types.indexOf(mv.t)>=0?1.5:1;
  const critRate=mv.crit?0.125:0.0625;
  const critM=critRate*2+(1-critRate); /* média do modificador de crítico */
  const avg=Math.max(1,Math.floor(base*stab*eff*0.925*critM));
  const maxD=Math.max(1,Math.floor(base*stab*eff*2));
  return {avg,max:maxD,eff,kills:maxD>=target.hp};
}
/* valor de um golpe de status dado o tabuleiro atual */
function statusMoveValue(user,target,mv,skill){
  if(!mv)return 0;
  let v=0;
  const hpU=maxHp(user),hpT=maxHp(target);
  const hpFracT=target.hp/hpT,hpFracU=user.hp/hpU;
  const acc=(mv.a||100)/100;
  if(mv.heal){
    const heal=Math.floor(hpU*mv.heal),missing=hpU-user.hp;
    v+=Math.min(heal,missing)*1.4;
    if(mv.cure&&hasStatus(user))v+=hpU*0.16;
    if(missing<=2)v-=40;
    if(hpFracU>0.75&&!hasStatus(user))v-=25;
  }
  if(mv.leech){
    if(target.leech)return -20;
    v=18+(hpFracU<0.5?12:0);
    if(hpFracT<=0.35)v-=10;
  }
  if(mv.self){
    for(const k in mv.self){
      const cur=user.stages[k]||0;
      if(cur>=3){v-=6;continue;}
      v+=8*mv.self[k]*(hpFracU>0.7?1:0.6);
    }
    if(hpFracU<0.4&&!mv.heal)v-=12;
  }
if(mv.cure&&hasStatus(user))v+=14;
if(mv.eff){
  const e=mv.eff;
  const base=(mv.eff.chance!==undefined?mv.eff.chance:1)*acc;
  for(const k in e){
    if(k==='chance')continue;
    const delta=e[k];
    const on=(STATUS_NATURE[k]||null);
    let w=null;
    if(['atk','def','spa','spd','spe','acc','eva'].indexOf(k)>=0){
      const cur=target.stages[k]||0;
      /* já no piso do debuff: sem ganho, e gasta PP à toa */
      if(delta<0&&cur<=-2)w=-12;
      else if(delta>0&&cur>=3)w=-8;
      else{
        w=(delta<0?9:-6)*Math.abs(delta);
        /* debuff de velocidade vale mais contra quem é mais rápido que nós */
        if(k==='spe'&&delta<0&&curStatsMon(target).spe>curStatsMon(user).spe)w*=1.4;
        if(k==='atk'&&delta<0&&curStatsMon(target).atk>curStatsMon(user).atk)w*=1.25;
        if(k==='acc'&&(mv.a||100)>=100)w*=0.8;
      }
    }else if(k==='flinch'){
      /* flinchar anula o turno do oponente: vale muito contra quem precisa agir */
      w=curStatsMon(target).spe>curStatsMon(user).spe?26:14;
      if(target.status==='slp'||target.status==='frz')w-=20;
    }else{
      /* condição JÁ aplicada no alvo: não vale gastar o golpe */
      if(on&&target.status===on)w=-14;
      /* imunidade por tipo: a IA descobre e evita */
      else if(on&&statusImmune(target,on))w=-18;
      /* alvo quase derrotado: melhor fechar do que envenenar */
      else if(hpFracT<=0.18)w=-20;
      else{
        w=14;
        if(k==='pois')w+=4;                    /* dano puro: ótimo contra tanque */
        if(k==='burn')w-=SPECIES[target.id].stats.atk>70?-6:2;
        if(k==='sleep')w+=hpFracT>0.6?6:0;
        if(k==='par')w+=curStatsMon(target).spe>curStatsMon(user).spe?6:-4;
        if(k==='freeze')w+=hpFracT>0.6?5:0;
        if(k==='conf'&&skill<2)w-=6;
      }
    }
    v+=w*base;
  }
}
return v;
}
function setupCount(m){return ['atk','def','spa','spd'].reduce((a,k)=>a+Math.max(0,m.stages[k]||0),0);}
function aiMove(){
  const om=oMon();
  if(!om)return null;
  const pm=pMon();
  if(!pm)return null;
  const B=G.battle;
  const skill=(B&&B.ai!=null)?B.ai:1;
  const cand=om.moves.map((mv,i)=>i).filter(i=>om.moves[i].pp>0);
  if(!cand.length)return null;
  let best=-1,bestScore=-Infinity;
  for(const i of cand){
    const mv=MOVES[om.moves[i].id];
    let s;
    if(mv.p>0){
      const d=expectedDamage(om,pm,mv);
      if(d.eff===0)s=-999;
      else{
        const acc=Math.min(1,(mv.a||100)/100*stageMult(om.stages.acc||0)/stageMult(pm.stages.eva||0));
        s=d.avg*acc/(mv.recharge?1.9:1)*(mv.recoil?0.82:1)*(mv.multi?0.95:1);
        if(d.eff>1)s*=1.25+(d.eff-1)*0.15;
        else if(d.eff<1)s*=d.eff*0.9;
        if(d.kills)s*=2.4;
        if(!d.kills&&pm.hp/maxHp(pm)<0.3)s*=0.82;
        if(mv.pp<=8)s*=0.9;
        if(om.moves[i].pp<=2)s*=0.55;
      }
    }else{
      s=statusMoveValue(om,pm,mv,skill);
      if(skill<=0)s*=0.65;
      if(om.moves[i].pp<=1&&s<12)s=-50;
    }
    /* ruído: mantém variação sem destruir a escolha ótima */
    s+=GameRNG.next('ai')*(skill>=2?4:10);
    if(s>bestScore){bestScore=s;best=i;}
  }
  return bestScore<=-40?-1:best;
}
/* A IA pode querer TROCAR. Só em nível>=2 e no máximo 1 troca a cada
   2 turnos — assim nunca existe troca infinita nem troca sem propósito. */
function aiWantsSwitch(){
  const B=G.battle;
  if(!B||!B.opp||!B.opp.team||B.wild)return -1;
  const skill=(B.ai!=null)?B.ai:1;
  if(skill<2)return -1;
  const om=oMon(),pm=pMon();
  if(!om||!pm)return -1;
  const team=B.opp.team;
  const since=(B.lastSwitchTurn===undefined)?99:(B.turnCount-B.lastSwitchTurn);
  if(since<2)return -1;
  const curScore=matchupScore(om,pm);
  /* margem alta: só troca quando GANHA de verdade, nunca porempate */
  let bestIdx=-1,bestScore=curScore+20;
  for(let i=0;i<team.length;i++){
    if(i===B.oIndex)continue;
    const cand=team[i].mon;
    if(!cand||cand.hp<=0)continue;
    const sc=matchupScore(cand,pm);
    if(sc>bestScore){bestScore=sc;bestIdx=i;}
  }
  /* não troca se o mon atual está são e vencendo o matchup */
  if(om.hp/maxHp(om)>0.9&&curScore>60)return -1;
  if(bestIdx>=0){B.lastSwitchTurn=B.turnCount;}
  return bestIdx;
}
/* quão bem X enfrenta Y */
function matchupScore(x,y){
  if(!x||!y)return 0;
  let best=0,sum=0;
  for(const mv of x.moves){
    const M=MOVES[mv.id];
    if(!M||M.p===0)continue;
    const d=expectedDamage(x,y,M);
    if(d.eff===0)continue;
    const w=d.avg*(d.eff>1?1.4:1);
    if(w>best)best=w;
    sum+=w;
  }
  return best+sum*0.25;
}
async function battleTurn(){
  const B=G.battle;
  if(B.over)return;
  B.turnCount=(B.turnCount||0)+1;
  /* troca estratégica da IA ANTES do turno do jogador — é a decisão que
     diferencia uma IA boa de uma IA que só apaga golpes */
  if(!B.wild&&B.opp&&B.opp.team&&B.opp.team.some((t,i)=>i!==B.oIndex&&t.mon&&t.mon.hp>0)){
    const want=aiWantsSwitch();
    if(want>=0&&want!==B.oIndex){
      const prev=B.oIndex;
      B.oIndex=want;
      const nx=B.opp.team[want].mon;
      S.dexSeen[nx.id]=true;
      await battleMsg(B.opp.name+' trocou: '+B.opp.name+' enviou '+SPECIES[nx.id].n+'!');
      UI.battleRefresh();await wait(300);
      if(B.oIndex!==prev)return; /* turno consumido pela troca */
    }
  }
  B.state='command';
  UI.battleRefresh();
  const pc=await UI.battleCommand();
  if(B.over)return;
  if(pc.type==='run'){
    if(B.type==='trainer'){await battleMsg('Não dá para fugir de uma batalha contra treinadores!');await oppAttack(null);await afterActions();return;}
    const pm=pMon(),om=oMon();
    const chanceF=clamp(0.5+(curStatsMon(pm).spe-curStatsMon(om).spe)*0.02+B.attempts*0.15,0,0.95);
    B.attempts=(B.attempts||0)+1;
    if(chance(chanceF)){await battleMsg('Você fugiu com segurança!');B.over=true;return;}
    await battleMsg('Não conseguiu fugir!');
    await oppAttack(null);await afterActions();return;
  }
  if(pc.type==='item'){await useItemInBattle(pc.item);await afterActions();return;}
  if(pc.type==='switch'){
    await switchIn(pc.idx);
    if(!B.over){await oppAttack(null);await afterActions();}
    return;
  }
  const pm=pMon(),om=oMon();
  const pMoveIdx=pc.i;
  let pMove=pm.moves[pMoveIdx];
  if(!pMove||pMove.pp<=0){
    pMove={id:'tacada',pp:1};
    await battleMsg('Sem PP! Usou uma investida desesperada.');
  }
  /* a IA pode trocar ANTES de agir (só em níveis altos, sem loop) */
  const oIdx=aiMove();
  let oMove=oIdx===null||oIdx<0?null:om.moves[oIdx];
  if(oMove&&oMove.pp<=0)oMove=null;
  /* ordem: prioridade do golpe > velocidade; empate sorteado */
  const pSpeed=curStatsMon(pm).spe*stageMult(pm.stages.spe);
  const oSpeed=curStatsMon(om).spe*stageMult(om.stages.spe);
  const pPri=oMove?(MOVES[oMove.id].pri||0):0;
  const oPri=(MOVES[pMove.id]&&MOVES[pMove.id].pri)?MOVES[pMove.id].pri:0;
  let pFirst;
  if(oPri!==pPri)pFirst=oPri>pPri;
  else pFirst=oMove===null||pSpeed>oSpeed||(pSpeed===oSpeed&&chance(0.5,'battle'));
  if(pFirst){
    await execAction('player',pMove);
    if(!B.over&&oMove&&oMon()&&oMon().hp>0)await execAction('opp',oMove);
  }else{
    if(oMove)await execAction('opp',oMove);
    if(!B.over&&G.battle.pIndex>=0&&pMon()&&pMon().hp>0)await execAction('player',pMove);
  }
  if(!B.over)await afterActions();
}
async function execAction(side,move){
  const B=G.battle;
  const user=side==='player'?pMon():oMon();
  const target=side==='player'?oMon():pMon();
  const mv=MOVES[move.id];
  if(user.hp<=0)return;
  if(move.pp!==undefined&&move.pp>0)move.pp--;
  /* --- condições que impedem/bloqueiam a ação (contra-jogo claro) --- */
  /* congelamento: dura; sai com ataque de fogo ou ao passar o tempo */
  if(user.status==='frz'){
    user.frozenTurns=(user.frozenTurns||0)+1;
    if(user.frozenTurns>=3&&chance(0.35,'battle')){
      user.status=null;user.frozenTurns=0;
      await battleMsg(SPECIES[user.id].n+' descongelou!');
    }else{
      await battleMsg(SPECIES[user.id].n+' está congelado sólido!');return;
    }
  }
  /* sono: acorda com o tempo OU ao apanhar forte (contra-jogo:的攻击) */
  if(user.status==='slp'){
    user.sleepTurns=(user.sleepTurns||2)-1;
    if(user.sleepTurns<=0){user.status=null;user.sleepTurns=0;await battleMsg(SPECIES[user.id].n+' acordou!');}
    else{await battleMsg(SPECIES[user.id].n+' está dormindo profundamente.');return;}
  }
  /* paralisia: NÃO dá falha total — reduz velocidade e dá risco baixo de
     falha. Evita a frustração de "25% de perder o turno inteiro". */
  if(user.status==='par'&&chance(0.15,'battle')){
    await battleMsg(SPECIES[user.id].n+' está paralisado e não consegue se mover!');return;
  }
  if(user.conf&&user.conf>0){
    user.conf--;
    if(chance(0.45,'battle')){
      await battleMsg(SPECIES[user.id].n+' está confuso e se machucou!');
      const dmg=Math.max(1,Math.floor(maxHp(user)*0.08));
      user.hp=Math.max(0,user.hp-dmg);
      UI.battleHit(side,false);
      UI.battleRefresh();
      await wait(320);
      return;
    }
    if(user.conf<=0){user.conf=null;await battleMsg(SPECIES[user.id].n+' saiu da confusão!');}
  }
  /* acurácia (vale para os dois lados) */
  if(mv.a<101){
    const acc=Math.min(1,mv.a/100*stageMult(user.stages.acc||0)/stageMult(target.stages.eva||0));
    if(!chance(acc,'battle')){await battleMsg(SPECIES[user.id].n+' errou o ataque!');return;}
  }
  /* --- golpes de status --- */
  if(mv.p===0){
    /* cura (+ cura de status no mesmo golpe) */
    if(mv.heal){
      const didCure=mv.cure&&hasStatus(user);
      if(didCure){user.status=null;user.conf=0;user.sleepTurns=0;user.frozenTurns=0;}
      const h=Math.floor(maxHp(user)*mv.heal);
      const before=user.hp;
      user.hp=Math.min(maxHp(user),user.hp+h);
      await battleMsg(SPECIES[user.id].n+' usou '+mv.n+'!');
      if(user.hp>before)await battleMsg(SPECIES[user.id].n+' recuperou energia!');
      if(didCure)await battleMsg('A condição de status foi curada!');
      UI.battleRefresh();return;
    }
    /* setup (estágios no usuário) */
    if(mv.self){
      await battleMsg(SPECIES[user.id].n+' usou '+mv.n+'!');
      applyStages(user,mv.self);
      UI.battleRefresh();return;
    }
    /* sementes: dreno persistente com contra-jogo (remove no Centro/propriedade) */
    if(mv.leech){
      if(target.leech){await battleMsg(SPECIES[target.id].n+' já tem sementes!');return;}
      target.leech=1;
      await battleMsg(SPECIES[user.id].n+' plantou sementes em '+SPECIES[target.id].n+'!');
      UI.battleRefresh();return;
    }
    if(mv.eff){
      await battleMsg(SPECIES[user.id].n+' usou '+mv.n+'!');
      await applyEffect(user,target,mv.eff);
      UI.battleRefresh();return;
    }
    await battleMsg(SPECIES[user.id].n+' usou '+mv.n+'!');
    return;
  }
  /* --- ataques com dano --- */
  /* golpes de recarregamento (Hiper Raio) só pueden no turno de carga */
  if(user.charging){
    user.charging=false;
    await battleMsg(SPECIES[user.id].n+' está recarregando e não pode atacar!');
    UI.battleRefresh();return;
  }
  const atkStat=curStatsMon(user),defStat=curStatsMon(target);
  /* queimadura corta o Ataque físico: identidade real da condição */
  const burnCut=(user.status==='brn'&&mv.cat==='phys')?0.5:1;
  const atk=(mv.cat==='phys'?atkStat.atk*stageMult(user.stages.atk):atkStat.spa*stageMult(user.stages.spa))*burnCut;
  const def=mv.cat==='phys'?defStat.def*stageMult(target.stages.def):defStat.spd*stageMult(target.stages.spd);
  const typeEff=speciesTypeMult(SPECIES[target.id].types,mv.t);
  if(typeEff===0){
    await battleMsg(SPECIES[user.id].n+' usou '+mv.n+'!');
    await wait(260);
    await battleMsg('Não afeta '+SPECIES[target.id].n+'!');
    return;
  }
  const stab=SPECIES[user.id].types.includes(mv.t)?1.5:1;
  const crit=chance(mv.crit?1/8:1/16,'battle')?2:1;
  /* golpes de acerto múltiplo */
  const hits=mv.multi?(Array.isArray(mv.multi)?GameRNG.int(mv.multi[0],mv.multi[1],'battle'):mv.multi):1;
  let total=0,anyHit=false,allCrit=true;
  await battleMsg(SPECIES[user.id].n+' usou '+mv.n+'!');
  for(let h=0;h<hits;h++){
    let dmg;
    if(mv.fixed){
      dmg=Math.max(1,Math.floor((Math.floor(2*user.lv/5+2)*mv.fixed)/5)+10);
      dmg=Math.floor(dmg*stab*typeEff*(crit>1?2:1)*(0.9+GameRNG.next('battle')*0.1));
    }else{
      let d=Math.floor((Math.floor(2*user.lv/5+2)*mv.p*atk/def)/50)+2;
      const rnd=0.85+GameRNG.next('battle')*0.15;
      dmg=Math.max(1,Math.floor(d*stab*typeEff*crit*rnd));
    }
    if(hits>1)dmg=Math.max(1,Math.floor(dmg*0.75)); /* múltiplos batem mais fraco */
    const applied=Math.min(target.hp,dmg);
    target.hp=Math.max(0,target.hp-dmg);
    total+=applied;
    anyHit=true;if(crit<=1)allCrit=false;
    if(hits>1)await wait(130);
    if(target.hp<=0)break;
  }
  target.hp=Math.max(0,target.hp);
  UI.battleHit(side,crit>1);
  UI.battleRefresh();
  await wait(420);
  if(hits>1)await battleMsg('Acertou '+hits+' vez'+(hits>1?'es':'')+'! Total de '+total+' de dano.');
  if(crit>1)await battleMsg('Golpe crítico!');
  if(typeEff>1)await battleMsg('Foi super eficaz!');
  else if(typeEff<1)await battleMsg('Não é muito eficaz...');
  /* dreno: recupera parte do dano causado */
  if(mv.drain&&total>0){
    const h=Math.max(1,Math.floor(total*mv.drain));
    user.hp=Math.min(maxHp(user),user.hp+h);
    await battleMsg(SPECIES[user.id].n+' drenou energia!');
  }
  /* recuo: o usuário paga parte do dano */
  if(mv.recoil&&total>0){
    const r=Math.max(1,Math.floor(total*mv.recoil));
    user.hp=Math.max(0,user.hp-r);
    await battleMsg(SPECIES[user.id].n+' sofreu '+r+' de recuo!');
    if(user.hp<=0)await handleSelfFaint();
  }
  /* recarga: golpe máximo custa o próximo turno */
  if(mv.recharge)user.charging=true;
  /* acorda quem dorme ao levar dano forte */
  if(target.status==='slp'&&total>0&&anyHit&&total>=maxHp(target)*0.18){
    target.status=null;target.sleepTurns=0;
    await battleMsg(SPECIES[target.id].n+' acordou com o impacto!');
  }
  /* fogo descongela */
  if(target.status==='frz'&&mv.t==='fire'&&anyHit){
    target.status=null;target.frozenTurns=0;
    await battleMsg(SPECIES[target.id].n+' foi descongelado pelo calor!');
  }
  /* efeito secundário */
  if(mv.eff&&target.hp>0){
    const chanceEff=(mv.eff.chance!==undefined?mv.eff.chance:1);
    if(chance(chanceEff,'battle'))await applyEffect(user,target,mv.eff);
  }
  UI.battleRefresh();
}
async function handleSelfFaint(){
  const B=G.battle;if(!B)return;
  const om=oMon();
  if(om&&om.hp<=0){
    UI.battleFaint('opp');
    await battleMsg(SPECIES[om.id].n+' não resistiu ao próprio golpe!');
  }
}
function applyStages(m,stages){
  for(const k in stages){
    const v=clamp((m.stages[k]||0)+stages[k],-6,6);
    if(m.stages[k]!==undefined&&v===m.stages[k])return false;
    m.stages[k]=v;
  }
  return true;
}
async function applyEffect(user,target,eff){
  /*effects de estágios primeiro */
  const stats=[['atk','Ataque'],['def','Defesa'],['spa','Ataque Especial'],['spd','Defesa Especial'],
               ['spe','Velocidade'],['acc','Precisão']];
  for(const [k,label] of stats){
    if(!eff[k])continue;
    const cur=target.stages[k]||0;
    const nv=clamp(cur+eff[k],-6,6);
    if(nv===cur){
      await battleMsg('O '+label+' de '+SPECIES[target.id].n+' não pode cair/ Subir mais!');
      continue;
    }
    target.stages[k]=nv;
    await battleMsg(SPECIES[target.id].n+' — '+label+' '+(eff[k]>0?'subiu':'caiu')+'!');
  }
  /* flinch: anula o próximo turno do alvo (contra-jogo: golpes de prioridade) */
  if(eff.flinch&&target.flinchTurns<=0){
    target.flinchTurns=1;
    await battleMsg(SPECIES[target.id].n+' tremeu e não consegue se concentrar!');
  }
  /* condições naturais: respeita imunidade por TIPO */
  const conds=[['burn','brn','foi queimado!'],['par','par','ficou paralisado!'],
    ['pois','psn','foi envenenado!'],['sleep','slp','adormeceu!'],['freeze','frz','foi congelado!']];
  for(const [key,st,msg] of conds){
    if(!eff[key])continue;
    if(target.status){await battleMsg(SPECIES[target.id].n+' já tem uma condição.');continue;}
    if(statusImmune(target,st)){
      await battleMsg(SPECIES[target.id].n+' não é afetado(a) por isso!');
      continue;
    }
    target.status=st;
    if(st==='slp')target.sleepTurns=irnd(1,3,'battle');
    if(st==='frz')target.frozenTurns=0;
    await battleMsg(SPECIES[target.id].n+' '+msg);
  }
  if(eff.conf&&!target.conf){
    target.conf=irnd(2,4,'battle');
    await battleMsg(SPECIES[target.id].n+' ficou confuso!');
  }
}
/* aplica um golpe inteiro ao alvo (usado pela IA para simular o próximo turno) */
function simulateStatus(user,target,mv,skill){
  const saved=JSON.parse(JSON.stringify({status:target.status,conf:target.conf,stages:target.stages,leech:target.leech}));
  const leechWas=!!target.leech;
  const hadStatus=hasStatus(target);
  const stagesBefore={...target.stages};
  applyStages(target,mv.self||{});
  if(mv.leech)target.leech=1;
  if(mv.eff){
    for(const [key,st] of [['burn','brn'],['par','par'],['pois','psn'],['sleep','slp'],['freeze','frz']]){
      if(!mv.eff[key]||target.status)continue;
      if(!statusImmune(target,st))target.status=st;
    }
    if(mv.eff.conf&&!target.conf)target.conf=3;
    if(mv.eff.flinch)target.flinchTurns=1;
  }
  let g=0;
  if(mv.heal)g+=Math.min(maxHp(user)*mv.heal,maxHp(user)-user.hp);
  if(mv.cure&&hasStatus(user))g+=maxHp(user)*0.16;
  /* devolve o estado — a IA só lê, nunca altera a batalha real */
  target.status=saved.status;target.conf=saved.conf;target.leech=leechWas?1:0;
  target.stages=stagesBefore;
  return g;
}
async function applyStageMsg(m,stat,delta){
  const pt={atk:'Ataque',def:'Defesa',spa:'Ataque Especial',spd:'Defesa Especial',spe:'Velocidade',acc:'Precisão'}[stat];
  m.stages[stat]=clamp((m.stages[stat]||0)+delta,-6,6);
  const verb=delta>0?'subiu':'caiu';
  await battleMsg(SPECIES[m.id].n+' '+pt+' '+verb+'!');
}
async function afterActions(){
  const B=G.battle;
  if(!B||B.over)return;
  const pm=pMon(),om=oMon();
  if(!om||om.hp<=0){await handleOppFaint();}
  if(B.over)return;
  if(!pm||pm.hp<=0){await handlePlayerFaint();if(B.over)return;await forceSwitch();return;}
  /* efeitos de fim de turno — cada condição tem seu próprio dano/efeito */
  for(const side of ['player','opp']){
    const m=side==='player'?pm:om;
    const other=side==='player'?om:pm;
    if(!m||m.hp<=0)continue;
    /* queimadura: dano por turno E cortina o Ataque físico
       (quem é fraco fisicamente e forte em especial NÃO se beneficia) */
    if(m.status==='brn'){
      const d=statusTickDamage(m);
      m.hp=Math.max(0,m.hp-d);
      await battleMsg(SPECIES[m.id].n+' sofreu com a queimadura! ('+d+')');
      UI.battleRefresh();await wait(260);
    }
    /* veneno: dano puro, não afeta Ataque — a condição "de tanque" */
    if(m.status==='psn'){
      const d=statusTickDamage(m);
      m.hp=Math.max(0,m.hp-d);
      await battleMsg(SPECIES[m.id].n+' perdeu energia para o veneno! ('+d+')');
      UI.battleRefresh();await wait(260);
    }
    /* sementes: dreno persistente, o SELETOR remove */
    if(m.leech&&m.hp>0){
      const d=Math.max(1,Math.floor(maxHp(m)/8));
      m.hp=Math.max(0,m.hp-d);
      if(other&&other.hp>0)other.hp=Math.min(maxHp(other),other.hp+d);
      await battleMsg('As sementes drenaram energia de '+SPECIES[m.id].n+'!');
      UI.battleRefresh();await wait(260);
    }
  }
  if(om.hp<=0){await handleOppFaint();}
  if(!B.over&&pm.hp<=0){await handlePlayerFaint();if(!B.over)await forceSwitch();}
}
async function handleOppFaint(){
  const B=G.battle;if(!B)return;
  const om=oMon();
  if(!om||om.hp>0)return;
  await battleMsg('O '+SPECIES[om.id].n+' de '+B.opp.name+' desmaiou!');
  UI.battleFaint('opp');
  await wait(450);
  const pm=pMon();
  /* XP */
  if(pm&&pm.hp>0){
    const gain=expGain(om,B.type==='trainer');
    pm.exp+=gain;
    await battleMsg(SPECIES[pm.id].n+' ganhou '+gain+' de experiência!');
    while(pm.exp>=expToNext(pm.lv)){
      pm.exp-=expToNext(pm.lv);pm.lv++;
      await levelUp(pm);
      await tryEvolve(pm);
    }
  }
  if(B.type==='trainer'){
    B.oIndex++;
    if(B.oIndex<B.opp.team.length){
      const next=B.opp.team[B.oIndex];
      S.dexSeen[next.species]=true;
      await battleMsg(B.opp.name+' enviou '+SPECIES[next.species].n+'!');
      UI.battleRefresh();return;
    }
    await battleWin();
    return;
  }
  /* selvagem venceu */
  await battleWin();
}
async function handlePlayerFaint(){
  const B=G.battle;if(!B)return;
  const pm=pMon();
  if(!pm||pm.hp>0)return;
  await battleMsg(SPECIES[pm.id].n+' desmaiou!');

  await wait(450);
}
async function forceSwitch(){

  if(!alive.length){await whiteOut();return;}

async function oppAttack(move){
  if(B_OVER_GUARD())return;

  if(oIdx===null||oIdx<0)return;

/* posição externa da porta do Centro mais recente (para o warp "voltar" pós-whiteout) */
function centerOutside(){
  if(S.lastCenter&&S.lastCenter.map!=='center_int'){
    const m=MAPS[S.lastCenter.map];
    const w=m&&m.warps?m.warps.find(w=>w.to==='center_int'):null;

/* ============================================================
   CAPTURA — decisão, não sorteio cego.
   O jogador considera: PS restantes, status, bola (preço vs
   qualidade), espaço na equipe e se vale a pena aquela espécie.
   A chance JÁ é mostrada como faixa ANTES de jogar (ver catchInfo),
   e nunca chega a 100% só por lowering PS — continua sendo uma
   aposta real.
   ============================================================ */
function catchChance(om,itemId){
  const it=ITEMS[itemId];
  const max=maxHp(om);
  const hp=clamp(om.hp,0,max);
  /* menos PS = muito mais fácil; curva自己的能力笑: (3max-2hp)/(3max) */
  const hpTerm=(3*max-2*hp)/(3*max);
  const base=SPECIES[om.id].catch;
  const statusBonus=om.status?(om.status==='slp'||om.status==='frz'?2.2:1.6):1;
  const a=Math.floor(((3*max-2*hp)*base*it.bonus*statusBonus)/(3*max));
  /* clamp em 0.95: SEMPRE existe chance de falhar — nada de garantia */
  return clamp((a+1)/255,0,0.95);
}
const CATCH_TIERS=[
  {min:0.55,label:'Excelente',color:'#55d98a'},
  {min:0.32,label:'Boa',color:'#9fe870'},
  {min:0.15,label:'Razoável',color:'#ffd85a'},
  {min:0.001,label:'Difícil',color:'#e88a68'},
  {min:-1,label:'Quase impossível',color:'#e85b68'},
];
function catchTier(p){for(const t of CATCH_TIERS)if(p>=t.min)return t;
  return CATCH_TIERS[CATCH_TIERS.length-1];}
/* informação de captura usada no menu da bolsa E antes de jogar */
function catchInfo(itemId){
  const om=oMon();
  if(!om)return null;
  const p=catchChance(om,itemId);
  const t=catchTier(p);
  return {p,label:t.label,color:t.color,ball:ITEMS[itemId].n};
}
async function useItemInBattle(itemId){
  const B=G.battle;const it=ITEMS[itemId];
  if(!B.wild&&it.type!=='heal'&&it.type!=='status'&&it.type!=='revive'){
    await battleMsg('Não dá para usar isso aqui!');return;
  }
  if(it.type==='ball'&&!B.wild){await battleMsg('Não dá para capturar monstros de treinadores!');return;}
  if((S.bag[itemId]||0)<=0){await battleMsg('Você não tem mais '+it.n+'.');return;}
  S.bag[itemId]--;
  if(it.type==='ball'){
    const om=oMon();
    if(!om){S.bag[itemId]++;return;}
    /* feedback da chance ANTES de jogar — o jogador precisa ver o risco */
    const info=catchInfo(itemId);
    const partyFull=S.party.length>=6;
    await battleMsg('Chance de captura: '+info.label+' ('+it.n+')');
    if(partyFull)await battleMsg('Equipe cheia — se capturar, vai para o PC.');
    await battleMsg('Você jogou a '+it.n+'!');
    UI.battleBall();
    await wait(650);
    if(B.over)return;
    const om2=oMon();if(!om2){B.over=true;return;}
    /* recalcula APÓS o turno (o inimigo pode ter se curado/alterado) */
    const p=catchChance(om2,itemId);
    const caught=GameRNG.chance(p,'capture');
    if(caught){
      AudioSys.catch();
      await battleMsg('Conseguiu! '+SPECIES[om2.id].n+' foi capturado!');
      S.dexCaught[om2.id]=true;
      /* novo monstro entra sem condition herdada de batalha */
      om2.status=null;om2.conf=0;om2.leech=0;om2.sleepTurns=0;om2.charging=false;
      om2.stages={atk:0,def:0,spa:0,spd:0,spe:0,acc:0,eva:0};
      if(S.party.length<6){
        S.party.push(om2);
        await battleMsg(SPECIES[om2.id].n+' foi para a sua equipe!');
      }else{
        S.box=(S.box||[]);
        S.box.push(om2);
        await battleMsg(SPECIES[om2.id].n+' foi para o PC!');
      }
      B.over=true;return;
    }
    AudioSys.fail();
    await battleMsg('Ah, não! O '+SPECIES[om2.id].n+' escapou!');
    return;
  }
  if(it.type==='candy'){
    const pm=pMon();
    if(pm.hp<=0){await battleMsg('Não dá para usar em um monstro desmaiado!');S.bag[itemId]++;return;}
    pm.exp+=expToNext(pm.lv);pm.lv++;
    await battleMsg(SPECIES[pm.id].n+' subiu de nível!');
    await levelUp(pm);await tryEvolve(pm);
    return;
  }
  const pm=pMon();
  if(pm.hp<=0){await battleMsg('Não dá para usar nisso agora!');S.bag[itemId]++;return;}
  if(it.type==='heal'){
    if(pm.hp>=maxHp(pm)){await battleMsg('Os PS já estão no máximo!');S.bag[itemId]++;return;}
    pm.hp=Math.min(maxHp(pm),pm.hp+it.heal);
    AudioSys.heal();
    await battleMsg('Usou '+it.n+'! '+SPECIES[pm.id].n+' recuperou PS!');
    UI.battleRefresh();return;
  }
  if(it.type==='status'){
    /* Full Heal não limpa confusão — é o motivo de existir a Cura Total */
    const ok=it.fullOnly?!!pm.status:hasStatus(pm);
    if(!ok){await battleMsg(it.fullOnly?'Não há condição para curada.':'Não há condição de status!');S.bag[itemId]++;return;}
    if(it.fullOnly){pm.status=null;pm.sleepTurns=0;pm.frozenTurns=0;}
    else{pm.status=null;pm.conf=0;pm.sleepTurns=0;pm.frozenTurns=0;}
    await battleMsg('Usou '+it.n+'! '+SPECIES[pm.id].n+' foi curado!');
    UI.battleRefresh();return;
  }
  if(it.type==='revive'){
    if(pm.hp>0){await battleMsg('O monstro ainda pode lutar!');S.bag[itemId]++;return;}
    pm.hp=Math.floor(maxHp(pm)/2);
    await battleMsg('Usou '+it.n+'! '+SPECIES[pm.id].n+' reviveu!');
    UI.battleRefresh();return;
  }
}
async function levelUp(m){
  const oldMax=maxHp({id:m.id,lv:m.lv-1});
  const newMax=maxHp(m);
  const gained=Math.max(0,newMax-oldMax);
  AudioSys.levelup();
  await battleMsg(SPECIES[m.id].n+' subiu para o nível '+m.lv+'!');
  m.hp=Math.min(newMax,m.hp+gained);
  UI.battleRefresh();
  /* aprender movimento(s) deste nível */
  const sp=SPECIES[m.id];
  const learnMove=sp.learn.filter(x=>x[0]===m.lv).map(x=>x[1]).filter(id=>MOVES[id]);
  for(const mvId of learnMove){
    /* já conhece? não oferece de novo */
    if(m.moves.some(x=>x.id===mvId)){
      await battleMsg(SPECIES[m.id].n+' já conhece '+MOVES[mvId].n+'.');
      continue;
    }
    if(m.moves.length<4){
      m.moves.push({id:mvId,pp:MOVES[mvId].pp});
      await battleMsg(SPECIES[m.id].n+' aprendeu '+MOVES[mvId].n+'!');
    }else{
      await battleMsg(SPECIES[m.id].n+' quer aprender '+MOVES[mvId].n+'.');
      let choice=await UI.learnMove(m,mvId);
      if(choice==='back')choice=4;
      if(choice>=0&&choice<4&&m.moves[choice]){
        const oldId=m.moves[choice].id;
        m.moves[choice]={id:mvId,pp:MOVES[mvId].pp};
        await battleMsg('Esqueceu '+MOVES[oldId].n+'. Aprendeu '+MOVES[mvId].n+'!');
      }else{
        await battleMsg('Não aprendeu '+MOVES[mvId].n+'.');
      }
    }
  }
}
/* Evolução: pergunta ao jogador (decisão real) e mostra o que muda.
   Cancelar fica registrado em `dismissed` — não弹出 popup toda batalha. */
async function tryEvolve(m){
  const sp=SPECIES[m.id];
  const evo=sp.evo?sp.evo.find(e=>e.lv===m.lv):null;
  if(!evo)return;
  if(m.noEvo)return;
  const to=SPECIES[evo.to];
  if(!to)return;
  const before=curStatsMon(m);
  const typeChanged=JSON.stringify(sp.types)!==JSON.stringify(to.types);
  await battleMsg(sp.n+' está evoluindo!');
  UI.battleEvolve();
  await wait(1000);
  const choice=await UI.confirmEvolve(m,to,typeChanged);
  if(choice==='no'){
    m.noEvo=true;
    await battleMsg(sp.n+' decidiu não evoluir agora.');
    return;
  }
  m.id=evo.to;
  m.noEvo=false;
  S.dexSeen[evo.to]=true;S.dexCaught[evo.to]=true;
  const after=curStatsMon(m);
  /* cura a diferença de PS máximo: evoluir nunca custa vida */
  m.hp=Math.min(after.hp,m.hp+(after.hp-before.hp));
  AudioSys.evolve();
  await battleMsg(sp.n+' evoluiu para '+to.n+'!');
  if(typeChanged)await battleMsg('Novo tipo: '+sp.types.join('/')+' → '+to.types.join('/')+'!');
  const dr=after.atk-before.atk,dsp=after.spa-before.spa,dde=after.def-before.def,dspd=after.spd-before.spd;
  if(dr||dsp||dde||dspd)await battleMsg('ATQ+'+dr+' DEF+'+dde+' ESP+'+dsp+' EID+'+dspd);
  UI.battleRefresh();
}
async function endBattle(){
  const B=G.battle;
  if(!B){return;}
  const wasWild=B.wild;
  UI.battleClose();
  document.body.classList.remove('in-battle');

    healAll();

    else teleport('center_int',6,8,'down');

  saveGame();
}
