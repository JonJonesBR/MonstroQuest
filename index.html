/* ============================================================
   RENDERIZADOR DO MUNDO (canvas 240x160)
   ============================================================ */
const cv=$('world'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const tileCache={};
function tileSprite(c,seed,frame){
  const key=c+(frame!==undefined?':'+frame:'')+(seed%9);
  if(tileCache[key])return tileCache[key];
  const cv2=document.createElement('canvas');cv2.width=16;cv2.height=16;
  const x=cv2.getContext('2d');
  const rng=mulberry32(seed*31+13);
  const fill=(col,rx,ry,rw,rh)=>{x.fillStyle=col;x.fillRect(rx,ry,rw||16,rh||16);};
  const px=(xx,yy,col)=>{x.fillStyle=col;x.fillRect(xx,yy,1,1);};
  if(c==='.'||c==='+'){
    fill('#58b040');for(let i=0;i<14;i++)px(irnd(0,15),irnd(0,15),rng()<.4?'#4ea03a':rng()<.5?'#66c04a':'#5cb848');
    if(c==='+'){px(4,4,'#e8e8e8');px(4,5,'#f0d058');px(3,4,'#f0d058');px(5,4,'#f0d058');px(11,9,'#e8e8e8');px(11,10,'#f080c0');px(10,10,'#f080c0');px(12,10,'#f080c0');}
  }else if(c===','){
    fill('#d0b878');for(let i=0;i<8;i++)px(irnd(0,15),irnd(0,15),rng()<.5?'#c4a868':'#dcbc88');
  }else if(c==='G'){
    fill('#58b040');for(let i=0;i<18;i++){const xx=irnd(0,15),yy=irnd(0,15);px(xx,yy,'#2f8f2f');if(xx+1<16)px(xx+1,yy,'#2f8f2f');}
    x.fillStyle='#1f6f1f';x.fillRect(0,14,16,2);
  }else if(c==='W'){
    fill('#3880d8');
    for(let yy=0;yy<16;yy+=4){const off=(frame||0)*2+(yy/4)%2;x.fillStyle='#58a0e8';x.fillRect((off)%16,yy,6,1);x.fillRect((off+8)%16,yy+2,6,1);}
    x.fillStyle='#2868c0';x.fillRect(0,15,16,1);
  }else if(c==='T'){
    fill('#1a5a1a',0,0,16,16);fill('#2f8f2f',1,0,14,14);fill('#3fa03f',2,1,12,8);
    fill('#6a4a22',6,9,4,7);fill('#7a5a2a',5,12,6,4);
    px(2,2,'#4fbf4f');px(11,2,'#4fbf4f');px(5,6,'#58c858');px(12,7,'#58c858');px(2,7,'#389038');px(13,5,'#389038');
    px(10,1,'#3a9a3a');px(4,1,'#3a9a3a');
    px(7,9,'#e05050');px(10,9,'#e85858');
  }else if(c==='#'){
    fill('#c88850');fill('#b87848',0,4,16,4);fill('#b87848',0,12,16,4);
    for(let i=0;i<16;i+=8){px(i,2,'#a06838');px(i+4,6,'#a06838');px(i,10,'#a06838');px(i+4,14,'#a06838');}
  }else if(c==='f'){
    fill('#c8a868');for(let i=0;i<8;i++)px(irnd(0,15),irnd(0,15),rng()<.5?'#b89858':'#d8b878');
    fill('#9a7a4a',0,0,16,2);fill('#9a7a4a',0,14,16,2);
  }else if(c==='r'){
    fill('#b04848');fill('#c05858',1,1,14,14);fill('#e07070',4,4,4,4);fill('#e07070',9,9,4,4);
  }else if(c==='b'){
    fill('#8a6a3a');for(let i=0;i<16;i+=4){fill('#9a7a4a',i,0,4,16);px(i+1,2,'#6a4a2a');px(i+1,6,'#6a4a2a');px(i+1,10,'#6a4a2a');px(i+1,14,'#6a4a2a');}
  }else if(c==='D'){
    fill('#6a4a2a');fill('#7a5a3a',2,0,12,16);fill('#3a2a1a',5,8,6,8);fill('#e0d060',6,9,2,2);fill('#e0d060',9,9,2,2);
  }else if(c==='M'||c==='C'){
    fill('#e8e8f0');fill(c==='M'?'#4868c8':'#e878a8',0,4,16,12);
    fill('#ffffff',2,6,4,2);fill('#ffffff',10,6,4,2);fill('#000000',4,10,4,2);
  }else if(c==='P'){
    fill('#8898b0');fill('#303848',2,3,12,9);fill('#58d0f0',4,5,8,5);fill('#d8e0e8',4,13,8,3);fill('#586878',7,14,2,2);
  }else if(c==='S'){
    fill('#58b040');fill('#b87848',2,2,12,9);fill('#e8e0c8',3,3,10,7);fill('#4a3a1a',5,8,6,3);
    x.fillStyle='#e8e0c8';x.fillRect(6,4,4,1);
  }else if(c==='^'){
    fill('#889088');fill('#a8b0a8',1,5,14,10);fill('#889088',3,8,12,7);fill('#687068',2,12,14,4);
    fill('#c8d0c8',1,6,5,2);
  }else if(c==='o'){
    fill('#58b040');fill('#a8a898',4,7,8,7);fill('#c8c8b8',6,5,6,3);fill('#888878',5,12,8,3);
    fill('#b8b8a8',4,8,2,2);px(9,4,'#4ea03a');px(12,6,'#4ea03a');px(3,13,'#66c04a');
  }else if(c==='F'){
    fill('#58b040');fill('#8a6a3a',0,4,16,3);fill('#6a4a2a',2,0,2,16);fill('#6a4a2a',12,0,2,16);fill('#8a6a3a',4,0,2,5);
  }else if(c==='c'){
    fill('#889088');fill('#203028',3,6,10,7);fill('#102018',5,5,6,2);fill('#102018',6,12,4,3);
  }else if(c==='i'){
    fill('#58b040');for(let i=0;i<14;i++)px(irnd(0,15),irnd(0,15),rng()<.4?'#4ea03a':rng()<.5?'#66c04a':'#5cb848');
    px(8,4,'#f0f0f0');px(9,4,'#f0f0f0');px(8,5,'#f0f0f0');px(9,5,'#f0f0f0');
  }else if(c==='B'){
    fill('#c88850');fill('#d89868',1,2,14,8);fill('#e8b898',3,3,10,4);fill('#a06838',2,10,12,4);
  }else{
    fill('#58b040');
  }
  tileCache[key]=cv2;return cv2;
}
function renderWorld(){
  const m=map();
  centerCamera();
  ctx.fillStyle='#2f8f2f';ctx.fillRect(0,0,VIEW_W,VIEW_H);
  const shadowAt=(px,py)=>{
    ctx.fillStyle='rgba(0,0,0,.14)';
    ctx.beginPath();ctx.ellipse(px+8,py+15,7,2.6,0,0,Math.PI*2);ctx.fill();
  };
  const x0=Math.max(0,Math.floor(G.camX/TILE_W)),y0=Math.max(0,Math.floor(G.camY/TILE_H));
  const x1=Math.min(m.tiles[0].length-1,Math.ceil((G.camX+VIEW_W)/TILE_W));
  const y1=Math.min(m.tiles.length-1,Math.ceil((G.camY+VIEW_H)/TILE_H));
  const wframe=Math.floor(G.tick/400)%2;
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const c=tileChar(S.map,tx,ty);
    const seed=tx*31+ty*17;
    ctx.drawImage(tileSprite(c,seed,c==='W'?wframe:undefined),tx*TILE_W-G.camX,ty*TILE_H-G.camY);
  }
  /* NPCs e jogador */
  for(const n of m.npcs||[]){
    if(n.hidden)continue;
    shadowAt(n.x*TILE_W-G.camX,n.y*TILE_H-G.camY-4);
    const f=Math.floor(G.tick/450)%2;
    ctx.drawImage(npcSprite(n.sprite,n.dir,f),n.x*TILE_W-G.camX,n.y*TILE_H-G.camY-4);
  }
  shadowAt(P.px-G.camX,P.py-G.camY-4);
  ctx.drawImage(playerSprite(P.dir,P.anim),P.px-G.camX,P.py-G.camY-4);
  /* sombra sutil + grama alta cobre o jogador */
  if(tileChar(S.map,P.x,P.y)==='G'){
    ctx.drawImage(tileSprite('G',P.x*31+P.y*17,wframe),P.px-G.camX,P.py-G.camY);
  }
  /* indicador de interação */
  if(Math.floor(G.tick/300)%2===0&&G.mode==='overworld'&&!P.moving){
    const tx=P.x+DX[P.dir],ty=P.y+DY[P.dir];
    const c=tileChar(S.map,tx,ty);
    if((c==='D'||c==='M'||c==='C'||c==='P'||npcAt(S.map,tx,ty)||signAt(tx,ty))&&!solidNpc(S.map,tx,ty)){
      ctx.fillStyle='rgba(255,255,120,.85)';
      ctx.fillRect(tx*TILE_W-G.camX+6,ty*TILE_H-G.camY,4,2);
    }
  }
}
/* ============================================================
   LOOP PRINCIPAL + BOOT
   ============================================================ */
let lastTime=performance.now();
function frameLoop(now){
  const dt=Math.min(50,now-lastTime);lastTime=now;
  if(G.mode!=='title'&&G.mode!=='hall')S.playtime+=dt/1000;
  updateWorld(dt);
  if(G.mode==='overworld')renderWorld();
  Input.tick();
  requestAnimationFrame(frameLoop);
}
function boot(){
  AudioSys.ensure();
  titleOpen();
  G.mode='title';
  requestAnimationFrame(frameLoop);
  if(new URLSearchParams(location.search).has('debug')){
    window.__game={S,P,G,teleport,MAPS,SPECIES,MOVES,newMonster,startTrainerBattle,startRivalBattle,startGymBattle,startChampBattle,battleOpen,battleRefresh,UI,monsterSprite,pxCanvas,checkApproach};
  }
}
boot();
