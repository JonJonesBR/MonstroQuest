<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MonstroQuest GBA — Clone de Pokémon</title>
<style>

:root{
  --ink:#f4f7ff;
  --muted:#9da8c5;
  --gold:#ffd85a;
  --cyan:#68d8ff;
  --violet:#6f55b8;
  --violet-dark:#241a42;
  --panel:#10162a;
  --panel2:#171f38;
  --line:#7784ad;
  --screen:#07101a;
  --danger:#e85b68;
  --ok:#55d98a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% 20%,#24203a 0%,#100d1d 38%,#07070d 100%);
  color:var(--ink);
  font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;
  overflow:hidden;touch-action:none;overscroll-behavior:none;
}
button{font:inherit}
#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  contain:layout style;
}
#play{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
  overflow:hidden;
}
#screen{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070d;
  border:0;
  border-radius:0px;
  box-shadow:none;
  contain:layout style;
}
#screen:before{display:none;}
#screen:after{display:none;}
canvas#world{
  position:absolute;inset:0;width:100%;height:100%;
  image-rendering:pixelated;image-rendering:crisp-edges;display:block;
}
#ui{
  position:absolute;z-index:6;overflow:hidden;
  font-size:10px;line-height:1.35;
  transform-origin:0 0;
}
.hidden{display:none!important}
.pixel{image-rendering:pixelated;image-rendering:crisp-edges}

/* ---------- overlays ---------- */
.ov{
  position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;z-index:5;
  padding:4px;
}
.panel{
  background:linear-gradient(180deg,rgba(28,38,64,.97),rgba(10,14,28,.97));
  border:2px solid #c9d5f4;
  border-radius:10px;
  box-shadow:0 0 0 2px rgba(0,0,0,.7),0 8px 24px rgba(0,0,0,.55);
}
.lbody{scrollbar-width:thin;scrollbar-color:#6b7fb8 rgba(10,14,26,.55)}
.lbody::-webkit-scrollbar{width:5px}
.lbody::-webkit-scrollbar-thumb{background:#6b7fb8;border-radius:3px}
.lbody::-webkit-scrollbar-track{background:rgba(10,14,26,.55)}
.msgbox{
  position:absolute;left:4px;right:4px;bottom:36%;
  background:linear-gradient(180deg,rgba(20,28,52,.98),rgba(8,12,26,.98));
  border:2px solid #d4def8;border-radius:10px;
  padding:10px 12px;min-height:56px;z-index:12;
  box-shadow:0 0 0 2px rgba(0,0,0,.6),0 5px 15px rgba(0,0,0,.45);
}
.msgbox .txt{white-space:pre-wrap;font-weight:bold;text-shadow:1px 1px 0 #000;font-size:11px;line-height:1.5}
.msgbox .arrow{
  position:absolute;right:9px;bottom:5px;color:var(--gold);
  animation:blink .7s steps(2) infinite;
}
@keyframes blink{50%{opacity:0}}
.msgbox .choices{
  display:flex;gap:14px;justify-content:flex-end;
  margin-top:6px;flex-wrap:wrap
}
.choice{font-weight:bold;color:#d9e2ff;cursor:pointer;text-shadow:1px 1px 0 #000;padding:4px 8px;border-radius:4px}
.choice.sel{color:var(--gold)}
.choice.sel:before{content:"▶ ";color:var(--gold)}

/* ---------- title ---------- */
#title{
  background:
    radial-gradient(circle at 50% 20%,rgba(69,87,158,.5),transparent 40%),
    radial-gradient(circle at 30% 70%,rgba(80,40,120,.2),transparent 50%),
    linear-gradient(180deg,#111a36 0%,#0a0e20 50%,#05070d 100%);
  text-align:center;flex-direction:column;gap:8px;
}
#title:before{
  content:"";
  position:absolute;top:13%;width:48%;height:1px;
  background:linear-gradient(90deg,transparent,#7e8dc0,transparent);
  opacity:.65;
}
#title h1{
  font-size:clamp(22px,8vw,32px);color:var(--gold);letter-spacing:3px;
  text-shadow:2px 2px 0 #9b303b,3px 3px 0 #6b2028,5px 5px 0 #000,0 0 30px rgba(255,216,90,.2);
  transform:translateY(-3px);
  animation:titlepulse 2.5s ease-in-out infinite
}
@keyframes titlepulse{0%,100%{text-shadow:2px 2px 0 #9b303b,3px 3px 0 #6b2028,5px 5px 0 #000}50%{text-shadow:2px 2px 0 #b0404a,3px 3px 0 #803038,5px 5px 0 #000,0 0 20px rgba(255,216,90,.3)}}
#title .sub{color:#b9c5e4;font-size:10px}
#title .menu{
  display:flex;flex-direction:column;gap:7px;
  margin-top:8px;min-width:118px
}
#title .tm{
  padding:8px 14px;font-weight:bold;color:#d7e0f8;
  cursor:pointer;font-size:14px;border:1px solid transparent;
  border-radius:6px;transition:background .15s
}
#title .tm.sel{
  color:var(--gold);background:linear-gradient(90deg,rgba(61,78,153,.3),rgba(61,78,153,.5),rgba(61,78,153,.3));
  border-color:rgba(255,216,90,.35);
  text-shadow:0 0 10px rgba(255,216,90,.7);
  box-shadow:0 0 16px rgba(255,216,90,.15)
}
#title .tm.sel:before{content:"▶ "}
#title .credit{
  position:absolute;bottom:7px;left:0;right:0;
  color:#68728d;font-size:8px
}

/* ---------- menus / lists ---------- */
#menu{
  background:linear-gradient(180deg,rgba(7,11,24,.98),rgba(14,18,36,.98));
  flex-direction:column;justify-content:flex-start;padding:6px 5px
}
#menu .mrow{
  width:100%;padding:8px 10px;font-weight:bold;color:#d5def5;
  display:flex;justify-content:space-between;align-items:center;
  border-radius:4px;cursor:pointer
}
#menu .mrow.sel{background:linear-gradient(90deg,#3d59bd,#2a3f94);color:#fff}
#menu .mrow.sel:before{content:"▶ "}
.box-title{
  text-align:center;color:var(--gold);font-weight:bold;
  letter-spacing:1px;padding:4px 0 3px
}
#bag .crow,#dex .drow,#pc .prow,#party .prow{
  border-radius:3px
}
#bag{flex-direction:column}
#bag .crow{
  display:flex;justify-content:space-between;padding:6px 10px;
  font-weight:bold;color:#d5def5;cursor:pointer
}
#bag .crow.sel{background:#344ca8;color:#fff}
#bag .crow.sel:before{content:"▶ "}
#party{flex-direction:column}
#party .prow{
  display:flex;gap:7px;align-items:center;padding:6px 8px;
  font-weight:bold;color:#d5def5;border:1px solid transparent;cursor:pointer
}
#party .prow.sel{background:#344ca8;color:#fff}
#party .prow .mini{width:26px;height:26px;flex:0 0 auto}
#party .prow .info{flex:1;display:flex;flex-direction:column}
#party .prow .hpmini{font-size:.85em;color:#9da8c5}
#party .prow{flex-wrap:wrap}
#dex{flex-direction:column}
#dex .drow{
  display:flex;justify-content:space-between;padding:3px 10px;
  font-weight:bold;color:#d5def5
}
#dex .drow.sel{background:#344ca8;color:#fff}
#card{flex-direction:column;gap:2px;text-align:left}
#card .cline{padding:3px 12px;color:#d5def5}
#card .cline b{color:#fff}
#pc{flex-direction:column}
#pc .prow{display:flex;gap:6px;align-items:center;padding:3px 8px;font-weight:bold;color:#d5def5}
#pc .prow.sel{background:#344ca8;color:#fff}

/* ---------- battle ---------- */
#battle{
  background:
    radial-gradient(100% 50% at 80% 8%,rgba(255,240,180,.7),rgba(255,240,180,0) 45%),
    radial-gradient(80% 40% at 20% 15%,rgba(255,180,120,.25),transparent 60%),
    radial-gradient(120% 80% at 50% -5%,rgba(255,255,255,.5),rgba(255,255,255,0) 50%),
    linear-gradient(180deg,
      #60b8e0 0%,#78c8f0 6%,#90d4f8 12%,
      #a8e0f4 18%,#c0ecf0 24%,
      #b0e8d8 30%,#a0e0c8 34%,
      #88d080 38%,#68b858 42%,
      #58a848 48%,#4a9838 54%,
      #3a8830 60%,#2d7828 68%,
      #246820 76%,#1c5818 84%,
      #144812 92%,#0e3a0e 100%);
  display:flex;flex-direction:column;justify-content:space-between;
  position:absolute !important;inset:0;overflow:hidden
}
#battle .field{position:absolute;inset:0;overflow:hidden;z-index:0}
#battle .field:before{
  content:"";position:absolute;left:0;right:0;top:45%;height:4px;
  background:linear-gradient(90deg,rgba(37,73,52,.15),rgba(80,130,70,.6),rgba(37,73,52,.15));
  box-shadow:0 -1px 0 rgba(255,255,255,.25),0 2px 5px rgba(0,0,0,.25),0 0 10px rgba(80,130,70,.2)
}
#battle .field:after{
  content:"";position:absolute;left:0;right:0;top:44%;bottom:0;
  background:
    repeating-linear-gradient(85deg,rgba(35,80,40,.15) 0 2px,transparent 2px 8px),
    repeating-linear-gradient(95deg,rgba(50,100,50,.10) 0 3px,transparent 3px 12px),
    radial-gradient(70% 90% at 50% 5%,rgba(130,215,95,.3),rgba(130,215,95,0) 70%),
    radial-gradient(40% 60% at 25% 55%,rgba(60,120,40,.15),transparent),
    radial-gradient(40% 60% at 75% 65%,rgba(40,90,30,.12),transparent),
    radial-gradient(30% 40% at 50% 80%,rgba(30,70,25,.10),transparent),
    repeating-linear-gradient(80deg,rgba(255,255,255,.02) 0 1px,transparent 1px 6px)
}
/* Sprites: z:3 above field(0), above battle-msg(6), below cmd(7) */
#battle .opp{position:absolute;right:7%;top:8%;z-index:3}
#battle .ply{position:absolute;left:7%;bottom:34%;z-index:3}
#battle .spr{image-rendering:pixelated;image-rendering:crisp-edges}
#battle .opp .spr,#battle .ply .spr{width:clamp(64px,26vmin,150px);height:clamp(64px,26vmin,150px)}
#battle .opp:after,#battle .ply:after{
  content:"";position:absolute;left:50%;bottom:-6px;
  width:70%;min-width:44px;max-width:150px;height:12px;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,0) 65%);
  z-index:-1;pointer-events:none
}
#battle .opp .spr,#battle .ply .spr{animation:battlebob 1.8s ease-in-out infinite}
#battle .opp.faint .spr,#battle .ply.faint .spr{animation:none}
/* HP boxes: z:4 above sprites */
#battle .hbox{
  position:absolute;
  min-width:100px;
  background:linear-gradient(180deg,rgba(18,26,48,.97),rgba(6,10,22,.97));
  border:2px solid #c0cce8;border-radius:10px;
  padding:5px 10px;min-width:118px;z-index:4;
  box-shadow:0 2px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1)
}
#battle .hbox.ohp{left:2.5%;top:1.5%}
#battle .hbox.php{right:2.5%;bottom:66%}
#battle .btype{
  display:inline-block;margin-left:5px;padding:0 4px;border-radius:5px;
  font-size:7.5px;line-height:11px;font-weight:bold;color:#fff;letter-spacing:.4px;
  text-shadow:1px 1px 0 rgba(0,0,0,.55);vertical-align:2px;border:1px solid rgba(255,255,255,.25)
}
#battle .hpwrap{
  background:#121828;border:1px solid #0a0e1a;height:10px;width:100%;
  margin-top:4px;position:relative;border-radius:5px;overflow:hidden;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.06)
}
#battle .hpwrap:after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.22) 6px 7px),
    linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%)
}
#battle .hpfill{
  height:100%;width:100%;position:relative;
  background-color:var(--ok);
  background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.05) 50%,rgba(0,0,0,.15));
  transition:width .4s steps(8);
  border-radius:3px
}
#battle .hpfill.low{background-color:#e85b68}
#battle .hpfill.mid{background-color:var(--gold)}
#battle .hpfill.warn{animation:blink .5s steps(2) infinite}
#battle .bstat{font-size:.92em;color:#b9c5e4;display:flex;justify-content:space-between;align-items:center;margin-top:2px}
#battle .bstat .lv{color:#9da8c5}
#battle .bstat .hpnum{font-weight:bold}
#battle .bname{font-size:10px;font-weight:bold;color:#d7e0f8;text-shadow:1px 1px 0 #000}
/* Status badges: z:5 */
#bst{
  position:absolute;left:50%;top:14%;transform:translateX(-50%);
  z-index:5;padding:3px 10px;border-radius:6px;font-size:8px;font-weight:bold;
  color:#ffe0e8;background:rgba(20,12,35,.88);border:1px solid rgba(255,200,220,.3);
  text-shadow:1px 1px 0 #000;white-space:nowrap
}
/* Message box: z:6 above sprites, below cmd */
#battle .battle-msg{
  position:absolute;left:0;right:0;bottom:0;height:30%;
  box-sizing:border-box;
  background:linear-gradient(180deg,rgba(14,20,40,.99),rgba(6,10,22,.99));
  border-top:2px solid #d0daf0;
  padding:8px 14px;z-index:6;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 -4px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)
}
#battle .battle-msg .btxt{
  white-space:pre-wrap;font-weight:bold;text-shadow:1px 1px 0 #000;
  color:var(--ink);font-size:10px;text-align:center;
  max-height:100%;overflow:hidden
}
#battle .battle-msg .barrow{
  position:absolute;right:9px;bottom:5px;color:var(--gold);
  animation:blink .7s steps(2) infinite
}
#battle .msgbox{display:none!important}
#battle .ov .msgbox{display:none!important}
#battle ~ .msgbox{bottom:34%}
/* Command / Moves: z:7 above everything */
#battle .cmd,#battle .moves{
  position:absolute;left:0;right:0;bottom:0;height:30%;
  background:linear-gradient(180deg,rgba(14,20,39,.99),rgba(6,10,21,.99));
  border-top:2px solid #d4def8;
  display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;z-index:7;
  backdrop-filter:blur(2px)
}
#battle .cmd .opt{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-weight:bold;color:#d5def5;cursor:pointer;
  border:1px solid rgba(140,156,196,.25);
  transition:background .12s
}
#battle .cmd .opt.sel{
  color:#fff;background:linear-gradient(180deg,#3d59bd,#2a3f94);
  box-shadow:inset 0 0 0 2px var(--gold),0 0 8px rgba(255,216,90,.2)
}
#battle .opt .gt{display:flex;align-items:center;justify-content:center;gap:6px;text-shadow:1px 1px 0 #000;font-size:12px}
#battle .opt .ic{font-size:14px;line-height:1}
#battle .opt .gs{color:#9da8c5;font-size:8.2px;text-shadow:1px 1px 0 #000}
#battle .opt .tag{
  display:inline-block;padding:0 4px;border-radius:5px;margin:0 2px;
  font-size:7.2px;line-height:10px;color:#fff;letter-spacing:.3px;
  border:1px solid rgba(255,255,255,.3);text-shadow:1px 1px 0 rgba(0,0,0,.55)
}
#battle .moves .opt{
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;
  padding-left:8%;border:1px solid rgba(140,156,196,.25);
  font-weight:bold;color:#d5def5
}
#battle .moves .opt.sel{background:#344ca8;color:#fff}
#battle .moves .opt .pp{color:#9da8c5;font-size:.85em}
/* Battle list: z:8 */
#battle .list{
  position:absolute;left:0;right:0;bottom:0;height:50%;
  background:rgba(7,11,23,.98);border-top:2px solid #d4def8;
  z-index:8;overflow-y:auto;padding-top:3px;
  scrollbar-width:thin;scrollbar-color:#6b7fb8 rgba(10,14,26,.55)
}
#battle .list::-webkit-scrollbar{width:5px}
#battle .list::-webkit-scrollbar-thumb{background:#6b7fb8;border-radius:3px}
#battle .list::-webkit-scrollbar-track{background:rgba(10,14,26,.55)}
#battle .list .row{
  display:flex;justify-content:space-between;padding:3px 8px;
  font-weight:bold;color:#d5def5
}
#battle .list .row.sel{background:#344ca8;color:#fff}
#battle .list .row .hpmini{color:#9da8c5;font-size:.85em}
/* Damage FX: z:5 */
#battle .dmgfx{position:absolute;inset:0;pointer-events:none;z-index:5}
#battle .flash{background:#fff;opacity:.85;animation:bfxflash .14s}
#battle .opp.hit,#battle .ply.hit{animation:shake .28s}
#battle .opp.faint,#battle .ply.faint{opacity:0;transition:opacity .6s}
#battle .sun{
  position:absolute;left:4%;top:25%;width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#fffbe8,#ffe680 40%,#ffb830 70%,#f0a020);
  box-shadow:0 0 24px 10px rgba(255,214,90,.45),0 0 60px 20px rgba(255,200,80,.15);
  z-index:1
}
#battle .cloud{
  position:absolute;background:rgba(250,252,255,.85);border-radius:20px;height:10px;
  opacity:.9;filter:drop-shadow(0 3px 2px rgba(110,140,155,.35));z-index:1
}
#battle .cloud:before,#battle .cloud:after{
  content:"";position:absolute;background:inherit;border-radius:50%
}
#battle .cloud:before{width:16px;height:16px;top:-7px;left:9px}
#battle .cloud:after{width:12px;height:12px;top:-5px;left:27px}
#battle .cloud.c1{right:14%;top:6%;width:46px}
#battle .cloud.c2{right:36%;top:17%;width:30px;opacity:.55;transform:scale(.78)}
#battle .hill{
  position:absolute;bottom:30%;z-index:0;
  background:linear-gradient(180deg,#a8e080,#78b858 50%,#509040 80%,#3a7830);
  border-radius:50% 50% 0 0/100% 100% 0 0;opacity:.9;
  filter:drop-shadow(0 -3px 5px rgba(0,0,0,.12))
}
#battle .hill.h1{left:-7%;width:46%;height:34%}
#battle .hill.h2{right:-9%;width:54%;height:26%;opacity:.75;background:linear-gradient(180deg,#86bd62,#5a9a4a 62%,#3c7438)}
#battle .opp.lunge,#battle .ply.lunge{animation:lunge .34s ease-out}
#battle .p{
  position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#fff,#ffd75e 55%,#f0882e);
  box-shadow:0 0 4px rgba(255,200,80,.85);
  animation:bfxpart .6s ease-out forwards
}
#battle .p.w2{width:3px;height:3px;background:#fff;box-shadow:0 0 3px rgba(255,255,255,.9)}
#battle.shake{animation:bfxshake .3s}
#ball{animation:ballthrow .65s ease-in}
#battle .cmd.hidden,#battle .moves.hidden{display:none}
#battle .cmd:empty,#battle .moves:empty{display:none}
.battle-msg.hidden{display:none!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes bfxflash{0%{opacity:.95}100%{opacity:0}}
@keyframes cloudDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
@keyframes battlebob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes lunge{0%{transform:translate(0,0)}45%{transform:translate(var(--lx),-4px)}100%{transform:translate(0,0)}}
@keyframes bfxpart{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.25);opacity:0}}
@keyframes bfxshake{0%,100%{transform:translate(0,0)}15%{transform:translate(-5px,3px)}30%{transform:translate(5px,-3px)}45%{transform:translate(-4px,-2px)}60%{transform:translate(4px,2px)}75%{transform:translate(-2px,1px)}90%{transform:translate(2px,-1px)}}
@keyframes ballthrow{0%{top:6%;transform:translateX(-50%) scale(1)}30%{top:35%;transform:translateX(-50%) scale(.85)}55%{top:15%;transform:translateX(-50%) scale(1.05)}75%{top:22%;transform:translateX(-50%) scale(.9)}100%{top:20%;transform:translateX(-50%) scale(1)}}
/* ---------- barra de toque (mobile first) ---------- */
#tbar{
  position:absolute;top:4px;right:4px;
  display:flex;gap:4px;z-index:30;pointer-events:none;
}
#tbar button{
  pointer-events:auto;
  width:32px;height:28px;padding:1px 0;font-size:13px;line-height:1;
  color:#edf2ff;background:linear-gradient(145deg,rgba(40,34,66,.65),rgba(20,15,38,.72));
  border:1px solid rgba(255,255,255,.12);border-radius:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06);
  cursor:pointer;transition:transform .1s
}
#tbar button:active{transform:translateY(1px);background:rgba(70,90,170,.9)}
#tbar button .lb{display:block;font-size:6px;letter-spacing:.3px;color:#aab6d5;margin-top:1px}
#tbar button.off{opacity:.55}
#tbar #tmnu{display:none}
#tbar.has-menu #tmnu{display:block}
#tbar.busy{display:none!important}

/* ---------- área segura / orientação ---------- */
#safe-probe{
  position:fixed;left:0;top:0;width:100%;height:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
  box-sizing:border-box;pointer-events:none;visibility:hidden
}
#safe-probe span{display:block;width:100%;height:100%}

/* fallback: nunca permitir que a área do jogo tenha tamanho zero */
#play{inset:0;min-width:1px;min-height:1px}

/* MOBILE FIRST: o jogo ocupa 100% da área visível em qualquer orientação */
body.touch #app #play{
  left:0;top:0;right:0;bottom:0;
  width:100% !important;height:100% !important;
  align-items:center;justify-content:center
}


/* landscape battle layout: consistent scaling for both orientations */
body.touch.landscape #battle .cmd,body.touch.landscape #battle .moves{
  bottom:0;height:30%
}
body.touch.landscape .msgbox{
  bottom:34%
}
body.touch.landscape #battle .battle-msg{height:30%}
body.touch.landscape #battle .ply{bottom:34%}
body.touch.landscape #battle .hbox.php{bottom:66%}
body.touch.landscape #battle .opp{top:8%}
body.touch.landscape #battle .hbox.ohp{top:1.5%}
body.touch.landscape #battle .status{top:14%}
body.touch.landscape #battle .sun{left:3%;top:24%}
body.touch.landscape #battle .cloud.c1{right:6%;top:3%}
body.touch.landscape #battle .cloud.c2{right:24%;top:11%}
body.touch.landscape #battle .hill.h1{height:22%;bottom:29%}
body.touch.landscape #battle .hill.h2{height:17%;bottom:29%}
body.touch.landscape.in-battle .ov .panel{
  max-height:80%;margin-bottom:6%
}
body.touch.landscape.in-battle .ov{
  padding-bottom:6%
}
body.touch.portrait.in-battle .ov .panel{
  max-height:92%;margin-bottom:3%
}
body.touch.portrait.in-battle #battle .cmd,body.touch.portrait.in-battle #battle .moves{
  bottom:0;height:30%
}
body.touch.portrait.in-battle #battle .battle-msg{height:30%}
body.touch.portrait.in-battle #battle .ply{bottom:34%}
body.touch.portrait.in-battle #battle .hbox.php{bottom:66%}
body.touch.portrait.in-battle #battle .list{height:46%}
body.touch.portrait.in-battle #battle .opp{top:8%}
body.touch.portrait.in-battle #battle .hbox.ohp{top:1.5%}
body.touch.portrait.in-battle #battle .status{top:14%}
body.touch.portrait.in-battle #battle .sun{left:4%;top:24%}
body.touch.portrait.in-battle #battle .cloud.c1{right:8%;top:3%}
body.touch.portrait.in-battle #battle .cloud.c2{right:28%;top:12%}
body.touch.portrait.in-battle #battle .hill.h1{height:24%;bottom:29%}
body.touch.portrait.in-battle #battle .hill.h2{height:18%;bottom:29%}



/* acessibilidade: sem animação se o sistema pedir menos movimento */
@media (prefers-reduced-motion:reduce){
  #tbar button{transition:none}
  #battle .barrow,#ball,#battle .opp .spr,#battle .ply .spr{animation:none}
}


/* telas pequenas: jogo continua ocupando 100% */
@media (max-width:480px) and (orientation:portrait){
  body.touch #app.portrait #play{inset:0;height:100%}
}

  kdown(e){const a=KEYMAP[e.key];if(!a)return;e.preventDefault();if(!this.held[a]){this.held[a]=true;this.down[a]=true;this.press(a);}this.maybeNav(a);},

/* ---------- layout responsivo: tela cheia (vertical/horizontal) ---------- */
const SCREEN_BORDER=3; /* borda da moldura (3px de cada lado) */

function visibleArea(){
  const vv=window.visualViewport;
  let L=0,T=0,W=innerWidth,H=innerHeight;
  if(vv&&vv.width){
    L=vv.offsetLeft||0;T=vv.offsetTop||0;W=vv.width;H=vv.height;
  }
  const probe=$('safe-probe');
  if(probe){
    const r=probe.firstElementChild.getBoundingClientRect();
    if(r.width>0&&r.height>0){
      const sl=Math.max(L,r.left),st=Math.max(T,r.top),
            sr=Math.min(L+W,r.right),sb=Math.min(T+H,r.bottom);
      if(sr>sl&&sb>st){L=sl;T=st;W=sr-sl;H=sb-st;}
    }
  }
  return {left:L,top:T,width:W,height:H};
}
function fitScreen(){
  const play=$('play'),sc=screenEl;if(!play||!sc)return;
  const r=play.getBoundingClientRect();
  if(!r.width||!r.height)return;
  const app=$('app');
  const fill=app&&app.classList.contains('fill');
  const b=SCREEN_BORDER;
  const cw=Math.max(20,r.width-b),ch=Math.max(20,r.height-b);
  let sx,sy;
  if(fill){
    /* estica canvas+UI para ocupar toda a área (borda incluída) */
    sx=cw/240;sy=ch/160;
    sc.style.width=r.width+'px';
    sc.style.height=r.height+'px';
  }else{
    /* mantém proporção 240:160, centralizado, sem cortar nada */
    const s=Math.min(cw/240,ch/160);
    sx=s;sy=s;
    sc.style.width=(240*s)+'px';
    sc.style.height=(160*s)+'px';
  }
  const ui=$('ui');
  if(ui){
    ui.style.width='240px';
    ui.style.height='160px';
    ui.style.left='0px';
    ui.style.top='0px';
    ui.style.transform='scale('+sx+','+sy+')';
  }
}
function scaleMode(){
  const app=$('app');if(!app)return 'fit';
  const landscape=app.classList.contains('landscape');
  let m=null;
  try{m=localStorage.getItem('mq_scale_'+(landscape?'landscape':'portrait'));}catch(e){}
  if(m==='fill'||m==='fit')return m;
  if(landscape&&document.body&&document.body.classList.contains('touch'))return 'fill';
  return 'fit';
}
function cycleScale(){
  const app=$('app');if(!app)return;
  const landscape=app.classList.contains('landscape');
  const fill=app.classList.toggle('fill');
  try{localStorage.setItem('mq_scale_'+(landscape?'landscape':'portrait'),fill?'fill':'fit');}catch(e){}
  applyLayout();
}
function applyLayout(){
  const app=$('app');if(!app)return;
  const v=visibleArea();
  app.style.left=v.left+'px';
  app.style.top=v.top+'px';
  app.style.width=v.width+'px';
  app.style.height=v.height+'px';
  const landscape=v.height<=v.width;
  app.classList.toggle('landscape',landscape);
  app.classList.toggle('portrait',!landscape);
  app.classList.toggle('fill',scaleMode()==='fill');
  fitScreen();

    if(p&&p.catch)p.catch(()=>{});

    const p=d.exitFullscreen?d.exitFullscreen():d.webkitExitFullscreen?d.webkitExitFullscreen():null;

/* ---------- áudio (WebAudio chiptune) ---------- */
const AudioSys={
  ctx:null,muted:false,musicTimer:null,musicKind:null,
  ensure(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  tone(f,dur,type='square',vol=.12,slide=0,delay=0){

    if(this.musicKind===kind)return;this.stopMusic();this.musicKind=kind;
    const seq={title:[[392,1],[523,1],[659,1],[523,1],[392,1],[330,1],[392,2]],
      town:[[262,.5],[330,.5],[392,.5],[523,.5],[392,.5],[330,.5],[262,1],[220,1]],
      route:[[196,.4],[196,.4],[233,.4],[262,.4],[196,.4],[262,.4],[311,.4],[330,1]],
      cave:[[196,.5],[165,.5],[131,.5],[165,.5],[196,.5],[147,.5],[131,1]],
      battle:[[523,.18],[659,.18],[784,.18],[659,.18],[523,.18],[659,.18],[880,.18],[784,.36]],

const pxCache={};
function pxCanvas(key,rows,pal,scale){
  if(pxCache[key])return pxCache[key];
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;
  const x=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x2=0;x2<rows[y].length;x2++){
    const ch=rows[y][x2],col=pal[ch];if(!col)continue;
    x.fillStyle=col;x.fillRect(x2*scale,y*scale,scale,scale);
  }
  pxCache[key]=c;return c;
}

/* ---------- gerador de monstros ---------- */
function monsterGrid(spec,back){
  const g=Array.from({length:16},()=>Array(16).fill('.'));
  const set=(x,y,c)=>{x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<16&&y<16)g[y][x]=c;};
  const ell=(cx,cy,rw,rh,c)=>{for(let y=0;y<16;y++)for(let x=0;x<16;x++){const dx=(x-cx)/rw,dy=(y-cy)/rh;if(dx*dx+dy*dy<=1)set(x,y,c);}};
  const rect=(x,y,w,h,c)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)set(i,j,c);};
  const A=spec.arch||'blob',B='B',b='b',a='a',e='E',p='e',m='M';
  if(A==='quad'){
    ell(7,10,6.2,3.8,B);ell(12.5,6.5,3.2,2.9,B);ell(6,13.5,3,1.2,b);
    rect(4,13,2,2,B);rect(9,13,2,2,B);rect(12.5,13,2,2,B);
    if(spec.tail)ell(2.5,8,2.2,1.2,a);
    if(spec.ears){ell(12,2.5,1.1,1.4,a);ell(14.5,2.5,1.1,1.4,a);}
    if(spec.horns){ell(11.5,2.8,1.2,1.6,a);ell(14.5,2.8,1.2,1.6,a);}
    if(!back){set(11.5,5.5,e);set(13.5,5.5,e);set(11.5,5.5,p);rect(11,8.5,3,1.5,m);}else{ell(13,5.5,1.6,1.2,a);}
  }else if(A==='bird'){
    ell(7,8.5,4.2,3.4,B);ell(11.5,4.8,2.6,2.4,B);rect(14,4.5,2,2,m);ell(3.5,7.5,2,2.4,a);
    rect(5,12,2,2,a);rect(8,12,2,2,a);rect(11,11.5,2,1.5,a);
    if(spec.wing)ell(6.5,9.5,2.4,1.6,a);
    if(spec.horns)ell(11.5,1.5,1.1,1.3,a);
    if(!back){set(12,4,e);set(12,4,p);}else{ell(12,4.5,1.4,1,a);}
  }else if(A==='serpent'){
    ell(3.5,11.5,2.4,2,B);ell(7,9.5,2.6,2.2,B);ell(10.5,8,2.8,2.4,B);ell(13.5,6.5,2.8,2.6,B);
    if(spec.tail)ell(1.5,13,1.3,1.2,a);
    if(spec.belly)rect(3,13,3,1.4,b);
    if(spec.horns){ell(12,2.6,1.2,1.5,a);ell(15,3,1.2,1.5,a);}
    if(!back){set(12.5,5.5,e);set(15,6,e);set(12.5,5.5,p);set(15,6,p);rect(13.5,9,2.6,1.4,m);}else{ell(15,5.5,1.5,1.1,a);}
  }else if(A==='biped'){
    rect(5,12,3,3,B);rect(10,12,3,3,B);ell(8,8.5,4,3.4,B);ell(8,2.6,3,2.6,B);
    rect(2.5,7,2,3.5,B);rect(11.5,7,2,3.5,B);
    if(spec.belly)ell(8,9.5,2,1.8,b);
    if(spec.ears){ell(5.5,0,1.2,1.3,a);ell(10.5,0,1.2,1.3,a);}
    if(spec.horns){ell(6,0.8,1.1,1.4,a);ell(10,0.8,1.1,1.4,a);}
    if(spec.tail)ell(2.5,9.5,1.6,1.5,a);
    if(!back){set(7,2.4,e);set(9,2.4,e);set(7,2.4,p);set(9,2.4,p);rect(6.5,4.8,3,1.2,m);}else{ell(8,2.6,2,1.6,a);}
  }else if(A==='fish'){
    ell(8,8.5,4.4,3,B);ell(2.5,8,1.8,2.2,a);ell(10,4.5,1.6,1.1,a);ell(10,12.5,1.6,1.1,a);
    if(spec.belly)ell(8,9.5,2.6,1.5,b);
    if(!back){set(10,7.5,e);set(10,7.5,p);rect(11,10,2,1.2,m);}else{ell(10.5,8.5,1.4,1,a);}
  }else{ /* blob */
    ell(7.5,8.5,5.4,4.2,B);ell(8,9.5,3,2.2,b);
    rect(5,13,2.4,1.6,B);rect(10,13,2.4,1.6,B);
    if(spec.tail)ell(2,6.5,1.6,1.3,a);
    if(spec.ears){ell(5,2.8,1.3,1.5,a);ell(10,2.8,1.3,1.5,a);}
    if(spec.horns){ell(5.5,2.2,1.1,1.5,a);ell(9.5,2.2,1.1,1.5,a);}
    if(spec.wing)ell(4,7,1.8,1.3,a);
    if(!back){set(9,7,e);set(12,7.5,e);set(9,7,p);set(12,7.5,p);rect(10,10.5,2.6,1.2,m);}else{ell(12.5,7,1.5,1.1,a);}
  }
  /* contorno */
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    if(g[y][x]!=='.')continue;
    let n=false;
    for(let dy=-1;dy<=1&&!n;dy++)for(let dx=-1;dx<=1&&!n;dx++){
      const nx=x+dx,ny=y+dy;
      if(nx>=0&&ny>=0&&nx<16&&ny<16&&g[ny][nx]!=='.'&&g[ny][nx]!=='o')n=true;
    }
    if(n)g[y][x]='o';
  }
  if(back){ /* sombreia o corpo pra diferenciar as costas */
    for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(g[y][x]==='B')g[y][x]='S';
  }
  return g;
}
function monsterSprite(spec,back,scale){
  const key='mon'+spec.id+(back?'b':'f');
  if(pxCache[key])return pxCache[key];
  scale=scale||5;
  const g=monsterGrid(spec,back);
  const pal={B:spec.col[0],b:spec.col[1]||spec.col[0],a:spec.col[2]||'#fff',E:'#ffffff',e:'#111',M:'#222',o:'#000',S:spec.col[3]||'#203050'};
  /* contorno suavizado: remove "degraus" diagonais, deixando curvas mais redondas */
  const corner=new Set();
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    if(g[y][x]!=='o')continue;
    let ortho=false;
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+d[0],ny=y+d[1];
      if(nx<0||ny<0||nx>=16||ny>=16){ortho=true;break;}
      const v=g[ny][nx];
      if(v!=='.'&&v!=='o'){ortho=true;break;}
    }
    if(!ortho)corner.add(y+','+x);
  }
  const c=document.createElement('canvas');c.width=16*scale;c.height=16*scale;
  const x=c.getContext('2d');
  for(let y=0;y<16;y++)for(let xi=0;xi<16;xi++){
    if(corner.has(y+','+xi))continue;
    const ch=g[y][xi],col=pal[ch];if(!col)continue;
    x.fillStyle=col;x.fillRect(xi*scale,y*scale,scale,scale);
  }
  /* brilho superior sutil nos pixels do topo do corpo */
  x.globalAlpha=.5;x.fillStyle=pal.a;
  for(let y=0;y<16;y++)for(let xi=0;xi<16;xi++){
    if(corner.has(y+','+xi))continue;
    if(g[y][xi]!=='B'&&g[y][xi]!=='S')continue;
    if(y===0||g[y-1][xi]==='.'||g[y-1][xi]==='o')x.fillRect(xi*scale,y*scale,scale,scale);
  }
  x.globalAlpha=1;
  /* highlight pixel on the top-center of body for extra depth */
  x.globalAlpha=.35;
  x.fillStyle='#ffffff';
  for(let y=1;y<14;y++)for(let xi=6;xi<10;xi++){
    if(corner.has(y+','+xi))continue;
    if(g[y][xi]!=='B'||g[y-1][xi]==='B'||g[y-1][xi]==='S')continue;
    x.fillRect(xi*scale,y*scale,scale,scale);
  }
  x.globalAlpha=1;
  pxCache[key]=c;return c;
}

/* construtores de grids */
function mk(w,h,fill){const f=fill===undefined?'.':fill;const g=[];for(let y=0;y<h;y++)g.push(Array(w).fill(f));return g;}
function hline(g,x,y,w,c){for(let i=0;i<w;i++)g[y][x+i]=c;}
function vline(g,x,y,h,c){for(let i=0;i<h;i++)g[y+i][x]=c;}
function rect(g,x,y,w,h,c){hline(g,x,y,w,c);hline(g,x,y+h-1,w,c);vline(g,x,y,h,c);vline(g,x+w-1,y,h,c);}
function box(g,x,y,w,h){rect(g,x,y,w,h,'#');for(let yy=y+1;yy<y+h-1;yy++)for(let xx=x+1;xx<x+w-1;xx++)g[yy][xx]='.';g[y+h-1][x+(w>>1)-1]='D';g[y+h-1][x+(w>>1)]='D';}
function ring(g,c){for(let i=0;i<g.length;i++){g[i][0]=c;g[i][g[i].length-1]=c;}hline(g,0,0,g[0].length,c);hline(g,0,g.length-1,g[0].length,c);}
function gap(g,x,y){g[y][x]=',';g[y][x+1]=',';}
function scatter(g,rng,n,ch,avoid){let tries=0;while(n>0&&tries<400){const x=irnd(2,g[0].length-3),y=irnd(2,g.length-3);tries++;if(g[y][x]==='.'&&!(avoid&&avoid(x,y))){g[y][x]=ch;n--;}}}
function gstr(g){return g.map(r=>r.join(''));}

function newMonster(id,lv){
  const sp=SPECIES[id];const st=statsOf(id,lv);
  const moves=[];
  const learn=sp.learn.filter(x=>x[0]<=lv).sort((a,b)=>a[0]-b[0]);
  for(let i=Math.max(0,learn.length-4);i<learn.length;i++)moves.push({id:learn[i][1],pp:MOVES[learn[i][1]].pp});
  if(!moves.length)moves.push({id:'tacada',pp:35});
  return {id,lv,exp:0,hp:st.hp,status:null,moves,stages:{atk:0,def:0,spa:0,spd:0,spe:0,acc:0,eva:0},shiny:false,gender:'?',caughtAt:null};
}
function statsOf(id,lv){return curStatsMon({id,lv});}
function expToNext(lv){return Math.floor(lv*lv*lv*0.8);}
function saveGame(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));AudioSys.blip();showToast('Jogo salvo!');}catch(e){showToast('Falha ao salvar!');}
}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
function loadGame(){
  try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
    const d=JSON.parse(raw);
    if(!d||typeof d!=='object'||!Array.isArray(d.party)||typeof d.map!=='string'||!MAPS[d.map])return false;
    Object.assign(S,d);S.dexSeen=d.dexSeen||{};S.dexCaught=d.dexCaught||{};S.bag=d.bag||{};S.flags=d.flags||{};S.badges=d.badges||[];S.party=d.party||[];
    S.box=d.box||[];S.lastCenter=d.lastCenter||null;
    (S.party||[]).forEach(m=>{if(!m.stages)m.stages={atk:0,def:0,spa:0,spd:0,spe:0,acc:0,eva:0};});
    return true;
  }catch(e){return false;}
}

function map(){return MAPS[S.map];}
function tileChar(mapId,x,y){
  const m=MAPS[mapId];if(!m)return '.';
  if(y<0||y>=m.tiles.length||x<0||x>=m.tiles[0].length)return 'T';
  const row=m.tiles[y];return x<row.length?row[x]:'.';
}
function tileWalkable(mapId,x,y){
  const c=tileChar(mapId,x,y);const t=TILES[c];return !!t&&t.walk;
}
function npcAt(mapId,x,y){
  const m=MAPS[mapId];if(!m||!m.npcs)return null;
  for(const n of m.npcs)if(n.x===x&&n.y===y&&!n.hidden)return n;
  return null;
}
function solidNpc(mapId,x,y){
  const n=npcAt(mapId,x,y);if(!n)return false;
  if(n.gate!==undefined&&S.badges.length>=n.gate+1)return false;
  return true;
}
function canWalk(mapId,x,y){
  return tileWalkable(mapId,x,y)&&!solidNpc(mapId,x,y);
}
const DX={up:0,down:0,left:-1,right:1};
const DY={up:-1,down:1,left:0,right:0};
const OPPOSITE={up:'down',down:'up',left:'right',right:'left'};

function teleport(mapId,x,y,face){
  S.map=mapId;S.x=x;S.y=y;S.dir=face||'down';
  P.x=x;P.y=y;P.dir=face||'down';P.moving=false;P.px=x*TILE_W;P.py=y*TILE_H;
  G.camX=clamp(P.px+8-VIEW_W/2,0,Math.max(0,MAPS[mapId].tiles[0].length*TILE_W-VIEW_W));
  G.camY=clamp(P.py+8-VIEW_H/2,0,Math.max(0,MAPS[mapId].tiles.length*TILE_H-VIEW_H));
  AudioSys.startMusic(MAPS[mapId].music);
  G.mode='overworld';
  clearTap();
  touchBar();
}
function tryStep(dx,dy){
  const nx=P.x+dx,ny=P.y+dy;
  const blockedNpc=solidNpc(S.map,nx,ny);
  const npc=npcAt(S.map,nx,ny);
  if(!tileWalkable(S.map,nx,ny)||blockedNpc){
    if(!blockedNpc){AudioSys.bump();}
    return;
  }
  P.moving=true;P.timer=0;P.dir=dx<0?'left':dx>0?'right':dy<0?'up':'down';
  const tx=nx,ty=ny;
  const wasTall=tileChar(S.map,P.x,P.y)==='G';
  const stepFn=()=>{
    P.x=tx;P.y=ty;P.moving=false;
    if(!S.flags['step_'+S.map+'_'+tx+'_'+ty]&&tileChar(S.map,tx,ty)==='i'){
      S.flags['step_'+S.map+'_'+tx+'_'+ty]=true;
      const item=HIDDEN_ITEMS[S.map+'|'+tx+'|'+ty];
      if(item){S.bag[item]=(S.bag[item]||0)+1;AudioSys.item();showMsg('Você encontrou: '+ITEMS[item].n+'!');}
    }
    if(tileChar(S.map,tx,ty)==='G'&&G.battle===null&&G.mode==='overworld')maybeWild();
    else checkApproach();
    const w=warpAt(tx,ty);
    if(w&&w.kind==='step')doWarp(w);
    else if(!S.flags['door_'+S.map+'_'+tx+'_'+ty]&&tileChar(S.map,tx,ty)==='D'){
      /* porta: interagir manualmente */
    }
  };
  P.stepFn=stepFn;P.tx=tx;P.ty=ty;
}
function warpAt(x,y){
  const m=map();if(!m||!m.warps)return null;
  for(const w of m.warps)if(w.x===x&&w.y===y)return w;
  return null;
}
function doWarp(w){
  let to=w.to,x2=w.x2,y2=w.y2;
  if(to==='back'){
    if(S.prev){to=S.prev.map;x2=S.prev.x;y2=S.prev.y;}
    else{to='town1';x2=12;y2=13;}
  }
  S.prev={map:S.map,x:P.x,y:P.y};
  teleport(to,x2,y2,w.face);
}
/* ---- toque para andar (mobile first) ---- */
const TAP={tx:-1,ty:-1,face:null,interact:false};
function tapTile(){
  const m=map();
  if(TAP.tx<0||TAP.tx>=m.tiles[0].length||TAP.ty<0||TAP.ty>=m.tiles.length)return;
  if(P.x===TAP.tx&&P.y===TAP.ty){
    const it=TAP.interact,face=TAP.face;
    TAP.tx=-1;TAP.ty=-1;TAP.face=null;TAP.interact=false;
    if(face)P.dir=face;
    if(it)doInteract();
    return;
  }
  const sign=v=>v>0?1:v<0?-1:0;
  const dx=TAP.tx-P.x,dy=TAP.ty-P.y;
  const go=(mx,my)=>{
    if(mx===0&&my===0)return false;
    if(canWalk(S.map,P.x+mx,P.y+my)){tryStep(mx,my);return true;}
    return false;
  };
  if(Math.abs(dx)>=Math.abs(dy)){
    if(!go(sign(dx),0))go(0,sign(dy));
  }else{
    if(!go(0,sign(dy)))go(sign(dx),0);
  }
  if(!P.moving){
    const it=TAP.interact,face=TAP.face;
    const stuck=it&&Math.abs(P.x-TAP.tx)+Math.abs(P.y-TAP.ty)===1;
    TAP.tx=-1;TAP.ty=-1;TAP.face=null;TAP.interact=false;
    if(stuck){if(face)P.dir=face;doInteract();}
  }
}
function tapTo(tx,ty){
  if(G.mode!=='overworld'||!MAPS[S.map])return;
  const m=MAPS[S.map];
  if(tx<0||ty<0||tx>=m.tiles[0].length||ty>=m.tiles.length)return;
  const npc=npcAt(S.map,tx,ty);
  const c=tileChar(S.map,tx,ty);
  const isObj=(!!npc)||c==='D'||c==='M'||c==='C'||c==='P'||c==='B'||!!signAt(tx,ty);
  const walkTarget=(x,y)=>{TAP.tx=x;TAP.ty=y;TAP.face=null;TAP.interact=false;};
  if(canWalk(S.map,tx,ty)&&!isObj){walkTarget(tx,ty);return;}
  let best=null,bd=1e9;
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  for(const [dx,dy] of dirs){
    const ax=tx+dx,ay=ty+dy;
    if(!canWalk(S.map,ax,ay))continue;
    const d=Math.abs(P.x-ax)+Math.abs(P.y-ay);
    if(d<bd){bd=d;best={x:ax,y:ay,face:faceOf(tx-ax,ty-ay)};}
  }
  if(!best&&isObj&&canWalk(S.map,tx,ty)){walkTarget(tx,ty);return;}
  if(best){
    TAP.tx=best.x;TAP.ty=best.y;TAP.face=best.face;TAP.interact=isObj;
    return;
  }
  /* bloqueado e não interativo: anda até o tile livre mais próximo */
  for(let yy=-2;yy<=2;yy++)for(let xx=-2;xx<=2;xx++){
    const ax=tx+xx,ay=ty+yy;
    if(!canWalk(S.map,ax,ay))continue;
    const d=Math.abs(ax-tx)+Math.abs(ay-ty);
    if(d<bd){bd=d;best={x:ax,y:ay};}
  }
  if(best)walkTarget(best.x,best.y);
}
function handleTapMove(e){
  const sc=$('screen');if(!sc)return;
  const r=sc.getBoundingClientRect();
  if(!r.width||!r.height)return;
  const ux=(e.clientX-r.left)/r.width*240;
  const uy=(e.clientY-r.top)/r.height*160;
  if(ux<0||uy>=240||uy<0||uy>=160)return;
  const tx=Math.floor((G.camX+ux)/TILE_W);
  const ty=Math.floor((G.camY+uy)/TILE_H);
  tapTo(tx,ty);
}
function clearTap(){TAP.tx=-1;TAP.ty=-1;TAP.face=null;TAP.interact=false;}
function updateWorld(dt){
  G.tick+=dt;
  if(P.moving){
    P.timer+=dt;
    const t=Math.min(1,P.timer/WALK_TIME);
    P.px=P.x*TILE_W+DX[P.dir]*TILE_W*t;
    P.py=P.y*TILE_H+DY[P.dir]*TILE_H*t;
    P.anim=Math.floor(t*4)%2;
    if(t>=1){if(P.stepFn){const f=P.stepFn;P.stepFn=null;f();}}
    return;
  }
  P.anim=0;
  if(G.mode!=='overworld')return;
  if(Input.held.up||Input.held.down||Input.held.left||Input.held.right){
    const dir=Input.held.up?'up':Input.held.down?'down':Input.held.left?'left':'right';
    P.dir=dir;clearTap();
    tryStep(DX[dir],DY[dir]);
    return;
  }
  if(TAP.tx>=0)tapTile();
}
function centerCamera(){
  const m=map();
  G.camX=clamp(P.px+8-VIEW_W/2,0,Math.max(0,m.tiles[0].length*TILE_W-VIEW_W));
  G.camY=clamp(P.py+8-VIEW_H/2,0,Math.max(0,m.tiles.length*TILE_H-VIEW_H));
}
function maybeWild(){
  const m=map();if(!m.wild||G.mode!=='overworld')return;
  if(!chance(0.12))return;
  const roll=Math.random()*100;let acc=0,chosen=m.wild[0];
  for(const w of m.wild){acc+=w[1];if(roll<=acc){chosen=w;break;}}
  const lv=irnd(chosen[2],chosen[3]);
  AudioSys.encounter();
  const mon=newMonster(chosen[0],lv);
  S.dexSeen[chosen[0]]=true;
  G.mode='battle';
  G.battle={type:'wild',opp:{name:SPECIES[chosen[0]].n+' selvagem',species:chosen[0],lv,mon,team:null,isTrainer:false,item:null},wild:true,
    state:'intro',ball:null};
  AudioSys.stopMusic();
  UI.battleOpen();
}
function checkApproach(){
  const m=map();if(!m||!m.npcs||G.mode!=='overworld'||G.battle)return;
  for(const n of m.npcs){
    const d=Math.abs(n.x-P.x)+Math.abs(n.y-P.y);
    if(n.trainer){
      if(S.flags['beat_'+n.id])continue;
      if(d<=2&&facingToward(n,P)){n.dir=faceOf(P.x-n.x,P.y-n.y);n.see=true;startTrainerBattle(n);return;}
    }else if(n.rival){
      if(S.flags['beat_'+n.id])continue;
      if(d<=2){n.dir=faceOf(P.x-n.x,P.y-n.y);n.see=true;startRivalBattle(n,n.id==='rival2'?2:1);return;}
    }else if(n.gym!==undefined){
      if(S.flags['beat_leader'+n.gym]){continue;}
      if(d<=1){n.dir=faceOf(P.x-n.x,P.y-n.y);startGymBattle(n);return;}
    }else if(n.champ){
      if(S.flags.beat_champ)continue;
      if(d<=1){n.dir=faceOf(P.x-n.x,P.y-n.y);startChampBattle();return;}
    }
  }
}
function facingToward(n,p){
  if(n.dir==='left')return p.x<n.x&&Math.abs(p.y-n.y)<=1;
  if(n.dir==='right')return p.x>n.x&&Math.abs(p.y-n.y)<=1;
  if(n.dir==='up')return p.y<n.y&&Math.abs(p.x-n.x)<=1;
  return p.y>n.y&&Math.abs(p.x-n.x)<=1;
}
function faceOf(dx,dy){
  if(Math.abs(dx)>Math.abs(dy))return dx<0?'left':'right';
  return dy<0?'up':'down';
}
function startTrainerBattle(n){
  const team=n.trainer.team.map(([id,lv])=>{const mon=newMonster(id,lv);return {species:id,lv,mon};});
  G.mode='battle';
  G.battle={type:'trainer',opp:{name:n.trainer.name,species:null,lv:0,mon:null,team,isTrainer:true,money:CLS_MONEY[n.trainer.cls]*Math.max(...n.trainer.team.map(t=>t[1])),id:n.id,pre:n.trainer.pre||[],winText:n.trainer.winText||[],sprite:n.sprite},
    state:'intro',wild:false};
  AudioSys.stopMusic();
  UI.battleOpen();
}
function startRivalBattle(n,stage){
  const starter=S.starter||'ignis';
  const counter={ignis:'aquore',aquore:'folhar',folhar:'ignis'}[starter];
  const lvl=[0,6,20][stage];
  const team=RIVAL_TEAMS[stage].team({starter:counter,base:lvl});
  G.mode='battle';
  G.battle={type:'trainer',opp:{name:'Rival',species:null,lv:0,mon:null,
    team:team.map(([id,lv])=>({species:id,lv,mon:newMonster(id,lv)})),isTrainer:true,money:CLS_MONEY.rival*Math.max(5,lvl),id:n.id,pre:RIVAL_TEAMS[stage].pre,winText:RIVAL_TEAMS[stage].win,sprite:'rival',rival:stage},
    state:'intro',wild:false};
  AudioSys.stopMusic();
  UI.battleOpen();
}
function startGymBattle(n){
  const gd=GYM_DEFS[n.gym];
  if(S.badges.length<n.gym){
    showMsg(gd.pre[0]).then(()=>showMsg('Vença os líderes anteriores primeiro!'));
    return;
  }
  S.flags['gymtalk'+n.gym]=true;
  G.mode='battle';
  G.battle={type:'trainer',gym:n.gym,opp:{name:gd.name,species:null,lv:0,mon:null,
    team:gd.team.map(([id,lv])=>({species:id,lv,mon:newMonster(id,lv)})),isTrainer:true,money:CLS_MONEY[gd.cls]*Math.max(...gd.team.map(t=>t[1])),id:'leader'+n.gym,pre:gd.pre,winText:gd.win,sprite:'leader'},
    state:'intro',wild:false};
  AudioSys.stopMusic();
  UI.battleOpen();
}
function startChampBattle(){
  if(S.badges.length<4){
    showMsg('Você ainda não tem todas as insígnias. Volte quando tiver as 4!');
    return;
  }
  const starter=S.starter||'ignis';
  const counter={ignis:'tritan',aquore:'florestus',folhar:'vulcron'}[starter];
  const team=[[counter,47],['dragor',45],['psiao',44],['umbrax',44],['aceir',44],['glacirax',44]];
  G.mode='battle';
  G.battle={type:'trainer',champ:true,opp:{name:CHAMP_DEF.name,species:null,lv:0,mon:null,
    team:team.map(([id,lv])=>({species:id,lv,mon:newMonster(id,lv)})),isTrainer:true,money:CLS_MONEY.campeão*47,id:'champ',pre:CHAMP_DEF.pre,winText:CHAMP_DEF.win,sprite:'boss'},
    state:'intro',wild:false};
  AudioSys.stopMusic();
  UI.battleOpen();
}
function doInteract(){
  if(G.mode!=='overworld')return;
  const tx=P.x+DX[P.dir],ty=P.y+DY[P.dir];
  const npc=npcAt(S.map,tx,ty);
  if(npc){
    if(npc.dir!==P.dir)npc.dir=faceOf(P.x-npc.x,P.y-npc.y);
    if(npc.trainer&&!S.flags['beat_'+npc.id]){startTrainerBattle(npc);return;}
    if(npc.rival&&!S.flags['beat_'+npc.id]){startRivalBattle(npc,npc.id==='rival2'?2:1);return;}
    if(npc.gym!==undefined&&!S.flags['beat_leader'+npc.gym]){startGymBattle(npc);return;}
    if(npc.champ&&!S.flags.beat_champ){startChampBattle();return;}
    if(npc.gate!==undefined&&S.badges.length<npc.gate+1){showMsg(npc.text[0]).then(()=>showMsg(npc.text[1]));return;}
    if(npc.id==='nurse'){S.lastCenter={map:S.map,x:P.x,y:P.y};healAll();showMsg('Seus monstros foram totalmente curados!').then(()=>saveGame());return;}
    if(npc.id==='clerk'){UI.shopOpen();return;}
    if(npc.id==='prof'){if(!S.flags.starter)showMsg('O Professor entrega os monstros iniciais no começo da jornada.');else showMsg('Continue sua jornada, '+S.name+'!');return;}
    if(npc.text)showMsgLines(npc.text);
    return;
  }
  const w=warpAt(tx,ty);
  if(w&&w.kind==='interact'){doWarp(w);return;}
  if(w&&w.kind==='step'){doWarp(w);return;}
  const c=tileChar(S.map,tx,ty);
  if(c==='M'){UI.shopOpen();return;}
  if(c==='C'){S.lastCenter={map:S.map,x:P.x,y:P.y};healAll();showMsg('Seus monstros foram totalmente curados!');return;}
  if(c==='P'){UI.pcOpen();return;}
  const sgn=signAt(tx,ty);
  if(sgn){showMsg(sgn.text);return;}
  if(c==='B'){S.lastCenter={map:S.map,x:P.x,y:P.y};healAll();showMsg('Você descansou na cama e curou seus monstros!');return;}
}
function signAt(x,y){
  const m=map();if(!m||!m.signs)return null;
  for(const s of m.signs)if(s.x===x&&s.y===y)return s;
  return null;
}
function healAll(){for(const m of S.party){m.hp=curStatsMon(m).hp;m.status=null;for(const mv of m.moves)mv.pp=MOVES[mv.id].pp;}AudioSys.heal();}
function showMsgLines(lines,fn){
  let i=0;
  const next=()=>{if(i>=lines.length){if(fn)fn();return;}showMsg(lines[i]).then(next);i++;};
  next();
}

   ============================================================ */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const STAGE_MULT=[0.25,0.28,0.33,0.4,0.5,0.66,1,1.5,2,2.5,3,3.5,4];
const stageMult=v=>STAGE_MULT[clamp(v+6,0,12)];

function pMon(){return S.party[G.battle.pIndex];}
function oMon(){
  const B=G.battle;
  if(B.wild)return B.opp.mon;
  return B.opp.team[B.oIndex]?B.opp.team[B.oIndex].mon:null;
}
function oSpriteInfo(){
  const B=G.battle;
  if(B.wild)return {id:B.opp.species,back:false};
  const t=B.opp.team&&B.opp.team[B.oIndex];return t?{id:t.species,back:false}:null;
}
function curStatsMon(m){const b=SPECIES[m.id].stats,lv=m.lv;
  return {hp:Math.max(1,Math.floor(2*b.hp*lv/100)+lv+10),
    atk:Math.floor(2*b.atk*lv/100)+5,def:Math.floor(2*b.def*lv/100)+5,
    spa:Math.floor(2*b.spa*lv/100)+5,spd:Math.floor(2*b.spd*lv/100)+5,
    spe:Math.floor(2*b.spe*lv/100)+5};}
function maxHp(m){return curStatsMon(m).hp;}
const STATUS_PT={psn:'VEN',brn:'QUE',par:'PAR',slp:'DOR',frz:'CON',conf:'CONF'};

async function battleMain(){
  const B=G.battle;
  B.state='intro';B.over=false;B.oIndex=0;B.pIndex=S.party.findIndex(m=>m.hp>0);
  if(B.pIndex<0)B.pIndex=0;
  AudioSys.startMusic(B.champ?'champion':(B.wild?'battle':'battle'));
  UI.battleRefresh();
  if(B.type==='wild'){
    const om=oMon();S.dexSeen[om.id]=true;
    await battleMsg('Um '+SPECIES[om.id].n+' selvagem apareceu!');
  }else{
    for(const line of B.opp.pre||[])await battleMsg(line);
    await battleMsg(B.opp.name+' quer batalhar!');
  }
  await sendOutPlayer();
  if(B.type==='trainer'&&!B.wild){await battleMsg(B.opp.name+' enviou '+SPECIES[oMon().id].n+'!');S.dexSeen[oMon().id]=true;}
  B.state='command';
  while(!B.over){
    await battleTurn();
  }
  await endBattle();
}
async function sendOutPlayer(){
  const m=pMon();
  await battleMsg('Vá, '+SPECIES[m.id].n+'!');
  UI.battleRefresh();
}
function aiMove(){
  const om=oMon();
  if(!om)return null;
  const cand=om.moves.map((mv,i)=>i).filter(i=>om.moves[i].pp>0);
  if(!cand.length)return null;
  const pm=pMon();
  let best=-1,bestScore=-1;
  for(const i of cand){
    const mv=MOVES[om.moves[i].id];
    let s=5+Math.random()*5;
    if(mv.p>0){
      const eff=speciesTypeMult(SPECIES[pm.id].types,mv.t);
      s+=eff>1?12:eff<1?-6:0;
      if(pm.hp/maxHp(pm)<0.5)s+=2;
    }else if(mv.heal&&om.hp<maxHp(om)*0.6)s+=8;
    if(s>bestScore){bestScore=s;best=i;}
  }
  return best;
}
async function battleTurn(){
  const B=G.battle;
  if(B.over)return;
  B.state='command';
  UI.battleRefresh();
  const pc=await UI.battleCommand();
  if(B.over)return;
  if(pc.type==='run'){
    if(B.type==='trainer'){await battleMsg('Não dá para fugir de uma batalha contra treinadores!');await oppAttack(null);await afterActions();return;}
    const pm=pMon(),om=oMon();
    const chanceF=clamp(0.5+(curStatsMon(pm).spe-curStatsMon(om).spe)*0.02+B.attempts*0.15,0,0.95);
    B.attempts=(B.attempts||0)+1;
    if(chance(chanceF)){await battleMsg('Você fugiu com segurança!');B.over=true;return;}
    await battleMsg('Não conseguiu fugir!');
    await oppAttack(null);await afterActions();return;
  }
  if(pc.type==='item'){await useItemInBattle(pc.item);await afterActions();return;}
  if(pc.type==='switch'){
    await switchIn(pc.idx);
    if(!B.over){await oppAttack(null);await afterActions();}
    return;
  }
  const pm=pMon(),om=oMon();
  const pMoveIdx=pc.i;
  let pMove=pm.moves[pMoveIdx];
  if(!pMove||pMove.pp<=0){
    pMove={id:'tacada',pp:1};
    await battleMsg('Sem PP! Usou uma investida desesperada.');
  }
  const oIdx=aiMove();
  const oMove=oIdx===null?null:om.moves[oIdx];
  if(oMove&&oMove.pp<=0)oMove=null;
  const pSpeed=curStatsMon(pm).spe*stageMult(pm.stages.spe);
  const oSpeed=curStatsMon(om).spe*stageMult(om.stages.spe);
  const pFirst=oMove===null||pSpeed>oSpeed||(pSpeed===oSpeed&&chance(0.5));
  if(pFirst){
    await execAction('player',pMove);
    if(!B.over&&oMove)await execAction('opp',oMove);
  }else{
    await execAction('opp',oMove);
    if(!B.over)await execAction('player',pMove);
  }
  if(!B.over)await afterActions();
}
async function execAction(side,move){
  const B=G.battle;
  const user=side==='player'?pMon():oMon();
  const target=side==='player'?oMon():pMon();
  const mv=MOVES[move.id];
  if(user.hp<=0)return;
  if(move.pp!==undefined&&move.pp>0)move.pp--;
  /* status que impedem ação */
  if(user.status==='slp'){
    user.sleepTurns=(user.sleepTurns||2)-1;
    if(user.sleepTurns<=0){user.status=null;await battleMsg(SPECIES[user.id].n+' acordou!');}
    else{await battleMsg(SPECIES[user.id].n+' está dormindo.');return;}
  }
  if(user.status==='frz'){
    if(chance(0.2)){user.status=null;await battleMsg(SPECIES[user.id].n+' descongelou!');}
    else{await battleMsg(SPECIES[user.id].n+' está congelado!');return;}
  }
  if(user.status==='par'&&chance(0.25)){await battleMsg(SPECIES[user.id].n+' está paralisado e não pode se mover!');return;}
  if(user.conf&&user.conf>0){
    user.conf--;
    if(chance(0.5)){
      await battleMsg(SPECIES[user.id].n+' está confuso e se machucou!');
      const dmg=Math.max(1,Math.floor(maxHp(user)*0.1));
      user.hp=Math.max(0,user.hp-dmg);
      UI.battleFlash('player');
      UI.battleRefresh();
      await wait(350);
      return;
    }
    if(user.conf<=0){user.conf=null;await battleMsg(SPECIES[user.id].n+' saiu da confusão!');}
  }
  /* acurácia (vale para os dois lados) */
  if(mv.a<101){
    const acc=Math.min(1,mv.a/100*stageMult(user.stages.acc||0)/stageMult(target.stages.eva||0));
    if(!chance(acc)){await battleMsg(SPECIES[user.id].n+' errou o ataque!');return;}
  }
  /* movimentos de status */
  if(mv.p===0){
    if(mv.heal){
      const h=Math.floor(maxHp(user)*mv.heal);
      user.hp=Math.min(maxHp(user),user.hp+h);
      await battleMsg(SPECIES[user.id].n+' recuperou energia!');
      UI.battleRefresh();return;
    }
    if(mv.self){
      applyStages(user,mv.self);
      await battleMsg(SPECIES[user.id].n+' usou '+mv.n+'!');
      UI.battleRefresh();return;
    }
    if(mv.leech){
      if(target.leech){await battleMsg('Já está com Dreno de Sementes!');return;}
      target.leech=1;
      await battleMsg(SPECIES[user.id].n+' plantou sementes em '+SPECIES[target.id].n+'!');
      UI.battleRefresh();return;
    }
    if(mv.eff){
      await battleMsg(SPECIES[user.id].n+' usou '+mv.n+'!');
      await applyEffect(user,target,mv.eff);
      UI.battleRefresh();return;
    }
    await battleMsg(SPECIES[user.id].n+' usou '+mv.n+'!');
    return;
  }
  /* ataque com dano */
  const atkStat=curStatsMon(user),defStat=curStatsMon(target);
  const atk=mv.cat==='phys'?atkStat.atk*stageMult(user.stages.atk):atkStat.spa*stageMult(user.stages.spa);
  const def=mv.cat==='phys'?defStat.def*stageMult(target.stages.def):defStat.spd*stageMult(target.stages.spd);
  let dmg=Math.floor((Math.floor(2*user.lv/5+2)*mv.p*atk/def)/50)+2;
  const stab=SPECIES[user.id].types.includes(mv.t)?1.5:1;
  const typeEff=speciesTypeMult(SPECIES[target.id].types,mv.t);
  const crit=chance(mv.crit?1/8:1/16)?2:1;
  const rnd=0.85+Math.random()*0.15;
  dmg=Math.max(1,Math.floor(dmg*stab*typeEff*crit*rnd));
  target.hp=Math.max(0,target.hp-dmg);
  await battleMsg(SPECIES[user.id].n+' usou '+mv.n+'!');
  UI.battleHit(side,crit>1);
  UI.battleRefresh();
  await wait(420);
  if(crit>1)await battleMsg('Golpe crítico!');
  if(typeEff>1)await battleMsg('Foi super eficaz!');
  else if(typeEff<1&&typeEff>0)await battleMsg('Não é muito eficaz...');
  else if(typeEff===0)await battleMsg('Não afetou '+SPECIES[target.id].n+'!');
  if(mv.drain&&target.hp>0){
    const h=Math.max(1,Math.floor(dmg*mv.drain));
    user.hp=Math.min(maxHp(user),user.hp+h);
    await battleMsg(SPECIES[user.id].n+' drenou energia!');
  }
  const chanceEff=mv.eff?('chance'in mv.eff?mv.eff.chance:1):0;
  if(mv.eff&&target.hp>0&&chance(chanceEff))await applyEffect(user,target,mv.eff);
  UI.battleRefresh();
}
function applyStages(m,stages){
  for(const k in stages){
    const v=clamp((m.stages[k]||0)+stages[k],-6,6);
    m.stages[k]=v;
  }
}
async function applyEffect(user,target,eff){
  let msgs=[];
  if(eff.atk)msgs.push(applyStageMsg(target,'atk',eff.atk));
  if(eff.def)msgs.push(applyStageMsg(target,'def',eff.def));
  if(eff.spa)msgs.push(applyStageMsg(target,'spa',eff.spa));
  if(eff.spd)msgs.push(applyStageMsg(target,'spd',eff.spd));
  if(eff.spe)msgs.push(applyStageMsg(target,'spe',eff.spe));
  if(eff.acc)msgs.push(applyStageMsg(target,'acc',eff.acc));
  if(eff.burn&&!target.status){target.status='brn';msgs.push(SPECIES[target.id].n+' foi queimado!');}
  if(eff.par&&!target.status){target.status='par';msgs.push(SPECIES[target.id].n+' foi paralisado!');}
  if(eff.pois&&!target.status){target.status='psn';msgs.push(SPECIES[target.id].n+' foi envenenado!');}
  if(eff.sleep&&!target.status){target.status='slp';target.sleepTurns=irnd(1,3);msgs.push(SPECIES[target.id].n+' adormeceu!');}
  if(eff.freeze&&!target.status){target.status='frz';msgs.push(SPECIES[target.id].n+' foi congelado!');}
  if(eff.conf&&!target.conf){target.conf=irnd(2,4);msgs.push(SPECIES[target.id].n+' ficou confuso!');}
  for(const m of msgs)if(m)await m;
}
async function applyStageMsg(m,stat,delta){
  const pt={atk:'Ataque',def:'Defesa',spa:'Ataque Especial',spd:'Defesa Especial',spe:'Velocidade',acc:'Precisão'}[stat];
  m.stages[stat]=clamp((m.stages[stat]||0)+delta,-6,6);
  const verb=delta>0?'subiu':'caiu';
  await battleMsg(SPECIES[m.id].n+' '+pt+' '+verb+'!');
}
async function afterActions(){
  const B=G.battle;
  if(!B||B.over)return;
  const pm=pMon(),om=oMon();
  if(!om||om.hp<=0){await handleOppFaint();}
  if(B.over)return;
  if(!pm||pm.hp<=0){await handlePlayerFaint();if(B.over)return;await forceSwitch();return;}
  /* efeitos de fim de turno */
  for(const side of ['player','opp']){
    const m=side==='player'?pm:om;
    if(!m||m.hp<=0)continue;
    if(m.status==='psn'||m.status==='brn'){
      const d=Math.max(1,Math.floor(maxHp(m)/8));
      m.hp=Math.max(0,m.hp-d);
      await battleMsg(SPECIES[m.id].n+(m.status==='psn'?' sofreu com o veneno!':' sofreu com a queimadura!'));
      UI.battleRefresh();await wait(300);
    }
    if(m.leech&&m.hp>0){
      const other=side==='player'?om:pm;
      const d=Math.max(1,Math.floor(maxHp(m)/8));
      m.hp=Math.max(0,m.hp-d);
      if(other.hp>0)other.hp=Math.min(maxHp(other),other.hp+d);
      await battleMsg('As sementes drenaram energia de '+SPECIES[m.id].n+'!');
      UI.battleRefresh();await wait(300);
    }
  }
  if(om.hp<=0){await handleOppFaint();}
  if(!B.over&&pm.hp<=0){await handlePlayerFaint();if(!B.over)await forceSwitch();}
}
async function handleOppFaint(){
  const B=G.battle;if(!B)return;
  const om=oMon();
  if(!om||om.hp>0)return;
  await battleMsg('O '+SPECIES[om.id].n+' de '+B.opp.name+' desmaiou!');
  UI.battleFaint('opp');
  await wait(450);
  const pm=pMon();
  /* XP */
  if(pm&&pm.hp>0){
    const base=SPECIES[om.id].xp;
    let gain=Math.floor(base*om.lv/7);
    if(B.type==='trainer')gain=Math.floor(gain*1.5);
    pm.exp+=gain;
    await battleMsg(SPECIES[pm.id].n+' ganhou '+gain+' de experiência!');
    while(pm.exp>=expToNext(pm.lv)){
      pm.exp-=expToNext(pm.lv);pm.lv++;
      await levelUp(pm);
      await tryEvolve(pm);
    }
  }
  if(B.type==='trainer'){
    B.oIndex++;
    if(B.oIndex<B.opp.team.length){
      const next=B.opp.team[B.oIndex];
      S.dexSeen[next.species]=true;
      await battleMsg(B.opp.name+' enviou '+SPECIES[next.species].n+'!');
      UI.battleRefresh();return;
    }
    await battleWin();
    return;
  }
  /* selvagem venceu */
  await battleWin();
}
async function handlePlayerFaint(){
  const B=G.battle;if(!B)return;
  const pm=pMon();
  if(!pm||pm.hp>0)return;
  await battleMsg(SPECIES[pm.id].n+' desmaiou!');
  UI.battleFaint('player');
  await wait(450);
}
async function forceSwitch(){
  const B=G.battle;if(!B)return;
  const alive=S.party.map((m,i)=>i).filter(i=>S.party[i].hp>0);
  if(!alive.length){await whiteOut();return;}
  await battleMsg('Escolha seu próximo monstro!');
  const r=await UI.battleSwitch(alive);
  const idx=r==='back'?alive[0]:alive[r];
  B.pIndex=idx;
  await sendOutPlayer();
  if(!B.over)await oppAttack(null);
}
async function oppAttack(move){
  if(B_OVER_GUARD())return;
  const B=G.battle;if(!B)return;
  const oIdx=move!==undefined?move:aiMove();
  if(oIdx===null)return;
  const om=oMon();
  if(!om||om.hp<=0)return;
  const mv=om.moves[oIdx];
  if(mv&&mv.pp>0)await execAction('opp',mv);
}
function B_OVER_GUARD(){return G.battle&&G.battle.over;}
async function battleWin(){
  const B=G.battle;
  if(B.type==='trainer'){
    const reward=B.opp.money||0;
    S.money+=reward;
    if(B.opp.id)S.flags['beat_'+B.opp.id]=true;
    if(B.rival)S.flags['rival_'+B.opp.id]=1;
    AudioSys.cash();
    await battleMsg('Você venceu '+B.opp.name+'!');
    await battleMsg('Ganhou ₽'+reward+' pela vitória!');
    for(const line of B.opp.winText||[])await battleMsg(line);
    if(B.gym!==undefined&&!S.badges.includes(B.gym)){
      const gd=GYM_DEFS[B.gym];
      S.badges.push(B.gym);
      AudioSys.evolve();
      await battleMsg('Recebeu a '+gd.badge+'!');
      S.flags['beat_leader'+B.gym]=true;
      if(B.gym===3){await battleMsg('Você tem todas as 4 insígnias!','center');await battleMsg('Vá desafiar o Campeão na Cidade Dragão!','center');}
    }
    if(B.champ&&!S.flags.beat_champ){
      S.flags.beat_champ=true;
      await battleMsg('Parabéns! Você é o novo Campeão!','center');
    }
  }else{
    await battleMsg('Ganhou! O '+SPECIES[oMon().id].n+' selvagem fugiu!');
  }
  B.over=true;
}
/* posição externa da porta do Centro mais recente (para o warp "voltar" pós-whiteout) */
function centerOutside(){
  if(S.lastCenter&&S.lastCenter.map!=='center_int'){
    const m=MAPS[S.lastCenter.map];
    const w=m&&m.warps?m.warps.find(w=>w.to==='center_int'):null;
    if(w)return {map:S.lastCenter.map,x:w.x,y:w.y};
  }
  for(const id in MAPS){
    const m=MAPS[id];
    const w=m&&m.warps?m.warps.find(w=>w.to==='center_int'):null;
    if(w)return {map:id,x:w.x,y:w.y};
  }
  return null;
}
async function whiteOut(){
  const B=G.battle;
  await battleMsg('Você não tem mais monstros capazes de lutar!');
  await battleMsg('Você desmaiou... e foi levado ao Centro Pokémon.');
  S.money=Math.floor(S.money/2);
  healAll();
  const wake=centerOutside();
  if(wake)S.prev=wake;
  if(S.lastCenter){teleport(S.lastCenter.map,S.lastCenter.x,S.lastCenter.y,'up');}
  else teleport('center_int',6,8,'down');
  B.over=true;
}
async function switchIn(idx){

  await sendOutPlayer();
}
/* captura */
async function useItemInBattle(itemId){
  const B=G.battle;const it=ITEMS[itemId];
  if(!B.wild&&it.type!=='heal'&&it.type!=='status'&&it.type!=='revive'){
    await battleMsg('Não dá para usar isso aqui!');return;
  }
  S.bag[itemId]--;
  if(it.type==='ball'){
    if(!B.wild){await battleMsg('Não dá para capturar monstros de treinadores!');return;}
    const om=oMon();
    await battleMsg('Você jogou a '+it.n+'!');
    UI.battleBall();
    await wait(650);
    if(B.over)return;
    const om2=oMon();if(!om2){B.over=true;return;}
    const max=maxHp(om);
    const a=Math.floor(((3*max-2*om.hp)*SPECIES[om.id].catch*it.bonus)/(3*max));
    const statusBonus=om.status?2:1;
    const chanceCatch=clamp((a+1)*statusBonus/255,0,1);
    let caught=chanceCatch>=1||chance(chanceCatch);
    if(caught){
      AudioSys.catch();
      await battleMsg('Conseguiu! '+SPECIES[om.id].n+' foi capturado!');
      S.dexCaught[om.id]=true;
      if(S.party.length<6){
        S.party.push(om);
        await battleMsg(SPECIES[om.id].n+' foi para a sua equipe!');
      }else{
        S.box=(S.box||[]);
        S.box.push(om);
        await battleMsg(SPECIES[om.id].n+' foi para o PC!');
      }
      B.over=true;return;
    }
    AudioSys.fail();
    await battleMsg('Ah, não! O '+SPECIES[om.id].n+' escapou!');
    return;
  }
  if(it.type==='candy'){
    const pm=pMon();
    if(pm.hp<=0){await battleMsg('Não dá para usar em um monstro desmaiado!');S.bag[itemId]++;return;}
    pm.exp+=expToNext(pm.lv);pm.lv++;
    await battleMsg(SPECIES[pm.id].n+' subiu de nível!');
    await levelUp(pm);await tryEvolve(pm);
    return;
  }
  const pm=pMon();
  if(pm.hp<=0){await battleMsg('Não dá para usar nisso agora!');S.bag[itemId]++;return;}
  if(it.type==='heal'){
    if(pm.hp>=maxHp(pm)){await battleMsg('Os PS já estão no máximo!');S.bag[itemId]++;return;}
    pm.hp=Math.min(maxHp(pm),pm.hp+it.heal);
    AudioSys.heal();
    await battleMsg('Usou '+it.n+'! '+SPECIES[pm.id].n+' recuperou PS!');
    UI.battleRefresh();return;
  }
  if(it.type==='status'){
    if(!pm.status&&pm.conf!==undefined&&!pm.conf){await battleMsg('Não há condição de status!');S.bag[itemId]++;return;}
    if(!pm.status&&!pm.conf){await battleMsg('Não há condição de status!');S.bag[itemId]++;return;}
    pm.status=null;pm.conf=null;
    await battleMsg('Usou '+it.n+'! '+SPECIES[pm.id].n+' foi curado!');
    UI.battleRefresh();return;
  }
  if(it.type==='revive'){
    if(pm.hp>0){await battleMsg('O monstro ainda pode lutar!');S.bag[itemId]++;return;}
    pm.hp=Math.floor(maxHp(pm)/2);
    await battleMsg('Usou '+it.n+'! '+SPECIES[pm.id].n+' reviveu!');
    UI.battleRefresh();return;
  }
}
async function levelUp(m){
  const oldMax=maxHp({id:m.id,lv:m.lv-1});
  const newMax=maxHp(m);
  const gained=Math.max(0,newMax-oldMax);
  AudioSys.levelup();
  await battleMsg(SPECIES[m.id].n+' subiu para o nível '+m.lv+'!');
  m.hp=Math.min(newMax,m.hp+gained);
  UI.battleRefresh();
  /* aprender movimento */
  const sp=SPECIES[m.id];
  const learnMove=sp.learn.filter(x=>x[0]===m.lv).map(x=>x[1]);
  for(const mvId of learnMove){
    if(m.moves.length<4){
      m.moves.push({id:mvId,pp:MOVES[mvId].pp});
      await battleMsg(SPECIES[m.id].n+' aprendeu '+MOVES[mvId].n+'!');
    }else{
      await battleMsg(SPECIES[m.id].n+' quer aprender '+MOVES[mvId].n+'.');
      let choice=await UI.learnMove(m,mvId);
      if(choice==='back')choice=4;
      if(choice>=0&&choice<4){
        const oldId=m.moves[choice].id;
        m.moves[choice]={id:mvId,pp:MOVES[mvId].pp};
        await battleMsg('Esqueceu '+MOVES[oldId].n+'. Aprendeu '+MOVES[mvId].n+'!');
      }else{
        await battleMsg('Não aprendeu '+MOVES[mvId].n+'.');
      }
    }
  }
}
async function tryEvolve(m){
  const sp=SPECIES[m.id];
  const evo=sp.evo?sp.evo.find(e=>e.lv===m.lv):null;
  if(!evo)return;
  if(S.flags['noevo_'+m.id+'_'+evo.to])return;
  await battleMsg(SPECIES[m.id].n+' está evoluindo!');
  UI.battleEvolve();
  await wait(1400);
  await battleMsg(SPECIES[m.id].n+' evoluiu para '+SPECIES[evo.to].n+'!');
  const beforeTypes=sp.types.slice();
  m.id=evo.to;
  S.dexSeen[evo.to]=true;S.dexCaught[evo.to]=true;
  AudioSys.evolve();
  UI.battleRefresh();
}
async function endBattle(){
  const B=G.battle;
  if(!B){return;}
  const wasWild=B.wild;
  UI.battleClose();
  document.body.classList.remove('in-battle');
  G.battle=null;

    healAll();

    if(wake)S.prev=wake;
    if(S.lastCenter)teleport(S.lastCenter.map,S.lastCenter.x,S.lastCenter.y,'up');

  saveGame();
}

      });
      if(items.length&&body.scrollHeight>body.clientHeight+1){
        const s=body.querySelector('.sel');if(s)s.scrollIntoView({block:'nearest'});
      }
    };
    /* tocar fora do painel fecha a lista (mobile).
       Guarda de tempo: ignora eventos residuais do MESMO toque que abriu a lista. */
    const openTime=performance.now();
    const stale=()=>performance.now()-openTime<180;
    const onDocUp=e=>{
      if(stale())return;
      if(panel.contains(e.target))return;
      if(e.target.closest&&e.target.closest('button,.row,.mrow,.crow,.prow,.drow,.opt,.tm,.choice,input,textarea,#tbar'))return;
      if(document.body.classList.contains('touch')&&e.pointerType==='mouse')return;
      AudioSys.cancel();UI.clickLock=performance.now()+350;cleanup();res('back');
    };
    document.addEventListener('pointerup',onDocUp);
    const cleanup=()=>{ov.remove();document.removeEventListener('pointerup',onDocUp);UI.onA=null;UI.onB=null;UI.keyNav=null;UI.msgResolve=null;touchBar();};
    touchBar();
    const nav=dir=>{
      AudioSys.blip();
      const n=typeof dir==='string'?(dir==='up'||dir==='left'?-1:1):(dir>0?1:-1);
      if(cols>1)sel=(sel+n+items.length)%items.length;
      else sel=Math.min(items.length-1,Math.max(0,sel+n));
      render();
    };
    UI.keyNav=dir=>nav(dir);
    UI.onA=()=>{if(items.length&&!stale()){AudioSys.confirm();cleanup();res(sel);}};
    UI.onB=()=>{AudioSys.cancel();cleanup();res('back');};
    render();
  });
}

async function useItemOutOfBattle(id){
  const it=ITEMS[id];
  if(it.type==='heal'||it.type==='status'||it.type==='revive'){
    const alive=S.party.map((m,i)=>i);
    const idx=await listUI(alive,{title:'Usar em qual monstro?',render:(i)=>{

      row.appendChild(cv);
      row.appendChild(el('span','',SPECIES[m.id].n+' ('+m.hp+'/'+curStatsMon(m).hp+')'));
      return row;
    }});
    if(idx==='back')return;
    const m=S.party[idx];
    if(it.type==='heal'&&m.hp>=curStatsMon(m).hp){showToast('PS já está no máximo!');return;}
    if(it.type==='status'&&!m.status&&!m.conf){showToast('Sem condição de status!');return;}
    if(it.type==='revive'&&m.hp>0){showToast('O monstro ainda pode lutar!');return;}
    S.bag[id]--;
    if(it.type==='heal')m.hp=Math.min(curStatsMon(m).hp,m.hp+it.heal);
    if(it.type==='status'){m.status=null;m.conf=null;}
    if(it.type==='revive')m.hp=Math.floor(curStatsMon(m).hp/2);
    AudioSys.heal();
    showToast('Usou '+it.n+'!');
    return;
  }
  if(it.type==='candy'){
    const idx=await listUI(S.party.map((m,i)=>i),{title:'Usar em qual monstro?',render:(i)=>{
      const m=S.party[i];return el('span','',SPECIES[m.id].n+' (Lv.'+m.lv+')');
    }});
    if(idx==='back')return;
    S.bag[id]--;const m=S.party[idx];
    m.exp+=expToNext(m.lv);
    m.lv++;
    await levelUp(m);
    await tryEvolve(m);
    return;
  }
  showMsg('Só pode ser usado em batalhas contra monstros selvagens!');
}

function battleMsg(text,align){
  const box=uiRoot().querySelector('.battle-msg');

  return new Promise(res=>{
    const seq=++bmsgSeq;
    box.classList.remove('hidden');

    const t=box.querySelector('.btxt');if(!t)return showMsg(text,align);
    t.textContent='';

    let i=0;

      if(seq!==bmsgSeq){clearInterval(iv);return;}
      i+=2;t.textContent=text.slice(0,i);
      if(i>=text.length){
        clearInterval(iv);ar.style.display='block';
        UI.msgResolve=()=>{UI.msgResolve=null;UI.clickLock=performance.now()+300;box.classList.add('hidden');t.textContent='';ar.style.display='none';if(grid)grid.classList.remove('hidden');res();};

      if(wrap)wrap.style.display='none';
      return;
    }
    wrap.style.display='';
    const img=monsterSprite(SPECIES[info.id],info.back===true,4);
    const c=ov.querySelector(canvasSel);c.width=80;c.height=80;
    c.getContext('2d').drawImage(img,0,0,80,80);
    const box=ov.querySelector(boxSel);if(!box)return;
    const name=box.querySelector('.bname');name.textContent=SPECIES[mon.id].n;
    const lv=box.querySelector('.lv');lv.textContent='Nv.'+mon.lv;
    const num=box.querySelector('.hpnum');num.textContent=mon.hp+'/'+maxHp(mon);
    const types=SPECIES[mon.id].types||[];
    const chip=box.querySelector('.btype');
    if(chip){chip.textContent=types.length?TYPE_PT[types[0]]:'';chip.style.background=types.length?TYPE_COLOR[types[0]]:'transparent';}
    const fill=box.querySelector('.hpfill');
    const pct=mon.hp/maxHp(mon)*100;
    fill.style.width=Math.max(0,pct)+'%';
    fill.className='hpfill'+(pct<25?' low':pct<50?' mid':'');
    fill.classList.toggle('warn',mon.hp>0&&pct<20);
  };
  drawMon('.opp','.ohp','.opp canvas',om?oSpriteInfo():null,om);
  drawMon('.ply','.php','.ply canvas',pm?{id:pm.id,back:true}:null,pm);
  UI.battleRefresh=battleRefresh;
  const st=ov.querySelector('#bst');
  const sList=[];
  if(pm){if(pm.status)sList.push('SEU: '+STATUS_PT[pm.status]);if(pm.conf)sList.push('SEU: CONF');}
  if(om){if(om.status)sList.push('INI: '+STATUS_PT[om.status]);if(om.conf)sList.push('INI: CONF');}
  st.textContent=sList.join('  ');
  st.classList.toggle('hidden',!sList.length);
}
function battleHit(side,crit){
  const ov=uiRoot().querySelector('#battle');if(!ov)return;
  const el=ov.querySelector(side==='player'?'.ply':'.opp');
  if(el){el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),300);}
  const fx=ov.querySelector('#bfx');
  if(crit&&fx){fx.classList.add('flash');setTimeout(()=>fx.classList.remove('flash'),140);}
  if(crit&&ov&&!ov.classList.contains('shake')){ov.classList.add('shake');setTimeout(()=>ov.classList.remove('shake'),400);}
  const atk=ov.querySelector(side==='player'?'.opp':'.ply');
  if(atk){
    atk.style.setProperty('--lx',side==='player'?'-30px':'30px');
    atk.classList.add('lunge');setTimeout(()=>atk.classList.remove('lunge'),360);
  }
  burstFx(fx,el,crit?14:8);
}
function burstFx(fx,src,n){
  if(!fx||!src)return;
  const fr=fx.getBoundingClientRect();if(!fr.width||!fr.height)return;
  const er=src.getBoundingClientRect();
  const cx=(er.left+er.width/2-fr.left)/fr.width*240;
  const cy=(er.top+er.height/2-fr.top)/fr.height*160;
  for(let i=0;i<n;i++){
    const sp=el('span','p'+(i%3===0?' w2':''));
    const ang=Math.random()*Math.PI*2,dist=16+Math.random()*22;
    sp.style.left=cx+'px';sp.style.top=cy+'px';
    sp.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(1)+'px');
    sp.style.setProperty('--dy',(Math.sin(ang)*dist).toFixed(1)+'px');
    fx.appendChild(sp);setTimeout(()=>sp.remove(),650);
  }
}
function battleFaint(side){
  const ov=uiRoot().querySelector('#battle');if(!ov)return;

}

async function bagMenu(){
  const usable=ITEM_ORDER.filter(id=>S.bag[id]>0);

    render:(id,i,sel)=>{

async function partyMenu(){
  const alive=S.party.map((m,i)=>i).filter(i=>S.party[i].hp>0);
  const idx=await listUI(alive,{title:'ESCOLHA',keep:true,render:(i)=>{
    const m=S.party[i];
    return el('span','',SPECIES[m.id].n+' ('+m.hp+'/'+curStatsMon(m).hp+')');
  }});
  if(BUI.open&&idx!=='back'){AudioSys.confirm();BUI.resolve({type:'switch',idx:alive[idx]});}

function gridShow(opts){
  BUI.grid=opts;BUI.sel=0;
  const c=uiRoot().querySelector('#bcmd');if(!c)return;
  c.classList.remove('hidden');
  c.innerHTML='';
  opts.forEach((o,i)=>{
    const d=el('div','opt'+(i===0?' sel':''));
    let html='<span class="gt">'+(o.ic?'<span class="ic">'+o.ic+'</span>':'')+esc(o.t)+'</span>';
    if(o.tag||o.sub!==undefined){
      html+='<span class="gs">'+(o.tag?'<span class="tag" style="background:'+TYPE_COLOR[o.tag]+'">'+TYPE_PT[o.tag]+'</span>':'')+(o.sub!==undefined?esc(o.sub):'')+'</span>';
    }
    d.innerHTML=html;
    if(o.enabled===false)d.style.opacity='.35';
    d.onclick=()=>{if(o.enabled!==false){AudioSys.confirm();o.fn();}};
    c.appendChild(d);
  });
  const firstEnabled=opts.findIndex(o=>o.enabled!==false);
  BUI.sel=firstEnabled<0?0:firstEnabled;
  gridRenderSel();
  const nextEnabled=(from,dir)=>{
    for(let n=1;n<=opts.length;n++){
      const i=(from+dir*n+opts.length)%opts.length;
      if(opts[i].enabled!==false)return i;
    }
    return -1;
  };
  UI.keyNav=d=>{
    AudioSys.blip();
    let ns=BUI.sel;
    if(d==='up'||d==='down')ns=BUI.sel+(d==='up'?-2:2);
    else ns=BUI.sel+(d==='left'?-1:1);
    if(ns<0||ns>=opts.length)ns=nextEnabled(BUI.sel,1);
    if(ns<0||opts[ns].enabled===false)ns=nextEnabled(ns,1);
    if(ns<0)return;
    BUI.sel=ns;gridRenderSel();
  };
  UI.onA=()=>{
    let o=opts[BUI.sel];
    if(o&&o.enabled===false)o=opts[nextEnabled(BUI.sel,1)];
    if(o&&o.enabled!==false){AudioSys.confirm();o.fn();}
  };
  UI.onB=()=>{AudioSys.cancel();if(BUI.cmdMode!=='main')mainGrid();};
}
function gridRenderSel(){
  const c=uiRoot().querySelector('#bcmd');if(!c)return;
  [...c.children].forEach((d,i)=>d.classList.toggle('sel',i===BUI.sel));
}
